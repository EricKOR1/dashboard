<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; frame-src https://accounts.google.com">
<meta name="theme-color" id="themeColor" content="#F3EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>My Dashboard</title>
<style>
  /* ===== 기본 (색·모서리·그림자는 모두 PC 테마 값) ===== */
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;}
  body{min-height:100vh; color:var(--text); background:var(--bg); background-attachment:fixed;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);}
  button,input,textarea{font:inherit; color:inherit;}
  button{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  body, .txt, .dd .n{word-break:keep-all; overflow-wrap:anywhere;}   /* 한글 낱말 중간에서 줄이 바뀌지 않게 */
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 56px;}

  /* 상단 줄 */
  .bar{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) max(16px, calc((100% - 560px)/2 + 16px)) 8px;
    background:color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter:saturate(1.3) blur(14px); backdrop-filter:saturate(1.3) blur(14px);}
  .bar .st{flex:1; min-width:0; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar .st.err{color:var(--danger); font-weight:600;}
  .ib{flex:none; width:40px; height:40px; display:grid; place-items:center; padding:0; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);}
  .ib svg{width:19px; height:19px;}

  /* 오늘 */
  .today{padding:14px 2px 4px;}
  .today .date{margin:0; font-size:34px; line-height:1.1; font-weight:800; letter-spacing:-.035em;}
  .today .dow{display:block; margin-top:6px; font-size:15px; font-weight:600; letter-spacing:0; color:var(--muted);}
  .today .sum{margin:12px 0 0; font-size:15px;}

  /* 카드 (PC 위젯과 같은 틀) */
  .card{position:relative; margin-top:14px; padding:15px 16px 14px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);}
  .card > .head, .card > .body{position:relative; z-index:1;}
  .card .head{display:flex; align-items:center; gap:8px; min-height:24px; margin-bottom:6px;}
  .card .head .ttl{flex:1; min-width:0; margin:0; font-size:13.5px; font-weight:700; line-height:1.3;}
  .tool{flex:none; padding:6px 2px; border:none; background:none; color:inherit; opacity:.72; font-size:13px; font-weight:600;}

  /* 입력칸·버튼 (PC와 같은 이름) */
  input,textarea{font-family:inherit; color:var(--text); background:var(--bg-soft); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 12px; outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  .mini{min-height:44px; padding:0 16px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:600;
    background:var(--card); color:var(--text); border:1px solid var(--border);}
  .mini.go{background:var(--accent-soft); color:var(--accent-2); border-color:transparent; font-weight:700;}

  /* 할 일 */
  .row{display:flex; align-items:center; gap:12px; min-height:50px; padding:6px 0; border-top:1px solid var(--border);}
  .row:first-child{border-top:none;}
  .chk{flex:none; width:24px; height:24px; display:grid; place-items:center; padding:0; border-radius:50%;
    border:2px solid var(--border-strong); background:none; color:var(--accent-ink);}
  .chk svg{width:13px; height:13px; opacity:0;}
  .row.done .chk{background:var(--accent); border-color:var(--accent);}
  .row.done .chk svg{opacity:1;}
  .row.done .txt{color:var(--faint); text-decoration:line-through;}
  .txt{flex:1; min-width:0; padding:4px 0; border:none; background:none; text-align:left; font-size:15.5px;}
  .due{flex:none; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .due.now{color:var(--accent-2); font-weight:700;}
  .due.late{color:var(--danger); font-weight:600;}
  .del{flex:none; width:32px; height:32px; padding:0; border:none; background:none; color:var(--faint); font-size:14px; border-radius:var(--radius-sm);}
  .more{display:block; width:100%; min-height:44px; padding:0; border:none; border-top:1px solid var(--border);
    background:none; color:var(--muted); font-size:13.5px; font-weight:600; text-align:left;}
  .add{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-top:8px; padding-top:12px; border-top:1px solid var(--border);}
  .add input{min-width:0; height:44px;}
  .add input:first-child{grid-column:1 / -1;}             /* 글 입력칸은 한 줄 전체, 날짜·추가는 아래 줄 */
  .add input[type=date]{padding:0 10px;}
  .add .mini{min-width:76px;}
  .empty{padding:8px 0 12px; color:var(--faint); font-size:14.5px;}

  /* 메모 목록 (PC와 같은 목록 · 색) */
  .nt{border-top:1px solid var(--border);}
  .nt:first-child{border-top:none;}
  .nt-h{display:flex; align-items:center; gap:10px; width:100%; min-height:50px; padding:6px 2px; border:none; background:none;
    text-align:left; color:var(--text); font-size:15.5px;}
  .nt-dot{flex:none; width:10px; height:10px; border-radius:50%; background:var(--nc,transparent); box-shadow:inset 0 0 0 1.5px var(--border-strong);}
  .nt-t{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nt-d{flex:none; font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums;}
  .nt.open{box-shadow:inset 3px 0 0 var(--nc,transparent);}
  .nt.open .nt-h{padding-left:12px;}
  .memo-st{font-size:12px; color:var(--faint); min-height:22px;}
  .nt-f{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 0 8px 12px;}
  .nt-x{flex:none; padding:6px 2px; border:none; background:none; color:var(--danger); font-size:13.5px; font-weight:600;}

  /* D-Day */
  .dd{display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 0; border-top:1px solid var(--border);}
  .dd:first-child{border-top:none;}
  .dd .n{flex:1; min-width:0;}
  .dd .d{font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums;}
  .dd .v{flex:none; font-size:21px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .dd .v.soon{color:var(--accent-2);}
  .dd .v.past{color:var(--faint); font-weight:600;}

  /* 바로가기 */
  .links{display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 4px;}
  .lk{display:inline-flex; align-items:center; gap:6px; min-height:42px; max-width:100%; padding:0 14px;
    border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:15px;}
  .lk span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lk .x{border:none; background:none; color:var(--faint); padding:0 0 0 4px; font-size:14px;}
  .pconly{margin-top:30px; font-size:13px; color:var(--faint); line-height:1.7;}

  /* 안내 화면 */
  .hello{padding:12vh 4px 0;}
  .hello h1{margin:0 0 12px; font-size:30px; line-height:1.25; letter-spacing:-.03em;}
  .hello p{margin:0 0 26px; color:var(--muted);}
  .big{display:block; width:100%; min-height:52px; border:none; border-radius:var(--radius-sm);
    background:var(--accent); color:var(--accent-ink); font-size:16.5px; font-weight:700;}
  .big.sub{margin-top:10px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:15px; font-weight:600;}
  .note{margin-top:22px; font-size:13.5px; color:var(--muted); line-height:1.75;}
  .alert{margin:0 0 16px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--card); border:1px solid var(--danger);
    color:var(--danger); font-size:14px;}
  .toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60;
    max-width:calc(100% - 36px); padding:11px 18px; border-radius:var(--radius-sm); background:var(--text); color:var(--bg);
    font-size:14px; display:none;}
  .toast.on{display:block;}

  /* 아래에서 올라오는 창 */
  .menu{position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; background:rgba(0,0,0,.34);}
  .menu.on{display:flex;}
  .menu .sheet{width:100%; max-width:560px; max-height:88vh; overflow:auto; margin:0 auto; color:var(--text);
    background:linear-gradient(var(--card),var(--card)), var(--bg); border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -12px 40px rgba(0,0,0,.2);}
  .menu .sheet::before{content:""; display:block; width:40px; height:4px; margin:0 auto 14px; border-radius:2px; background:var(--border-strong);}
  .menu .sheet h2{margin:0 0 12px; font-size:18px;}
  .menu .sheet p{margin:0 0 14px; color:var(--muted); font-size:14px; word-break:break-all;}

  /* 화면 꾸미기 창 */
  .swrow{display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft);}
  .swrow .tx{flex:1; min-width:0;}
  .swrow b{display:block; font-size:15px;}
  .swrow i{display:block; margin-top:2px; font-style:normal; font-size:12.5px; line-height:1.5; color:var(--muted);}
  .tg-h{margin:18px 2px 8px; font-size:13px; font-weight:700; color:var(--muted);}
  .tgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .tile{display:block; padding:0; border:none; border-radius:16px; overflow:hidden; text-align:left; background:var(--bg-soft);
    color:var(--text); box-shadow:0 0 0 1px var(--border);}
  .tile .tp{display:block; height:72px; padding:12px; background:var(--bg);}
  .tile .tc{display:block; height:100%; padding:9px 10px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-sm); box-shadow:var(--shadow);}
  .tile .tc i{display:block; height:6px; border-radius:3px;}
  .tile .tc i:first-child{width:46%; background:var(--accent);}
  .tile .tc i + i{width:78%; margin-top:7px; background:var(--faint); opacity:.55;}
  .tile .tn{display:block; padding:9px 11px 10px;}
  .tile .tn b{display:block; font-size:13.5px;}
  .tile .tn small{display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile.on{box-shadow:0 0 0 3px var(--accent);}
  .tile.on .tn b::after{content:" ✓"; color:var(--accent-2);}

  /* ===== PC 테마 (PC index.html에서 자동으로 옮겨 온 모양) ===== */
:root,[data-theme="light"]{--bg:#F3EFE6;--bg-soft:#FBF9F2;--card:#FFFFFF;--card-2:#F6F1E7;--border:#E8E1D0;--border-strong:#D7CDB6;--text:#231D12;--muted:#7F7666;--faint:#AEA48F;--accent:#B88923;--accent-2:#9A7115;--accent-soft:rgba(184,137,35,.12);--accent-ink:#2A2005;--teal:#2E9E92;--danger:#D25A50;--good:#3F9E55;--dot:rgba(70,56,28,.06);--radius:20px;--radius-sm:12px;--shadow:0 1px 2px rgba(56,44,20,.05), 0 14px 34px -20px rgba(56,44,20,.18);--shadow-lift:0 5px 12px rgba(56,44,20,.08), 0 26px 52px -18px rgba(56,44,20,.22)}
[data-theme="dark"]{--bg:#181510;--bg-soft:#201B14;--card:#231E15;--card-2:#2C2618;--border:#342D1E;--border-strong:#48402C;--text:#F2EDE2;--muted:#A79D8B;--faint:#746B59;--accent:#E7BD54;--accent-2:#D2A539;--accent-soft:rgba(231,189,84,.15);--accent-ink:#241C05;--teal:#7FD6CC;--danger:#E5736B;--good:#86C98B;--dot:rgba(255,240,219,.05);--shadow:0 2px 4px rgba(0,0,0,.25), 0 18px 40px -20px rgba(0,0,0,.5);--shadow-lift:0 6px 14px rgba(0,0,0,.3), 0 26px 52px -16px rgba(0,0,0,.55)}
[data-theme="bento"]{--bg:#0D0D0F;--bg-soft:#141417;--card:#17171B;--card-2:#1F1F24;--border:#232329;--border-strong:#33333B;--text:#FFFFFF;--muted:#808089;--faint:#65656C;--accent:#D63B2F;--accent-2:#E85A4E;--accent-soft:rgba(214,59,47,.15);--accent-ink:#FFFFFF;--teal:#2CB67D;--danger:#D63B2F;--good:#2CB67D;--dot:rgba(255,255,255,.025);--radius:20px;--radius-sm:14px;--shadow:none;--shadow-lift:0 10px 34px rgba(0,0,0,.65)}
[data-theme="bento"] body{background:var(--bg)}
[data-theme="bento"] .card{padding:14px 16px 13px;border:none}
[data-theme="bento"] .card .head{margin-bottom:9px}
[data-theme="bento"] .card .head .ttl{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
[data-theme="bento"] .mini{border-radius:999px;border:none;background:var(--card-2)}
[data-theme="bento"] input,[data-theme="bento"] textarea{border-radius:14px;border:none;background:var(--card-2)}
[data-theme="hud"]{--bg:#0B0E14;--bg-soft:#0F131B;--card:rgba(0,229,160,.035);--card-2:rgba(0,229,160,.07);--border:#1E4D3E;--border-strong:#00E5A0;--text:#00E5A0;--muted:#3D6B5C;--faint:#2A5044;--accent:#00E5A0;--accent-2:#00FFB0;--accent-soft:rgba(0,229,160,.12);--accent-ink:#0B0E14;--teal:#00E5A0;--danger:#FF3B5C;--good:#00E5A0;--dot:rgba(0,229,160,.05);--radius:0px;--radius-sm:0px;--shadow:none;--shadow-lift:0 0 24px rgba(0,229,160,.25)}
[data-theme="hud"] body{background:repeating-linear-gradient(0deg, rgba(0,229,160,.025) 0 1px, transparent 1px 3px), var(--bg)}
[data-theme="hud"] .card{border:1px solid var(--border);padding:14px 13px 12px;font-family:"JetBrains Mono","Consolas",monospace}
[data-theme="hud"] .card::before{content:"";pointer-events:none;position:absolute;top:-1px;left:-1px;width:9px;height:9px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
[data-theme="hud"] .card::after{content:"";pointer-events:none;position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
[data-theme="hud"] .card .head{margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:7px}
[data-theme="hud"] .card .head .ttl{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase}
[data-theme="hud"] input,[data-theme="hud"] textarea,[data-theme="hud"] .mini{border-radius:0;border:1px solid var(--border);background:transparent;font-family:inherit}
[data-theme="hud"] .mini.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
[data-theme="clay"]{--bg:#FFEEF5;--bg-soft:#FFF6FA;--card:#FFFFFF;--card-2:#FFE3B8;--border:#F5D3E2;--border-strong:#EBB8CE;--text:#5C3A4A;--muted:#93677D;--faint:#AA8798;--accent:#FF6FA5;--accent-2:#E85490;--accent-soft:#FFE0EC;--accent-ink:#FFFFFF;--teal:#2E6B44;--danger:#E8546C;--good:#4FA86E;--dot:rgba(180,120,150,.05);--radius:28px;--radius-sm:20px;--shadow:0 7px 0 #F5C6DD, 0 11px 18px rgba(220,150,180,.22);--shadow-lift:0 10px 0 #F0B8D2, 0 18px 30px rgba(220,150,180,.3)}
[data-theme="clay"] body{background:var(--bg)}
[data-theme="clay"] .card{padding:16px 18px 15px;border:none}
[data-theme="clay"] .card .head .ttl{font-size:12.5px;font-weight:700}
[data-theme="clay"] .mini{border-radius:999px;border:none;background:var(--card-2);box-shadow:0 4px 0 #EBC38C;font-weight:600}
[data-theme="clay"] .mini.go{background:var(--accent);color:#FFF;box-shadow:0 4px 0 var(--accent-2)}
[data-theme="clay"] input,[data-theme="clay"] textarea{border-radius:18px;border:none;background:#FFF4F8;box-shadow:inset 0 2px 5px rgba(200,150,175,.18)}
[data-theme="glass"]{--bg:#2A4470;--bg-soft:#3A5A8C;--card:rgba(255,255,255,.14);--card-2:rgba(255,255,255,.22);--border:rgba(255,255,255,.32);--border-strong:rgba(255,255,255,.55);--text:#FFFFFF;--muted:rgba(255,255,255,.68);--faint:rgba(255,255,255,.45);--accent:#FFFFFF;--accent-2:#F0F5FF;--accent-soft:rgba(255,255,255,.26);--accent-ink:#2A4470;--teal:#B8F0E4;--danger:#FFB8B8;--good:#C8F0C0;--dot:rgba(255,255,255,.06);--radius:16px;--radius-sm:11px;--shadow:0 4px 18px rgba(20,40,80,.18);--shadow-lift:0 12px 36px rgba(20,40,80,.32)}
[data-theme="glass"] body{background:linear-gradient(135deg,#1E3A5F 0%,#3B5A8C 45%,#6B4E9B 100%);background-attachment:fixed}
[data-theme="glass"] .card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border)}
[data-theme="glass"] .card .head .ttl{font-size:11.5px;letter-spacing:.4px;color:var(--muted);font-weight:600}
[data-theme="glass"] .mini{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#FFF;border-radius:999px}
[data-theme="glass"] .mini.go{background:rgba(255,255,255,.88);color:#2A4470;border-color:transparent}
[data-theme="glass"] input,[data-theme="glass"] textarea{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#FFF;border-radius:12px}
[data-theme="admin"]{--bg:#F4F6F9;--bg-soft:#FAFBFC;--card:#FFFFFF;--card-2:#F4F6F9;--border:#E9ECEF;--border-strong:#DEE2E6;--text:#212529;--muted:#6C757D;--faint:#8A9198;--accent:#3C8DBC;--accent-2:#307AA5;--accent-soft:rgba(60,141,188,.10);--accent-ink:#FFFFFF;--teal:#00A65A;--danger:#DD4B39;--good:#00A65A;--dot:rgba(0,0,0,.035);--radius:6px;--radius-sm:4px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lift:0 6px 18px rgba(0,0,0,.14)}
[data-theme="admin"] body{background:var(--bg)}
[data-theme="admin"] .card{padding:0;border:none}
[data-theme="admin"] .card .head{border-radius:6px 6px 0 0}
[data-theme="admin"] .card .head{background:var(--accent);color:#FFF;padding:8px 12px;margin:0;border-radius:0}
[data-theme="admin"] .card .head .ttl{color:#FFF;font-size:12.5px;font-weight:600}
[data-theme="admin"] .card .body{padding:12px 13px 11px;margin:0}
[data-theme="admin"] .mini,[data-theme="admin"] input,[data-theme="admin"] textarea{border-radius:4px}
[data-theme="admin"] .mini.go{background:#3C8DBC}
[data-theme="candy"]{--bg:#FFF4F8;--bg-soft:#FFF9FB;--card:#FFFFFF;--card-2:#FFEAF1;--border:#FFD6E4;--border-strong:#FFB8D0;--text:#5A3D4E;--muted:#8E6B7F;--faint:#A58898;--accent:#FF7EB3;--accent-2:#FF5C9E;--accent-soft:#FFE3EE;--accent-ink:#FFFFFF;--teal:#7ED7C1;--danger:#FF8A80;--good:#8FD694;--dot:rgba(255,126,179,.06);--radius:24px;--radius-sm:16px;--shadow:0 4px 14px rgba(255,126,179,.14);--shadow-lift:0 10px 28px rgba(255,126,179,.26)}

       ["console","데이터 콘솔","#0E1116","#151A21","#00E0FF","청록 포인트 · 데이터 느낌"],

};
const THEME_FONT={academia:"serif", zen:"serif", vintage:"serif", notion:"serif",
  blueprint:"mono", hud:"mono", sketch:"gowun", swiss:"wanted"};
const FONT_CSS={
  wanted:"https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/complete/WantedSansVariable.min.css",
  gowun:"https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap",

const TH_ALL=[...THEMES.light, ...THEMES.dark], TH_KEYS=new Set(TH_ALL.map(t=>t[0]));

/* ===== 도구 ===== */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){                        // 글자는 항상 textContent로 넣음
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k==="text") e.textContent=v; else e.setAttribute(k, v===true?"":v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
const uid = () => Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,"0");
const DOW = ["일","월","화","수","목","금","토"];
function ymdNow(){ const d=new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; }
function isoNow(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function safeUrl(u){ u=String(u||"").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
let _tt=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove("on"),2200); }
/* 위쪽 상태: 잘 되고 있으면 늘 '연결중' (불러오기·저장할 때마다 글자가 바뀌지 않게). 문제는 1분 넘게 계속될 때만 표시 */
let _errSince=0;
function setStatus(msg, err){ const s=$("#st");
  if(!msg){ _errSince=0; s.textContent=""; s.classList.remove("err"); return; }
  if(err){ if(!_errSince) _errSince=Date.now(); } else _errSince=0;
  const bad=!!err && Date.now()-_errSince>=60000, txt=bad?msg:"연결중";
  if(s.textContent!==txt) s.textContent=txt; s.classList.toggle("err", bad); }

/* ===== 로그인 (구글 공식 방식: 토큰은 1시간짜리, 이 기기에만 보관) ===== */
const S = { tok:null, exp:0, email:"", file:null, data:null, pending:[], flushing:false, flushT:null };
const dev = (()=>{ try{ let d=localStorage.getItem("m.dev"); if(!d){ d="m-"+uid()+uid(); localStorage.setItem("m.dev",d); } return d; }catch(e){ return "m-"+uid(); } })();
function saveAuth(){ try{ localStorage.setItem("m.auth", JSON.stringify({tok:S.tok, exp:S.exp, email:S.email})); }catch(e){} }
function loadAuth(){ try{ const a=JSON.parse(localStorage.getItem("m.auth")||"null"); if(a){ S.email=a.email||""; if(a.tok && a.exp>Date.now()+60000){ S.tok=a.tok; S.exp=a.exp; } } }catch(e){} }
let tokenClient=null;
function initGis(){
  if(tokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return !!tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: WEB_CLIENT_ID, scope: SCOPE,
    callback: async (r)=>{
      if(r.error){ showHello(r.error==="access_denied" ? "허용하지 않아 연결되지 않았어요." : "로그인하지 못했어요. 다시 시도해 주세요."); return; }
      if(!google.accounts.oauth2.hasGrantedAllScopes(r, DRIVE_SCOPE)){ showHello("드라이브 권한에 체크한 뒤 다시 로그인해 주세요."); return; }
      S.tok=r.access_token; S.exp=Date.now()+(Number(r.expires_in||3600)-60)*1000;
      try{ const u=await (await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+S.tok}})).json(); S.email=u.email||S.email; }catch(e){}
      saveAuth(); startMain();
    },
    error_callback: (e)=>{ showHello(e && e.type==="popup_closed" ? "로그인 창이 닫혔어요. 다시 시도해 주세요." : "로그인 창을 열지 못했어요. 팝업 차단을 확인해 주세요."); }
  });
  return true;
}
function login(){
  if(!initGis()){ toast("잠시 후 다시 눌러 주세요"); return; }
  tokenClient.requestAccessToken(S.email ? {prompt:"", login_hint:S.email} : {prompt:"select_account"});
}
function logout(){
  try{ if(S.tok && window.google) google.accounts.oauth2.revoke(S.tok, ()=>{}); }catch(e){}
  S.tok=null; S.exp=0; S.email=""; S.data=null; S.file=null;
  try{ localStorage.removeItem("m.auth"); }catch(e){}
  $("#menu").classList.remove("on"); showHello();
}

/* ===== 구글 드라이브 ===== */
class AuthError extends Error{}
async function api(url, opts={}){
  if(!S.tok || Date.now()>S.exp) throw new AuthError("expired");
  const r = await fetch(url, Object.assign({}, opts, {headers:Object.assign({Authorization:"Bearer "+S.tok}, opts.headers||{})}));
  if(r.status===401){ S.tok=null; throw new AuthError("expired"); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r;
}
async function findFile(){
  const r = await api(`${API}/files?spaces=appDataFolder&pageSize=200&fields=files(id,name,modifiedTime)`);
  const j = await r.json(); return (j.files||[]).find(f=>f.name===STATE_NAME) || null;
}
async function fileMeta(id){ const r=await api(`${API}/files/${encodeURIComponent(id)}?fields=id,modifiedTime`); return r.json(); }
async function download(id){ const r=await api(`${API}/files/${encodeURIComponent(id)}?alt=media`); return r.json(); }
async function upload(id, data){                       // PC 프로그램과 같은 형식으로 저장
  const b = "----mdash"+Date.now();
  const meta = {appProperties:{savedAt:String(data.savedAt||0), device:dev, device_name:"모바일"}};
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`
    + `--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n--${b}--`;
  const r = await api(`${UP}/files/${encodeURIComponent(id)}?uploadType=multipart&fields=id,modifiedTime`,
    {method:"PATCH", headers:{"Content-Type":"multipart/related; boundary="+b}, body});
  return r.json();
}
function valid(d){ return d && typeof d==="object" && Array.isArray(d.widgets); }

/* ===== 불러오기 / 저장 ===== */
let _burstUntil=0;          // 방금 주고받았으면 1분 동안 더 자주 확인
async function refresh(force){
  if(!S.tok || S.pending.length || S.flushing || S.refreshing) return;
  S.refreshing=true;
  try{ await _refresh(force); }finally{ S.refreshing=false; }
}
async function _refresh(force){
  if(!force && document.activeElement && document.activeElement.classList.contains("memo")) return;   // 메모 쓰는 중엔 건드리지 않음
  try{
    if(S.file && !force){ const m=await fileMeta(S.file.id); if(m.modifiedTime===S.file.modifiedTime){ setStatus("최신"); return; } }
    setStatus("불러오는 중…");
    const f = await findFile();
    if(!f){ S.file=null; S.data=null; renderEmpty(); setStatus(""); return; }
    const d = await download(f.id);
    if(!valid(d)) throw new Error("bad");
    S.file={id:f.id, modifiedTime:f.modifiedTime}; S.data=d; render(); setStatus("최신"); _burstUntil=Date.now()+60000;
  }catch(e){
    if(e instanceof AuthError){ needLogin(); return; }
    setStatus("연결 확인 필요", true);
  }
}
/* 바꾼 내용은 '무엇을 바꿨는지'로 기록해 두었다가, 저장 직전 최신본에 다시 적용 → PC에서 같이 고쳐도 안 덮어씀 */
function commit(op, delay){
  if(!S.data) return;
  op(S.data); S.data.savedAt=Date.now(); render();
  S.pending.push(op); setStatus("저장 대기…");
  clearTimeout(S.flushT); S.flushT=setTimeout(flush, delay==null?700:delay);
}
async function flush(){
  if(S.flushing || !S.pending.length) return;
  S.flushing=true; const ops=S.pending.splice(0);
  try{
    setStatus("저장 중…");
    const f = await findFile();
    if(!f) throw new Error("gone");
    const latest = await download(f.id);
    if(!valid(latest)) throw new Error("bad");
    ops.forEach(o=>o(latest));
    latest.savedAt = Date.now();
    const r = await upload(f.id, latest);
    S.file={id:r.id||f.id, modifiedTime:r.modifiedTime}; S.data=latest;
    setStatus("저장됨"); _burstUntil=Date.now()+60000;
    if(!(document.activeElement && document.activeElement.classList.contains("memo"))) render();
  }catch(e){
    S.pending.unshift(...ops);
    if(e instanceof AuthError){ needLogin(); }
    else { setStatus("저장 실패 · 다시 시도 중", true); clearTimeout(S.flushT); S.flushT=setTimeout(flush, 5000); }
  }finally{ S.flushing=false; if(S.pending.length && !S.flushT) S.flushT=setTimeout(flush,700); }
}
function W(d, wid){ return (d.widgets||[]).find(w=>w.id===wid); }
function cfg(w){ if(!w.config||typeof w.config!=="object") w.config={}; return w.config; }

/* ===== 할 일 (PC와 같은 순서 규칙) ===== */
const Todo = {
  toggle:(wid,id,done)=>d=>{ const w=W(d,wid); if(!w) return; const a=cfg(w).items||(cfg(w).items=[]);
    const i=a.findIndex(x=>x.id===id); if(i<0) return; const it=a[i]; if(!!it.done===done) return;
    if(done){ let prev=null; for(let k=i-1;k>=0;k--){ if(!a[k].done){ prev=a[k].id; break; } } it._prevId=prev; it.done=true; a.splice(i,1); a.push(it); }
    else { it.done=false; a.splice(i,1); let at; if(it._prevId){ const pi=a.findIndex(x=>x.id===it._prevId&&!x.done); at=pi>=0?pi+1:a.findIndex(x=>x.done); } else at=0; if(at<0) at=a.length; a.splice(at,0,it); it._prevId=null; } },
  add:(wid,it)=>d=>{ const w=W(d,wid); if(!w) return; const a=cfg(w).items||(cfg(w).items=[]); if(a.some(x=>x.id===it.id)) return;
    const firstDone=a.findIndex(x=>x.done); if(firstDone<0) a.push(it); else a.splice(firstDone,0,it); },
  edit:(wid,id,text)=>d=>{ const w=W(d,wid); const it=w&&(cfg(w).items||[]).find(x=>x.id===id); if(it) it.text=text; },
  del:(wid,id)=>d=>{ const w=W(d,wid); if(w&&Array.isArray(cfg(w).items)) cfg(w).items=cfg(w).items.filter(x=>x.id!==id); },
};
const NOTE_COLORS = {"":"", yellow:"#F2C94C", orange:"#F2994A", red:"#EB6F6F", pink:"#F29BC4",
  purple:"#A98BEA", blue:"#6FA8F0", green:"#6FC48C", gray:"#9AA3B2"};
const Note = {                                         // PC와 같은 메모 목록(d.notes)
  set:(id,text)=>d=>{ const n=(d.notes||[]).find(x=>x.id===id); if(n){ n.text=text; n.at=Date.now(); } },
  add:(n)=>d=>{ if(!Array.isArray(d.notes)) d.notes=[]; if(!d.notes.some(x=>x.id===n.id)) d.notes.push(n); },
  del:(id)=>d=>{ if(Array.isArray(d.notes)) d.notes=d.notes.filter(x=>x.id!==id); },
};
function noteTitle(n){ const t=String((n&&n.text)||"").trim().split("\n")[0].trim(); return t ? (t.length>40?t.slice(0,40)+"…":t) : "(빈 메모)"; }
const List = {                                         // D-Day(events) · 바로가기(items)
  add:(wid,key,it)=>d=>{ const w=W(d,wid); if(!w) return; const a=cfg(w)[key]||(cfg(w)[key]=[]); if(!a.some(x=>x.id===it.id)) a.push(it); },
  del:(wid,key,id)=>d=>{ const w=W(d,wid); if(w&&Array.isArray(cfg(w)[key])) cfg(w)[key]=cfg(w)[key].filter(x=>x.id!==id); },
};

function thPref(){ try{ const o=JSON.parse(localStorage.getItem("m.theme")||"{}"); return {sync:o.sync!==false, pick:typeof o.pick==="string"?o.pick:""}; }
  catch(e){ return {sync:true, pick:""}; } }
function thSave(p){ try{ localStorage.setItem("m.theme", JSON.stringify(p)); }catch(e){} }
function cloudTheme(){                                  // PC에서 고른 꾸미기 (마지막으로 본 것 기억)
  if(S.data && TH_KEYS.has(S.data.theme)){ try{ localStorage.setItem("m.cloudTheme", S.data.theme); }catch(e){} return S.data.theme; }
  try{ const t=localStorage.getItem("m.cloudTheme"); return TH_KEYS.has(t)?t:""; }catch(e){ return ""; }
}
function currentTheme(){ const p=thPref(); let k=p.sync ? (cloudTheme()||p.pick) : p.pick;
  if(!TH_KEYS.has(k)) k=(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  return k; }
const _fontOn={};
function applyTheme(){
  const k=currentTheme(); document.documentElement.setAttribute("data-theme", k);
  const f=FONT_CSS[THEME_FONT[k]]; if(f && !_fontOn[f]){ _fontOn[f]=1; document.head.appendChild(h("link",{rel:"stylesheet", href:f})); }
  const t=TH_ALL.find(x=>x[0]===k), m=$("#themeColor"); if(t && m) m.setAttribute("content", t[2]);
}
function pickTheme(k){
  if(!TH_KEYS.has(k)) return;
  const p=thPref(); p.pick=k; thSave(p);
  if(p.sync && S.data) commit(d=>{ d.theme=k; });      // PC와 맞추는 중이면 PC에도 (PC에서 화면 꾸미기를 맞추는 경우)
  applyTheme(); drawThemeSheet();
}
function drawThemeSheet(){

      h("i",{text: p.sync ? "PC에서 고른 꾸미기를 따라요. 여기서 고르면 PC에도 적용돼요." : "이 폰에서 고른 꾸미기만 써요. PC와 서로 바꾸지 않아요."})), sw));

        h("span",{class:"tp"}, h("span",{class:"tc"}, h("i"), h("i"))),

/* ===== 화면 ===== */
const openDone = new Set(), editing = new Set();
function orderWidgets(d){
  const L=w=>w.layoutMax||w.layout||{x:0,y:0};
  return (d.widgets||[]).slice().sort((a,b)=>(L(a).y-L(b).y)||(L(a).x-L(b).x));
}
function fmtDue(ymd){
  if(!/^\d{8}$/.test(ymd||"")) return null;
  const y=+ymd.slice(0,4), m=+ymd.slice(4,6), dd=+ymd.slice(6,8), dt=new Date(y,m-1,dd);
  const today=ymdNow(); return {label:`${m}/${dd}(${DOW[dt.getDay()]})`, cls: ymd===today?"now":(ymd<today?"late":"")};
}
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function render(){
  applyTheme();
  const app=$("#app"); app.innerHTML="";
  const d=S.data; if(!d){ renderEmpty(); return; }
  const now=new Date(), today=ymdNow();
  const todos=(d.widgets||[]).filter(w=>w.type==="todo").flatMap(w=>(w.config&&w.config.items)||[]);
  const left=todos.filter(t=>!t.done && t.date===today).length, late=todos.filter(t=>!t.done && t.date && t.date<today).length;
  app.appendChild(h("section",{class:"today"},
    h("h1",{class:"date"}, `${now.getMonth()+1}월 ${now.getDate()}일`, h("span",{class:"dow", text:`${DOW[now.getDay()]}요일`})),
    h("p",{class:"sum", text: left||late ? (left&&late ? `오늘 할 일 ${left}개와 지난 할 일 ${late}개가 남았어요.` : left ? `오늘 할 일이 ${left}개 남았어요.` : `지난 할 일이 ${late}개 남았어요.`) : "오늘 남은 할 일이 없어요."})));
  const skip=[]; let memoDone=false;
  orderWidgets(d).forEach(w=>{
    if(!SUPPORTED.has(w.type)){ skip.push(TITLES[w.type]||w.type); return; }
    if(w.type==="memo"){                                // 메모 위젯이 여러 개여도 메모 목록은 한 번만
      if(!memoDone){ memoDone=true; const sec=h("section",{class:"card sec"}); app.appendChild(sec); drawNotes(sec); } return; }
    const title=(typeof w.title==="string"&&w.title.trim())?w.title:TITLES[w.type];

  if(skip.length) app.appendChild(h("p",{class:"pconly", text:`PC에서만 볼 수 있는 위젯: ${[...new Set(skip)].join(", ")}`}));
}

function drawTodo(sec,w,title){
  const items=(cfg(w).items||[]).filter(x=>x&&typeof x==="object");
  const undone=items.filter(x=>!x.done), done=items.filter(x=>x.done);
  sec.appendChild(h("div",{class:"head"}, h("h2",{class:"ttl", text:title})));
  const p=h("div",{class:"body"}); sec.appendChild(p);
  const row=(it)=>{
    const due=fmtDue(it.date);
    const r=h("div",{class:"row"+(it.done?" done":"")});
    const chk=h("button",{class:"chk","aria-label":it.done?"완료 취소":"완료", onclick:()=>commit(Todo.toggle(w.id,it.id,!it.done))});
    chk.innerHTML=CHECK;
    const tx=h("button",{class:"txt", text:String(it.text||"")});
    tx.addEventListener("click",()=>{
      if(it.done) return;
      const inp=h("input",{value:String(it.text||""), "aria-label":"할 일 수정"}); tx.textContent=""; tx.appendChild(inp); inp.focus();
      let fin=false; const end=(save)=>{ if(fin) return; fin=true; const v=inp.value.trim();
        if(save && v && v!==it.text) commit(Todo.edit(w.id,it.id,v)); else render(); };
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") end(true); else if(e.key==="Escape") end(false); });
      inp.addEventListener("blur",()=>end(true));
    });
    r.append(chk, tx);
    if(due) r.appendChild(h("span",{class:"due "+(it.done?"":due.cls), text:due.label}));
    r.appendChild(h("button",{class:"del","aria-label":"삭제", text:"✕",
      onclick:()=>{ if(confirm(`"${String(it.text||"").slice(0,30)}"을(를) 지울까요?`)) commit(Todo.del(w.id,it.id)); }}));
    return r;
  };
  if(!undone.length && !done.length) p.appendChild(h("div",{class:"empty", text:"할 일을 적어 보세요."}));
  undone.forEach(it=>p.appendChild(row(it)));
  if(done.length){
    const open=openDone.has(w.id);
    p.appendChild(h("button",{class:"more", text:`${open?"▾":"▸"} 완료됨 ${done.length}`, onclick:()=>{ open?openDone.delete(w.id):openDone.add(w.id); render(); }}));
    if(open) done.forEach(it=>p.appendChild(row(it)));
  }
  const tIn=h("input",{placeholder:"할 일 입력", "aria-label":"새 할 일"}), dIn=h("input",{type:"date", value:isoNow(), "aria-label":"날짜"});
  const add=()=>{ const v=tIn.value.trim(); if(!v) return; const date=(dIn.value||isoNow()).replace(/-/g,"");
    commit(Todo.add(w.id,{id:uid(), text:v, done:false, date})); };
  tIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  p.appendChild(h("div",{class:"add"}, tIn, dIn, h("button",{class:"mini go", text:"추가", onclick:add})));
}

const openNotes = new Set(); let focusNote = null;
function drawNotes(sec){

      ta.addEventListener("blur",()=>{ if(t){ clearTimeout(t); t=null; if(ta.value!==String(n.text||"")) commit(Note.set(n.id, ta.value), 0); } });
      const del=h("button",{class:"nt-x", text:"메모 지우기",

      "3. 연결되면 이 화면을 새로고침하세요."),
    h("button",{class:"big", style:"margin-top:24px", text:"새로고침", onclick:()=>refresh(true)}),
    h("button",{class:"big sub", text:"다른 계정으로 로그인", onclick:logout})));
}
function showHello(err){
  applyTheme();
  $("#bar").hidden=true; const app=$("#app"); app.innerHTML="";
  if(WEB_CLIENT_ID.indexOf("WEB_CLIENT_ID")===0){
    app.appendChild(h("section",{class:"hello"}, h("h1",{text:"설정이 필요해요"}),
      h("p",{text:"배포자가 index.html 위쪽의 WEB_CLIENT_ID를 아직 넣지 않았어요."}))); return;
  }
  app.appendChild(h("section",{class:"hello"},
    err ? h("div",{class:"alert", text:err}) : null,
    h("h1",{text:"PC 대시보드를 폰에서 봅니다"}),
    h("p",{text:"할 일·메모·D-Day·바로가기를 보고 고칠 수 있어요. 바꾼 내용은 PC에도 곧 반영됩니다."}),
    h("button",{class:"big", text:S.email?`${S.email}(으)로 계속`:"구글로 로그인", onclick:login}),
    S.email ? h("button",{class:"big sub", text:"다른 계정으로 로그인", onclick:()=>{ S.email=""; saveAuth(); login(); }}) : null,
    h("div",{class:"note"}, "PC 프로그램에서 동기화를 켠 것과 같은 구글 계정으로 로그인하세요.", h("br"),
      "내용은 내 구글 드라이브의 앱 전용 폴더에만 저장됩니다.", h("br"),
      "학생 정보가 보일 수 있으니 폰 화면 잠금을 꼭 설정해 주세요.")));
}
function needLogin(){ setStatus(""); showHello("로그인 시간이 지났어요. 다시 계속해 주세요."); }
function startMain(){
  $("#bar").hidden=false;
  $("#app").innerHTML=""; $("#app").appendChild(h("p",{class:"empty", text:"불러오는 중…"}));
  refresh(true);
}

/* ===== 시작 ===== */
$("#refreshBtn").onclick=()=>refresh(true);
$("#themeBtn").onclick=()=>{ drawThemeSheet(); $("#themeMenu").classList.add("on"); };
$("#themeMenu").addEventListener("click",e=>{ if(e.target.id==="themeMenu") $("#themeMenu").classList.remove("on"); });
$("#menuBtn").onclick=()=>{ $("#menuWho").textContent=S.email?`${S.email}로 로그인됨`:""; $("#menu").classList.add("on"); };
$("#closeMenu").onclick=()=>$("#menu").classList.remove("on");
$("#menu").addEventListener("click",e=>{ if(e.target.id==="menu") $("#menu").classList.remove("on"); });
$("#logoutBtn").onclick=logout;
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.tok) refresh(false); });
(function loop(){ setTimeout(()=>{ if(!document.hidden && S.tok) refresh(false); loop(); }, Date.now()<_burstUntil ? 2000 : 5000); })();   // 5초마다 (방금 바뀌었으면 2초)
setInterval(()=>{ if(S.tok && Date.now()>S.exp){ S.tok=null; needLogin(); } }, 30000);
window.addEventListener("beforeunload",()=>{ if(S.pending.length) flush(); });
loadAuth();
applyTheme();
if(S.tok) startMain(); else showHello();
(function loadGis(){
  const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
  s.onload=initGis; document.head.appendChild(s);
})();
</script>
</body>
