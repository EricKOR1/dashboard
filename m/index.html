<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://ko.wikipedia.org https://api.wikimedia.org https://api.dictionaryapi.dev https://api.mymemory.translated.net https://stdict.korean.go.kr; style-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org; frame-src https://accounts.google.com">
<meta name="theme-color" id="themeColor" content="#F3EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>My Dashboard</title>
<style>
  /* ===== 기본 (색·모서리·그림자는 모두 PC 테마 값) ===== */
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;}
  body{min-height:100vh; color:var(--text); background:var(--bg); background-attachment:fixed;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);}
  button,input,textarea{font:inherit; color:inherit;}
  button{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  body, .txt, .dd .n{word-break:keep-all; overflow-wrap:anywhere;}   /* 한글 낱말 중간에서 줄이 바뀌지 않게 */
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:var(--wrapw,560px); margin:0 auto; padding:0 16px 56px;}

  /* 상단 줄 */
  .bar{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) max(16px, calc((100% - var(--wrapw,560px))/2 + 16px)) 8px;
    background:color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter:saturate(1.3) blur(14px); backdrop-filter:saturate(1.3) blur(14px);}
  .bar .st{flex:1; min-width:0; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar .st.err{color:var(--danger); font-weight:600;}
  .ib{flex:none; width:40px; height:40px; display:grid; place-items:center; padding:0; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);}
  .ib svg{width:19px; height:19px;}

  /* 오늘 */
  .today{padding:14px 2px 4px;}
  .today .date{margin:0; font-size:34px; line-height:1.1; font-weight:800; letter-spacing:-.035em;}
  .today .dow{display:block; margin-top:6px; font-size:15px; font-weight:600; letter-spacing:0; color:var(--muted);}
  .today .sum{margin:12px 0 0; font-size:15px;}

  /* 카드 (PC 위젯과 같은 틀) */
  .card{position:relative; margin-top:14px; padding:15px 16px 14px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);}
  .card > .head, .card > .body{position:relative; z-index:1;}
  .card .head{display:flex; align-items:center; gap:8px; min-height:24px; margin-bottom:6px;}
  .card .head .ttl{flex:1; min-width:0; margin:0; font-size:13.5px; font-weight:700; line-height:1.3;}
  .tool{flex:none; padding:6px 2px; border:none; background:none; color:inherit; opacity:.72; font-size:13px; font-weight:600;}

  /* 입력칸·버튼 (PC와 같은 이름) */
  input,textarea{font-family:inherit; color:var(--text); background:var(--bg-soft); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 12px; outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  .mini{min-height:44px; padding:0 16px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:600;
    background:var(--card); color:var(--text); border:1px solid var(--border);}
  .mini.go{background:var(--accent-soft); color:var(--accent-2); border-color:transparent; font-weight:700;}

  /* 할 일 */
  .row{display:flex; align-items:center; gap:12px; min-height:50px; padding:6px 0; border-top:1px solid var(--border);}
  .row:first-child{border-top:none;}
  .chk{flex:none; width:24px; height:24px; display:grid; place-items:center; padding:0; border-radius:50%;
    border:2px solid var(--border-strong); background:none; color:var(--accent-ink);}
  .chk svg{width:13px; height:13px; opacity:0;}
  .row.done .chk{background:var(--accent); border-color:var(--accent);}
  .row.done .chk svg{opacity:1;}
  .row.done .txt{color:var(--faint); text-decoration:line-through;}
  .txt{flex:1; min-width:0; padding:4px 0; border:none; background:none; text-align:left; font-size:15.5px;}
  .due{flex:none; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .due.now{color:var(--accent-2); font-weight:700;}
  .due.late{color:var(--danger); font-weight:600;}
  .del{flex:none; width:32px; height:32px; padding:0; border:none; background:none; color:var(--faint); font-size:14px; border-radius:var(--radius-sm);}
  .more{display:block; width:100%; min-height:44px; padding:0; border:none; border-top:1px solid var(--border);
    background:none; color:var(--muted); font-size:13.5px; font-weight:600; text-align:left;}
  .add{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-top:8px; padding-top:12px; border-top:1px solid var(--border);}
  .add input{min-width:0; height:44px;}
  .add input:first-child{grid-column:1 / -1;}             /* 글 입력칸은 한 줄 전체, 날짜·추가는 아래 줄 */
  .add input[type=date]{padding:0 10px;}
  .add .mini{min-width:76px;}
  .empty{padding:8px 0 12px; color:var(--faint); font-size:14.5px;}

  /* 메모 목록 (PC와 같은 목록 · 색) */
  .nt{border-top:1px solid var(--border);}
  .nt:first-child{border-top:none;}
  .nt-h{display:flex; align-items:center; gap:10px; width:100%; min-height:50px; padding:6px 2px; border:none; background:none;
    text-align:left; color:var(--text); font-size:15.5px;}
  .nt-dot{flex:none; width:10px; height:10px; border-radius:50%; background:var(--nc,transparent); box-shadow:inset 0 0 0 1.5px var(--border-strong);}
  .nt-t{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nt-d{flex:none; font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums;}
  .nt.open{box-shadow:inset 3px 0 0 var(--nc,transparent);}
  .nt.open .nt-h{padding-left:12px;}
  .memo-st{font-size:12px; color:var(--faint); min-height:22px;}
  .nt-f{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 0 8px 12px;}
  .nt-x{flex:none; padding:6px 2px; border:none; background:none; color:var(--danger); font-size:13.5px; font-weight:600;}

  /* D-Day */
  .dd{display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 0; border-top:1px solid var(--border);}
  .dd:first-child{border-top:none;}
  .dd .n{flex:1; min-width:0;}
  .dd .d{font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums;}
  .dd .v{flex:none; font-size:21px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .dd .v.soon{color:var(--accent-2);}
  .dd .v.past{color:var(--faint); font-weight:600;}

  /* 바로가기 */
  .links{display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 4px;}
  .lk{display:inline-flex; align-items:center; gap:6px; min-height:42px; max-width:100%; padding:0 14px;
    border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:15px;}
  .lk span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lk .x{border:none; background:none; color:var(--faint); padding:0 0 0 4px; font-size:14px;}
  .pconly{margin-top:30px; font-size:13px; color:var(--faint); line-height:1.7;}

  /* 안내 화면 */
  .hello{padding:12vh 4px 0;}
  .hello h1{margin:0 0 12px; font-size:30px; line-height:1.25; letter-spacing:-.03em;}
  .hello p{margin:0 0 26px; color:var(--muted);}
  .big{display:block; width:100%; min-height:52px; border:none; border-radius:var(--radius-sm);
    background:var(--accent); color:var(--accent-ink); font-size:16.5px; font-weight:700;}
  .big.sub{margin-top:10px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:15px; font-weight:600;}
  .note{margin-top:22px; font-size:13.5px; color:var(--muted); line-height:1.75;}
  .alert{margin:0 0 16px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--card); border:1px solid var(--danger);
    color:var(--danger); font-size:14px;}
  .toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60;
    max-width:calc(100% - 36px); padding:11px 18px; border-radius:var(--radius-sm); background:var(--text); color:var(--bg);
    font-size:14px; display:none;}
  .toast.on{display:block;}

  /* 아래에서 올라오는 창 */
  .menu{position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; background:rgba(0,0,0,.34);}
  .menu.on{display:flex;}
  .menu .sheet{width:100%; max-width:560px; max-height:88vh; overflow:auto; margin:0 auto; color:var(--text);
    background:linear-gradient(var(--card),var(--card)), var(--bg); border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -12px 40px rgba(0,0,0,.2);}
  .menu .sheet::before{content:""; display:block; width:40px; height:4px; margin:0 auto 14px; border-radius:2px; background:var(--border-strong);}
  .menu .sheet h2{margin:0 0 12px; font-size:18px;}
  .menu .sheet p{margin:0 0 14px; color:var(--muted); font-size:14px; word-break:break-all;}

  /* 화면 꾸미기 창 */
  .swrow{display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft);}
  .swrow .tx{flex:1; min-width:0;}
  .swrow b{display:block; font-size:15px;}
  .swrow i{display:block; margin-top:2px; font-style:normal; font-size:12.5px; line-height:1.5; color:var(--muted);}
  .tg-h{margin:18px 2px 8px; font-size:13px; font-weight:700; color:var(--muted);}
  .tgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .tile{display:block; padding:0; border:none; border-radius:16px; overflow:hidden; text-align:left; background:var(--bg-soft);
    color:var(--text); box-shadow:0 0 0 1px var(--border);}
  .tile .tp{display:block; height:72px; padding:12px; background:var(--bg);}
  .tile .tc{display:block; height:100%; padding:9px 10px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-sm); box-shadow:var(--shadow);}
  .tile .tc i{display:block; height:6px; border-radius:3px;}
  .tile .tc i:first-child{width:46%; background:var(--accent);}
  .tile .tc i + i{width:78%; margin-top:7px; background:var(--faint); opacity:.55;}
  .tile .tn{display:block; padding:9px 11px 10px;}
  .tile .tn b{display:block; font-size:13.5px;}
  .tile .tn small{display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile.on{box-shadow:0 0 0 3px var(--accent);}
  .tile.on .tn b::after{content:" ✓"; color:var(--accent-2);}

  /* ===== PC 위젯들 (폰) ===== */
  .stamp{flex:none; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums;}
  .sub{font-size:13px; color:var(--muted); padding:2px 0 8px;}
  .card .note{margin:8px 0 0; font-size:12.5px; color:var(--faint);}
  .srch{display:flex; gap:8px; margin:2px 0 8px;}
  .srch input{flex:1; min-width:0; height:44px;}
  .hit{display:flex; align-items:baseline; gap:8px; width:100%; min-height:46px; padding:8px 2px; border:none; border-top:1px solid var(--border);
    background:none; color:var(--text); text-align:left; font-size:15.5px;}
  .hit small{color:var(--muted); font-size:12.5px;}
  .kv{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); font-size:14.5px;}
  .kv span{color:var(--muted); flex:none;} .kv b,.kv a{text-align:right; font-weight:600; color:var(--text);}
  .seg{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px;}
  .seg button{min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:13.5px;}
  .seg button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700;}
  .more{display:inline-block; margin-top:8px; padding:6px 0; border:none; background:none; color:var(--accent-2); font-size:14px; font-weight:600; text-decoration:none;}
  .src{margin-top:8px; font-size:12px; color:var(--faint);}
  /* 시계 */
  .clk{padding:4px 0 6px;} .clk-t{font-size:44px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .clk-s{margin-left:6px; font-size:20px; color:var(--accent-2); font-weight:700; font-variant-numeric:tabular-nums;} .clk-d{color:var(--muted); font-size:14px;}
  /* 날씨 */
  .wx-now{display:flex; align-items:center; gap:14px;} .wx-e{font-size:44px; line-height:1;}
  .wx-t{font-size:38px; font-weight:800; letter-spacing:-.03em;} .wx-t small{font-size:16px; color:var(--muted); margin-left:2px;}
  .wx-k{color:var(--muted); font-size:14px;}
  .wx-meta{display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0 4px; font-size:13.5px; color:var(--muted);} .wx-meta b{color:var(--text);}
  .dotg{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:1px;}
  .dotg.g1{background:#3b82f6;} .dotg.g2{background:#22c55e;} .dotg.g3{background:#f59e0b;} .dotg.g4{background:#ef4444;}
  .wx-h{display:flex; gap:4px; overflow-x:auto; padding:8px 0; border-top:1px solid var(--border); -webkit-overflow-scrolling:touch;}
  .wx-hh{flex:none; width:52px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px;}
  .wx-hh small{color:var(--muted);} .wx-hh i{font-style:normal; font-size:11.5px; color:var(--faint);} .wx-hh i.wet{color:var(--accent-2); font-weight:700;}
  .wx-d{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding-top:8px; border-top:1px solid var(--border);}
  .wx-d > div{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13.5px;} .wx-d small{color:var(--muted);} .wx-d i{font-style:normal; font-size:12px; color:var(--accent-2);}
  /* 명언·국가·백과·사전·역사 */
  .qt{margin:4px 0 6px; font-size:17px; line-height:1.6; font-weight:600;} .qa{margin:0; color:var(--muted); font-size:14px;}
  .ctry{display:flex; align-items:center; gap:12px; padding:6px 0 10px;} .cf{font-size:40px;} .ctry b{display:block; font-size:18px;} .ctry small{color:var(--muted);}
  .enc{display:flex; align-items:center; gap:12px; padding:4px 0 6px;} .enc img{width:64px; height:64px; object-fit:cover; border-radius:var(--radius-sm);} .enc b{font-size:17px;}
  .enc-t{margin:0; font-size:14.5px; line-height:1.7;}
  .dw b{font-size:20px;} .dw small{color:var(--muted);} .dtr{margin:6px 0; font-size:17px; font-weight:600;}
  .dm{padding:8px 0; border-top:1px solid var(--border);} .dm p{margin:2px 0; font-size:14.5px; line-height:1.6;} .dex{color:var(--muted); font-size:13.5px !important;}
  .dpos{display:inline-block; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-2); font-size:12px; font-weight:700;}
  .hrow{display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--border); color:var(--text); text-decoration:none; font-size:14.5px; line-height:1.55;}
  .hrow:first-child{border-top:none;} .hrow b{flex:none; min-width:44px; color:var(--accent-2); font-variant-numeric:tabular-nums;}
  /* 급식·학사일정·뉴스·시세 */
  .meal{padding:8px 0; border-top:1px solid var(--border);} .meal b{font-size:13px; color:var(--accent-2);} .meal p{margin:3px 0; font-size:15px; line-height:1.6;} .meal small{color:var(--faint);}
  .ev{display:flex; gap:12px; padding:8px 0; border-top:1px solid var(--border); font-size:14.5px;} .evd{flex:none; min-width:62px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .ev.now{font-weight:700;} .ev.now .evd{color:var(--accent-2);} .ev.past{opacity:.5;}
  .nw{display:block; padding:10px 0; border-top:1px solid var(--border); color:var(--text); text-decoration:none; font-size:14.5px; line-height:1.55;}
  .sq{display:grid; grid-template-columns:1fr auto; gap:0 10px; padding:9px 0; border-top:1px solid var(--border);}
  .sq b{font-size:15px;} .sqp{text-align:right; font-weight:700; font-variant-numeric:tabular-nums;} .sqc{grid-column:2; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums;}
  .sqc.up{color:#e5484d;} .sqc.down{color:#3b82f6;}
  /* 시간표·연락처·학생 */
  .ttw{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tt{width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed;}
  .tt th,.tt td{border:1px solid var(--border); padding:4px 2px; text-align:center; vertical-align:middle;}
  .tt th{background:var(--bg-soft); color:var(--muted); font-weight:700;} .tt .pn{width:26px;}
  .tt td b{display:block; font-size:12.5px;} .tt td small{display:block; color:var(--muted); font-size:11px;}
  .tt .now{background:var(--accent-soft);}
  .res{display:flex; flex-direction:column; gap:2px; padding:10px 0; border-top:1px solid var(--border);} .res > b{font-size:16px;}
  .res .rc{color:var(--muted); font-size:13.5px;} .res .kv{border-top:none; padding:2px 0;}
  .tel{align-self:flex-start; margin-top:2px; color:var(--accent-2); font-weight:700; text-decoration:none; font-size:15px;}
  /* 폰에 보일 항목 고르기 */
  .pk-note{margin:0 0 12px; font-size:13.5px; color:var(--muted); line-height:1.6;}
  .pk-tools{display:flex; gap:8px; margin-bottom:10px;}
  .pk-list{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .pk-sub{margin:10px 2px 2px; font-size:12.5px; font-weight:700; color:var(--muted);}
  .pk{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft);}
  .pk.off{opacity:.55;}
  .pk input{width:20px; height:20px; flex:none; margin:0; accent-color:var(--accent);}
  .pk-i{flex:none; width:24px; text-align:center;} .pk-t{min-width:0;} .pk-t b{display:block; font-size:14.5px;}
  .pk-t i{display:block; font-style:normal; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ===== 폰·태블릿 배치 ===== */
  .grid{display:grid; grid-template-columns:repeat(var(--cols,1),minmax(0,1fr)); grid-auto-rows:8px; column-gap:14px; row-gap:0;
    grid-auto-flow:row dense; margin-top:14px; align-items:start;}
  .grid > .card{margin:0; align-self:start; min-width:0;}
  .grid > .card.fixh{display:flex; flex-direction:column;} .grid > .card.fixh > .body{flex:1; min-height:0; overflow:auto;}
  .grid > .card > .head{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  .arr, .grip{display:none;}
  .arranging .arr{display:flex; align-items:center; gap:6px; margin:-4px -4px 10px; padding:6px 8px; border-radius:var(--radius-sm);

function h(tag, attrs, ...kids){                        // 글자는 항상 textContent로 넣음
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k==="text") e.textContent=v; else e.setAttribute(k, v===true?"":v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function setStatus(msg, err){ const s=$("#st");
  if(!msg){ _errSince=0; s.textContent=""; s.classList.remove("err"); return; }
  if(err){ if(!_errSince) _errSince=Date.now(); } else _errSince=0;
  const bad=!!err && Date.now()-_errSince>=60000, txt=bad?msg:"연결중";
  if(s.textContent!==txt) s.textContent=txt; s.classList.toggle("err", bad); }

class AuthError extends Error{}
async function api(url, opts={}){
  if(!S.tok || Date.now()>S.exp) throw new AuthError("expired");
  const r = await fetch(url, Object.assign({}, opts, {headers:Object.assign({Authorization:"Bearer "+S.tok}, opts.headers||{})}));
  if(r.status===401){ S.tok=null; throw new AuthError("expired"); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r;
}
async function findFile(){
  const r = await api(`${API}/files?spaces=appDataFolder&pageSize=200&fields=files(id,name,modifiedTime)`);
  const j = await r.json(); return (j.files||[]).find(f=>f.name===STATE_NAME) || null;
}
async function fileMeta(id){ const r=await api(`${API}/files/${encodeURIComponent(id)}?fields=id,modifiedTime`); return r.json(); }
async function download(id){ const r=await api(`${API}/files/${encodeURIComponent(id)}?alt=media`); return r.json(); }
async function upload(id, data){                       // PC 프로그램과 같은 형식으로 저장
  const b = "----mdash"+Date.now();
  const meta = {appProperties:{savedAt:String(data.savedAt||0), device:dev, device_name:"모바일"}};
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`
    + `--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n--${b}--`;
  const r = await api(`${UP}/files/${encodeURIComponent(id)}?uploadType=multipart&fields=id,modifiedTime`,
    {method:"PATCH", headers:{"Content-Type":"multipart/related; boundary="+b}, body});
  return r.json();
}

/* ===== 불러오기 / 저장 ===== */
let _burstUntil=0;          // 방금 주고받았으면 1분 동안 더 자주 확인
async function refresh(force){
  if(!S.tok || S.pending.length || S.flushing || S.refreshing) return;
  S.refreshing=true;
  try{ await _refresh(force); }finally{ S.refreshing=false; }
  loadSnaps(!!force);
  if(S.data && !pickPref() && !S.pickShown){ S.pickShown=true; openPick(true); }   // 처음 연결: 폰에서 볼 항목 고르기
}
async function _refresh(force){
  const ae=document.activeElement;
  if(!force && ae && (ae.classList.contains("memo") || ae.tagName==="INPUT")) return;
  if(S.arrange) return;                                                           // 배치 편집 중엔 건드리지 않음   // 메모·검색칸에 입력 중엔 건드리지 않음
  try{
    if(S.file && !force){ const m=await fileMeta(S.file.id); if(m.modifiedTime===S.file.modifiedTime){ setStatus("최신"); return; } }
    setStatus("불러오는 중…");
    const f = await findFile();
    if(!f){ S.file=null; S.data=null; renderEmpty(); setStatus(""); return; }
    const d = await download(f.id);
    if(!valid(d)) throw new Error("bad");
    S.file={id:f.id, modifiedTime:f.modifiedTime}; S.data=d; render(); setStatus("최신"); _burstUntil=Date.now()+60000;
  }catch(e){
    if(e instanceof AuthError){ needLogin(); return; }
    setStatus("연결 확인 필요", true);
  }
}
/* 바꾼 내용은 '무엇을 바꿨는지'로 기록해 두었다가, 저장 직전 최신본에 다시 적용 → PC에서 같이 고쳐도 안 덮어씀 */
function commit(op, delay){
  if(!S.data) return;
  op(S.data); S.data.savedAt=Date.now(); render();
  S.pending.push(op); setStatus("저장 대기…");
  clearTimeout(S.flushT); S.flushT=setTimeout(flush, delay==null?700:delay);
}
async function flush(){
  if(S.flushing || !S.pending.length) return;
  S.flushing=true; const ops=S.pending.splice(0);
  try{
    setStatus("저장 중…");
    const f = await findFile();
    if(!f) throw new Error("gone");
    const latest = await download(f.id);
    if(!valid(latest)) throw new Error("bad");
    ops.forEach(o=>o(latest));
    latest.savedAt = Date.now();
    const r = await upload(f.id, latest);
    S.file={id:r.id||f.id, modifiedTime:r.modifiedTime}; S.data=latest;
    setStatus("저장됨"); _burstUntil=Date.now()+60000;
    if(!(document.activeElement && document.activeElement.classList.contains("memo"))) render();
  }catch(e){
    S.pending.unshift(...ops);
    if(e instanceof AuthError){ needLogin(); }
    else { setStatus("저장 실패 · 다시 시도 중", true); clearTimeout(S.flushT); S.flushT=setTimeout(flush, 5000); }
  }finally{ S.flushing=false; if(S.pending.length && !S.flushT) S.flushT=setTimeout(flush,700); }
}
function W(d, wid){ return (d.widgets||[]).find(w=>w.id===wid); }
function cfg(w){ if(!w.config||typeof w.config!=="object") w.config={}; return w.config; }

/* ===== 할 일 (PC와 같은 순서 규칙) ===== */
const Todo = {
  toggle:(wid,id,done)=>d=>{ const w=W(d,wid); if(!w) return; const a=cfg(w).items||(cfg(w).items=[]);
    const i=a.findIndex(x=>x.id===id); if(i<0) return; const it=a[i]; if(!!it.done===done) return;
    if(done){ let prev=null; for(let k=i-1;k>=0;k--){ if(!a[k].done){ prev=a[k].id; break; } } it._prevId=prev; it.done=true; a.splice(i,1); a.push(it); }
    else { it.done=false; a.splice(i,1); let at; if(it._prevId){ const pi=a.findIndex(x=>x.id===it._prevId&&!x.done); at=pi>=0?pi+1:a.findIndex(x=>x.done); } else at=0; if(at<0) at=a.length; a.splice(at,0,it); it._prevId=null; } },
  add:(wid,it)=>d=>{ const w=W(d,wid); if(!w) return; const a=cfg(w).items||(cfg(w).items=[]); if(a.some(x=>x.id===it.id)) return;
    const firstDone=a.findIndex(x=>x.done); if(firstDone<0) a.push(it); else a.splice(firstDone,0,it); },
  edit:(wid,id,text)=>d=>{ const w=W(d,wid); const it=w&&(cfg(w).items||[]).find(x=>x.id===id); if(it) it.text=text; },
  del:(wid,id)=>d=>{ const w=W(d,wid); if(w&&Array.isArray(cfg(w).items)) cfg(w).items=cfg(w).items.filter(x=>x.id!==id); },
};

function currentTheme(){ const p=thPref(); let k=p.sync ? (cloudTheme()||p.pick) : p.pick;
  if(!TH_KEYS.has(k)) k=(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  return k; }

function applyTheme(){
  const k=currentTheme(); document.documentElement.setAttribute("data-theme", k);
  const f=FONT_CSS[THEME_FONT[k]]; if(f && !_fontOn[f]){ _fontOn[f]=1; document.head.appendChild(h("link",{rel:"stylesheet", href:f})); }

  return (d.widgets||[]).slice().sort((a,b)=>(L(a).y-L(b).y)||(L(a).x-L(b).x));
}
function fmtDue(ymd){
  if(!/^\d{8}$/.test(ymd||"")) return null;
  const y=+ymd.slice(0,4), m=+ymd.slice(4,6), dd=+ymd.slice(6,8), dt=new Date(y,m-1,dd);
  const today=ymdNow(); return {label:`${m}/${dd}(${DOW[dt.getDay()]})`, cls: ymd===today?"now":(ymd<today?"late":"")};
}

function wSub(w){

  if(w.type==="dday") return `${(c.events||[]).length}개`;

S.snap={live:null, xl:null}; S.snapMt={live:"", xl:""}; S.snapAt=0;
async function loadSnaps(force){
  if(!S.tok || (!force && Date.now()-S.snapAt<60000)) return;
  const a=document.activeElement; if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;      /* 입력 중이면 다음에 */
  S.snapAt=Date.now();
  try{ const r=await api(`${API}/files?spaces=appDataFolder&pageSize=200&fields=files(id,name,modifiedTime)`); const j=await r.json(); let changed=false;
    for(const f of ["live","xl"]){ const it=(j.files||[]).find(x=>x.name===`snap_${f}.json`); if(!it || it.modifiedTime===S.snapMt[f]) continue;
      const doc=await download(it.id); if(doc && doc.widgets && typeof doc.widgets==="object"){ S.snap[f]=doc; S.snapMt[f]=it.modifiedTime; changed=true; } }
    if(changed && S.data && !S.arrange) render();

}

/* 날씨 (open-meteo에서 직접, 10분마다) */
const WX={};
async function loadWx(key,c){ const x=WX[key]=WX[key]||{}; if(x.busy) return; x.busy=true;
  try{ const base=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&wind_speed_unit=ms&timezone=auto&forecast_days=4`;
    const inKR=c.lat>=33&&c.lat<=38.8&&c.lon>=124.5&&c.lon<=132.2; let data=null;
    for(const u of (inKR?[base+"&models=kma_seamless",base]:[base])){ try{ const j=await (await fetch(u)).json();
      if(j&&j.current&&j.current.temperature_2m!=null&&j.daily&&j.daily.temperature_2m_max&&j.daily.temperature_2m_max[0]!=null){ data=j; break; } }catch(e){} }
    if(!data) throw new Error("no");
    let air=null; try{ const a=await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&current=pm10,pm2_5&timezone=auto`)).json(); air=(a&&a.current)||null; }catch(e){}
    x.data={w:data, air}; x.err=false;
  }catch(e){ x.err=true; }
  x.at=Date.now(); x.busy=false; if(S.data) render();
}
const airG=(v,[a,b,c])=>v<=a?["좋음","g1"]:v<=b?["보통","g2"]:v<=c?["나쁨","g3"]:["매우나쁨","g4"];
DRAW.weather=(sec,w,title)=>{ const c=w.config||{}; const b=cardBody(sec,title);
  if(c.lat==null){ empty(b,"PC에서 날씨 지역을 먼저 정해 주세요."); return; }
  const key=`${c.lat},${c.lon}`, x=WX[key];
  if(!x || (!x.busy && Date.now()-(x.at||0)>600000)) loadWx(key,c);
  if(!x || !x.data){ empty(b, x&&x.err?"날씨를 불러오지 못했어요. 잠시 뒤 다시 확인할게요.":"날씨 불러오는 중…"); return; }
  const data=x.data.w, cur=data.current, dy=data.daily, wc=wcode(cur.weather_code, cur.is_day);
  b.appendChild(h("div",{class:"wx-now"}, h("span",{class:"wx-e",text:wc.e}), h("div",{},
    h("div",{class:"wx-t"}, String(Math.round(cur.temperature_2m)), h("small",{text:"°C"})), h("div",{class:"wx-k",text:`📍 ${c.name||""} · ${wc.k}`}))));
  const meta=h("div",{class:"wx-meta"});
  [["체감",Math.round(cur.apparent_temperature)+"°"],["최고·최저",`${Math.round(dy.temperature_2m_max[0])}° / ${Math.round(dy.temperature_2m_min[0])}°`],["습도",cur.relative_humidity_2m+"%"],["바람",(+cur.wind_speed_10m).toFixed(1)+"㎧"]]
    .forEach(([k,v])=>meta.appendChild(h("span",{}, k+" ", h("b",{text:v}))));
  if(x.data.air){ const a=x.data.air, p10=Math.round(a.pm10), p25=Math.round(a.pm2_5);     /* 값이 비어 오면 표시하지 않음 */
    if(Number.isFinite(p10)){ const g=airG(p10,[30,80,150]); meta.appendChild(h("span",{}, h("i",{class:"dotg "+g[1]}), "미세 ", h("b",{text:g[0]}))); }
    if(Number.isFinite(p25)){ const g=airG(p25,[15,35,75]); meta.appendChild(h("span",{}, h("i",{class:"dotg "+g[1]}), "초미세 ", h("b",{text:g[0]}))); } }
  b.appendChild(meta);
  const hy=data.hourly; if(hy&&hy.time){ const nowH=(cur.time||"").slice(0,13); let s=hy.time.findIndex(t=>t.slice(0,13)>=nowH); if(s<0) s=0;
    const strip=h("div",{class:"wx-h"});
    for(let i=s;i<Math.min(s+10,hy.time.length);i++){ const hh=+hy.time[i].slice(11,13), wi=wcode(hy.weather_code?hy.weather_code[i]:0,(hh>=6&&hh<19)?1:0), pp=hy.precipitation_probability?hy.precipitation_probability[i]:null;
      strip.appendChild(h("div",{class:"wx-hh"}, h("small",{text:i===s?"지금":hh+"시"}), h("span",{text:wi.e}), h("b",{text:Math.round(hy.temperature_2m[i])+"°"}), h("i",{class:(pp>=30?"wet":""),text:pp!=null?pp+"%":""}))); }
    b.appendChild(strip); }
  const days=h("div",{class:"wx-d"});
  for(let i=1;i<Math.min(4,dy.time.length);i++){ const dd=new Date(dy.time[i]+"T00:00"), wi=wcode(dy.weather_code[i]), pp=dy.precipitation_probability_max?dy.precipitation_probability_max[i]:null;
    days.appendChild(h("div",{}, h("small",{text:DOW[dd.getDay()]}), h("span",{text:wi.e}), h("b",{text:`${Math.round(dy.temperature_2m_max[i])}° / ${Math.round(dy.temperature_2m_min[i])}°`}), pp?h("i",{text:pp+"%"}):null)); }
  b.appendChild(days);
};

/* 사전 (PC와 같은 모드, 인터넷에서 직접) */
async function dictLookup(mode, word, c){
  const md=DMODES[mode];
  try{
    if(md.kr){ if(!c.krKey) return {err:"PC 사전 위젯 설정에서 국어사전 인증키를 넣으면 폰에서도 찾을 수 있어요."};
      const d=await (await fetch(`https://stdict.korean.go.kr/api/search.do?key=${encodeURIComponent(c.krKey)}&q=${encodeURIComponent(word)}&req_type=json&num=10`)).json();
      let items=(d.channel&&d.channel.item)||[]; if(!Array.isArray(items)) items=[items];
      if(!items.length) return {err:`‘${word}’을(를) 찾지 못했어요.`};
      return {word:items[0].word||word, items:items.slice(0,5).map(it=>{ let sn=it.sense; if(Array.isArray(sn)) sn=sn[0]; return sn?{pos:it.pos||"", def:sn.definition||""}:null; }).filter(Boolean), src:"국립국어원 표준국어대사전"}; }
    if(mode==="영영"){ const arr=await (await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`)).json();
      if(!Array.isArray(arr)||!arr[0]||!arr[0].meanings) return {err:`‘${word}’ 뜻을 찾지 못했어요. 철자를 확인해 보세요.`};
      const e=arr[0]; return {word:e.word, ph:e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||"",
        items:e.meanings.slice(0,3).map(m=>{ const df=(m.definitions||[])[0]; return df?{pos:m.partOfSpeech||"", def:df.definition||"", ex:df.example||""}:null; }).filter(Boolean), src:"Free Dictionary"}; }
    const d=await (await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${encodeURIComponent(md.pair)}`)).json();
    const t=d&&d.responseData&&d.responseData.translatedText; return t?{word, tr:t, src:"MyMemory 번역"}:{err:"번역하지 못했어요."};
  }catch(e){ return {err: md.kr ? "폰에서는 국어사전에 연결하지 못했어요. PC에서 찾아 주세요." : "불러오지 못했어요. 잠시 뒤 다시 해 보세요."}; }
}
DRAW.dict=(sec,w,title)=>{ const u=UI(w), c=w.config||{}; if(!u.mode) u.mode=DMODES[c.mode]?c.mode:"영영"; const b=cardBody(sec,title);
  b.appendChild(h("div",{class:"seg"}, ...Object.keys(DMODES).map(k=>h("button",{class:k===u.mode?"on":"", text:k, onclick:()=>{ u.mode=k; u.res=null; render(); }}))));
  searchRow(b,u,DMODES[u.mode].ph,async()=>{ if(!u.q) return; u.busy=true; u.res=null; render(); u.res=await dictLookup(u.mode,u.q,c); u.busy=false; render(); });
  if(u.busy){ empty(b,"찾는 중…"); return; }
  const r=u.res; if(!r) return; if(r.err){ empty(b,r.err); return; }

/* ================= 폰·태블릿 배치 (이 기기에만 기억, 동기화 안 함) =================
   · 화면 폭에 따라 칸 수: 폰 1칸 · 태블릿 세로(폰 가로) 2칸 · 태블릿 가로 3칸 · 아주 넓으면 4칸
   · 칸 수(= 세로/가로 모드)마다 순서·크기를 따로 기억
   · 처음에는 PC 순서대로 빈틈없이, 그 뒤로는 PC에서 옮겨도 이 기기 배치는 그대로 */
const LAY_GAP=14, LAY_ROW=8;
function layCols(){ const w=window.innerWidth||document.documentElement.clientWidth||400; return w<600?1:w<1000?2:w<1500?3:4; }
function layAll(){ try{ const o=JSON.parse(localStorage.getItem("m.layout")||"{}"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
function layCur(){ const o=layAll()["c"+layCols()]; const L=(o&&typeof o==="object")?o:{};
  L.order=Array.isArray(L.order)?L.order:[]; L.size=(L.size&&typeof L.size==="object")?L.size:{}; return L; }
function laySave(L){ const all=layAll(); all["c"+layCols()]=L; try{ localStorage.setItem("m.layout", JSON.stringify(all)); }catch(e){} }
function layOrder(ids){ const L=layCur(), fresh=ids.filter(id=>!L.order.includes(id));
  if(fresh.length){ L.order=L.order.concat(fresh); laySave(L); }                 /* 새로 생긴 것은 맨 뒤에 */
  return L.order.slice(); }
/* 빈틈없이: 격자 줄 높이를 잘게 나누고, 카드마다 자기 높이만큼 줄을 차지 (내용이 바뀌면 다시 계산) */
function spanOf(sec){ if(!sec||!sec.isConnected) return; const hh=sec.getBoundingClientRect().height;
  sec.style.gridRowEnd="span "+Math.max(1,Math.ceil((hh+LAY_GAP)/LAY_ROW)); }
function layGrid(grid){ const cards=[...grid.children].filter(c=>c.classList.contains("card")); cards.forEach(spanOf);
  if(window.ResizeObserver){ if(!S.lro) S.lro=new ResizeObserver(en=>en.forEach(x=>spanOf(x.target))); cards.forEach(c=>S.lro.observe(c)); } }
let _lastCols=layCols();
window.addEventListener("resize",()=>{ const c=layCols(); if(c!==_lastCols){ _lastCols=c; if(S.data) render(); } });   /* 세로↔가로 바뀌면 그 모드의 배치로 */

/* ---- 배치 편집: ⠿ 끌어서 옮기기, ◢ 크기 조절 ---- */
S.arrange=false;
function arrangeOn(v){ S.arrange=!!v; document.body.classList.toggle("arranging", S.arrange); if(S.data) render(); }
function setSize(id, patch){ const L=layCur(); const z=Object.assign({}, L.size[id]||{}, patch); if(!z.h) delete z.h; if(!(z.s>1)) delete z.s;
  if(Object.keys(z).length) L.size[id]=z; else delete L.size[id]; laySave(L); render(); }
function decorateArrange(grid){
  const cols=layCols(), L=layCur();
  grid.querySelectorAll(":scope > .card").forEach(sec=>{
    const id=sec.dataset.lid, sz=L.size[id]||{}, span=Math.min(sz.s||1,cols), title=((sec.querySelector(".ttl")||{}).textContent)||"";
    const bar=h("div",{class:"arr"}, h("span",{class:"arr-h",text:"⠿"}), h("span",{class:"arr-t",text:title}),
      cols>1?h("button",{"aria-label":"폭 줄이기",text:"−",onclick:e=>{ e.stopPropagation(); setSize(id,{s:span-1}); }}):null,
      cols>1?h("span",{class:"arr-n",text:`${span}칸`}):null,
      cols>1?h("button",{"aria-label":"폭 늘리기",text:"＋",onclick:e=>{ e.stopPropagation(); setSize(id,{s:Math.min(cols,span+1)}); }}):null,
      sz.h?h("button",{text:"높이 자동",onclick:e=>{ e.stopPropagation(); setSize(id,{h:0}); }}):null);
    sec.insertBefore(bar, sec.firstChild);
    const grip=h("div",{class:"grip","aria-label":"크기 조절",text:"◢"}); sec.appendChild(grip);
    bindLayDrag(sec,bar,id); bindLayResize(sec,grip,id);
  });
}
function bindLayDrag(sec, handle, id){
  handle.addEventListener("pointerdown",e=>{
    if(e.button>0 || e.target.closest("button")) return; e.preventDefault();
    const sx=e.clientX, sy=e.clientY, r=sec.getBoundingClientRect(); let ghost=null, over=null, raf=0, py=sy;
    const setOver=t=>{ if(over===t) return; if(over) over.classList.remove("lay-over"); over=t; if(over) over.classList.add("lay-over"); };
    const find=(x,y)=>{ const el=document.elementFromPoint(x,y), c=el&&el.closest(".grid > .card"); return c&&c!==sec?c:null; };
    const auto=()=>{ const H=window.innerHeight, dy=py<80?-14:py>H-120?14:0; if(dy) window.scrollBy(0,dy); raf=requestAnimationFrame(auto); };   /* 화면 끝에 가면 저절로 스크롤 */
    const move=ev=>{ py=ev.clientY;
      if(!ghost){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
        S.dragging=true; ghost=sec.cloneNode(true); ghost.classList.add("lay-ghost");
        Object.assign(ghost.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:Math.min(r.height,260)+"px"});
        document.body.appendChild(ghost); sec.classList.add("lay-src"); raf=requestAnimationFrame(auto); }
      ev.preventDefault(); ghost.style.transform=`translate(${ev.clientX-sx}px,${ev.clientY-sy}px)`; setOver(find(ev.clientX,ev.clientY)); };
    const end=ok=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",cancel);
      cancelAnimationFrame(raf); if(!ghost) return;
      ghost.remove(); sec.classList.remove("lay-src"); const t=ok?over:null; setOver(null); S.dragging=false; S.renderLater=false;
      if(t){ const L=layCur(), o=L.order, tid=t.dataset.lid, to0=o.indexOf(tid), from=o.indexOf(id);
        o.splice(from,1); const ti=o.indexOf(tid); o.splice(from<to0?ti+1:ti, 0, id); laySave(L); }   /* 놓은 칸의 자리로 */
      render(); };
    const up=()=>end(true), cancel=()=>end(false);
    document.addEventListener("pointermove",move,{passive:false}); document.addEventListener("pointerup",up); document.addEventListener("pointercancel",cancel);
  });
}
function bindLayResize(sec, grip, id){
  grip.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation(); try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    const cols=layCols(), gw=sec.parentElement.getBoundingClientRect().width, cw=(gw-(cols-1)*LAY_GAP)/cols, r=sec.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    let s=Math.max(1,Math.round((r.width+LAY_GAP)/(cw+LAY_GAP))), hh=Math.round(r.height), moved=false;
    const lbl=h("div",{class:"szlbl"}); sec.appendChild(lbl); S.dragging=true;
    const move=ev=>{ ev.preventDefault(); if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>4) moved=true; if(!moved) return;
      s=cols>1?Math.min(cols,Math.max(1,Math.round((r.width+ev.clientX-sx+LAY_GAP)/(cw+LAY_GAP)))):1;
      hh=Math.max(120,Math.round((r.height+ev.clientY-sy)/20)*20);
      sec.style.gridColumn=s>1?`span ${s}`:""; sec.style.height=hh+"px"; sec.classList.add("fixh"); lbl.textContent=(cols>1?`${s}칸 · `:"")+`높이 ${hh}`; spanOf(sec); };
    const up=()=>{ grip.removeEventListener("pointermove",move); grip.removeEventListener("pointerup",up); grip.removeEventListener("pointercancel",up);
      lbl.remove(); S.dragging=false; S.renderLater=false; if(moved) setSize(id,{s,h:hh}); else render(); };
    grip.addEventListener("pointermove",move); grip.addEventListener("pointerup",up); grip.addEventListener("pointercancel",up);
  });
}
/* 카드 제목을 길게 누르면 배치 편집 */
document.addEventListener("pointerdown",e=>{
  if(S.arrange || !S.data) return; const hd=e.target.closest(".grid > .card > .head"); if(!hd || e.target.closest("button,a,input,textarea")) return;
  const sx=e.clientX, sy=e.clientY;
  const done=()=>{ clearTimeout(t); document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",done); document.removeEventListener("pointercancel",done); };
  const mv=ev=>{ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8) done(); };
  const t=setTimeout(()=>{ done(); try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){} arrangeOn(true); toast("⠿를 끌어 옮기고, ◢로 크기를 바꿔요"); }, 600);
  document.addEventListener("pointermove",mv); document.addEventListener("pointerup",done); document.addEventListener("pointercancel",done);
});

function render(){
  if(S.dragging){ S.renderLater=true; return; }                   // 배치를 옮기는 중에는 다시 그리지 않음
  applyTheme();
  const app=$("#app"); app.innerHTML="";
  const d=S.data; if(!d){ renderEmpty(); return; }
  const now=new Date(), today=ymdNow();
  const todos=(d.widgets||[]).filter(w=>w.type==="todo"&&wShown(w)).flatMap(w=>(w.config&&w.config.items)||[]);
  const left=todos.filter(t=>!t.done && t.date===today).length, late=todos.filter(t=>!t.done && t.date && t.date<today).length;
  app.appendChild(h("section",{class:"today"},
    h("h1",{class:"date"}, `${now.getMonth()+1}월 ${now.getDate()}일`, h("span",{class:"dow", text:`${DOW[now.getDay()]}요일`})),
    h("p",{class:"sum", text: left||late ? (left&&late ? `오늘 할 일 ${left}개와 지난 할 일 ${late}개가 남았어요.` : left ? `오늘 할 일이 ${left}개 남았어요.` : `지난 할 일이 ${late}개 남았어요.`) : "오늘 남은 할 일이 없어요."})));
  const skip=[], entries=[];                                          // 보여줄 칸들 (메모는 한 칸: __memo)
  const anyNote=(d.notes||[]).some(n=>n&&noteShown(n.id));
  orderWidgets(d).forEach(w=>{
    if(w.type!=="memo" && !wShown(w)) return;                       // 이 폰에서 안 보기로 한 위젯
    if(!SUPPORTED.has(w.type)){ skip.push(TITLES[w.type]||w.type); return; }
    if(w.type==="memo"){ if(anyNote && !entries.some(e=>e.id==="__memo")) entries.push({id:"__memo", draw:sec=>drawNotes(sec)}); return; }
    const title=(typeof w.title==="string"&&w.title.trim())?w.title:TITLES[w.type];
    entries.push({id:w.id, draw:sec=>{ if(w.type==="todo") drawTodo(sec,w,title); else if(w.type==="dday") drawDday(sec,w,title);
      else if(DRAW[w.type]) DRAW[w.type](sec,w,title); else drawLinks(sec,w,title); }});
  });
  if(anyNote && !entries.some(e=>e.id==="__memo")) entries.push({id:"__memo", draw:sec=>drawNotes(sec)});
  /* 이 기기에 기억한 배치대로 (처음이면 PC 순서를 그대로 기억 → 이후 PC에서 옮겨도 이 기기는 그대로) */
  const cols=layCols(), ord=layOrder(entries.map(e=>e.id)), L=layCur();
  document.documentElement.style.setProperty("--cols", cols);
  document.documentElement.style.setProperty("--wrapw", cols>1?"1400px":"560px");
  entries.sort((a,b)=>ord.indexOf(a.id)-ord.indexOf(b.id));
  const grid=h("div",{class:"grid"}); app.appendChild(grid);
  entries.forEach(e=>{ const sec=h("section",{class:"card sec"}); sec.dataset.lid=e.id;
    const sz=L.size[e.id]||{}; if(cols>1 && sz.s>1) sec.style.gridColumn=`span ${Math.min(sz.s,cols)}`;
    if(sz.h){ sec.style.height=sz.h+"px"; sec.classList.add("fixh"); }
    grid.appendChild(sec); e.draw(sec); });
  if(S.arrange) decorateArrange(grid);
  layGrid(grid);
  if(skip.length) app.appendChild(h("p",{class:"pconly", text:`PC에서만 볼 수 있는 위젯: ${[...new Set(skip)].join(", ")}`}));
}

function drawTodo(sec,w,title){
  const items=(cfg(w).items||[]).filter(x=>x&&typeof x==="object");
  /* PC와 같은 순서: 날짜 빠른 순 → 같은 날은 먼저 추가한 순 → 날짜 없는 할 일은 맨 아래 */
  const undone=items.filter(x=>!x.done).map((it,i)=>[it,i]).sort((a,b)=>{ const x=a[0].date||"99999999", y=b[0].date||"99999999"; return x<y?-1:x>y?1:a[1]-b[1]; }).map(v=>v[0]);
  const done=items.filter(x=>x.done);
  sec.appendChild(h("div",{class:"head"}, h("h2",{class:"ttl", text:title})));
  const p=h("div",{class:"body"}); sec.appendChild(p);
  const row=(it)=>{
    const due=fmtDue(it.date);
    const r=h("div",{class:"row"+(it.done?" done":"")});
    const chk=h("button",{class:"chk","aria-label":it.done?"완료 취소":"완료", onclick:()=>commit(Todo.toggle(w.id,it.id,!it.done))});
    chk.innerHTML=CHECK;
    const tx=h("button",{class:"txt", text:String(it.text||"")});
    tx.addEventListener("click",()=>{
      if(it.done) return;
      const inp=h("input",{value:String(it.text||""), "aria-label":"할 일 수정"}); tx.textContent=""; tx.appendChild(inp); inp.focus();
      let fin=false; const end=(save)=>{ if(fin) return; fin=true; const v=inp.value.trim();
        if(save && v && v!==it.text) commit(Todo.edit(w.id,it.id,v)); else render(); };
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") end(true); else if(e.key==="Escape") end(false); });
      inp.addEventListener("blur",()=>end(true));
    });
    r.append(chk, tx);
    if(due) r.appendChild(h("span",{class:"due "+(it.done?"":due.cls), text:due.label}));
    r.appendChild(h("button",{class:"del","aria-label":"삭제", text:"✕",
      onclick:()=>{ if(confirm(`"${String(it.text||"").slice(0,30)}"을(를) 지울까요?`)) commit(Todo.del(w.id,it.id)); }}));
    return r;
  };
  if(!undone.length && !done.length) p.appendChild(h("div",{class:"empty", text:"할 일을 적어 보세요."}));
  undone.forEach(it=>p.appendChild(row(it)));
  if(done.length){
    const open=openDone.has(w.id);
    p.appendChild(h("button",{class:"more", text:`${open?"▾":"▸"} 완료됨 ${done.length}`, onclick:()=>{ open?openDone.delete(w.id):openDone.add(w.id); render(); }}));
    if(open) done.forEach(it=>p.appendChild(row(it)));
  }
  const tIn=h("input",{placeholder:"할 일 입력", "aria-label":"새 할 일"}), dIn=h("input",{type:"date", value:isoNow(), "aria-label":"날짜"});
  const add=()=>{ const v=tIn.value.trim(); if(!v) return; const date=(dIn.value||isoNow()).replace(/-/g,"");
    commit(Todo.add(w.id,{id:uid(), text:v, done:false, date})); };
  tIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  p.appendChild(h("div",{class:"add"}, tIn, dIn, h("button",{class:"mini go", text:"추가", onclick:add})));
}

const openNotes = new Set(); let focusNote = null;
function drawNotes(sec){
  const list=(Array.isArray(S.data.notes)?S.data.notes:[]).filter(n=>n&&typeof n.id==="string"&&noteShown(n.id)).slice().sort((a,b)=>(+b.at||0)-(+a.at||0));
  sec.appendChild(h("div",{class:"head"}, h("h2",{class:"ttl", text:"메모"})));
  const p=h("div",{class:"body"}); sec.appendChild(p);
  if(!list.length) p.appendChild(h("div",{class:"empty", text:"메모가 없어요."}));
  list.forEach(n=>{
    const c=NOTE_COLORS[n.color]||"", open=openNotes.has(n.id);
    const box=h("div",{class:"nt"+(open?" open":"")}); box.style.setProperty("--nc", c||"transparent");
    const at=+n.at||0, dt=at?new Date(at):null;
    box.appendChild(h("button",{class:"nt-h", "aria-expanded":String(open), onclick:()=>{ open?openNotes.delete(n.id):openNotes.add(n.id); render(); }},
      h("i",{class:"nt-dot"}), h("span",{class:"nt-t", text:noteTitle(n)}), h("span",{class:"nt-d", text:dt?`${dt.getMonth()+1}/${dt.getDate()}`:""})));
    if(open){
      const ta=h("textarea",{class:"memo", placeholder:"메모를 적어 보세요", "aria-label":noteTitle(n)});
      ta.value=String(n.text||"");
      const st=h("div",{class:"memo-st"});
      const grow=()=>{ ta.style.height="auto"; ta.style.height=Math.max(132,ta.scrollHeight)+"px"; };
      let t=null;
      ta.addEventListener("input",()=>{ grow(); st.textContent="입력 중…"; clearTimeout(t);
        t=setTimeout(()=>{ t=null; commit(Note.set(n.id, ta.value), 0); st.textContent="저장됨"; }, 1200); });
      ta.addEventListener("blur",()=>{ if(t){ clearTimeout(t); t=null; if(ta.value!==String(n.text||"")) commit(Note.set(n.id, ta.value), 0); } });
      const del=h("button",{class:"nt-x", text:"메모 지우기",
        onclick:()=>{ if(confirm(`"${noteTitle(n)}" 메모를 지울까요?`)){ openNotes.delete(n.id); commit(Note.del(n.id)); } }});
      box.append(ta, h("div",{class:"nt-f"}, st, del));
      (window.requestAnimationFrame||setTimeout)(()=>{ grow(); if(focusNote===n.id){ focusNote=null; ta.focus(); } });
    }
    p.appendChild(box);
  });
  p.appendChild(h("button",{class:"more", text:"＋ 새 메모", onclick:()=>{
    const id="n"+uid()+uid(); openNotes.add(id); focusNote=id;
    commit(Note.add({id, text:"", color:"", at:Date.now()}), 0); }}));
}

function drawDday(sec,w,title){
  const evs=(cfg(w).events||[]).filter(x=>x&&typeof x==="object");
  const ed=editing.has(w.id);
  sec.appendChild(h("div",{class:"head"}, h("h2",{class:"ttl", text:title}), h("button",{class:"tool", text:ed?"완료":"편집", onclick:()=>{ ed?editing.delete(w.id):editing.add(w.id); render(); }})));
  const p=h("div",{class:"body"}); sec.appendChild(p);
  if(!evs.length) p.appendChild(h("div",{class:"empty", text:"기념일이나 마감일을 추가해 보세요."}));
  const t0=new Date(); t0.setHours(0,0,0,0);
  evs.forEach(ev=>{
    const dt=new Date(String(ev.date||"")+"T00:00"); const ok=!isNaN(dt);
    const n=ok?Math.round((dt-t0)/86400000):null;
    const v=n===null?"":(n===0?"D-Day":(n>0?`D-${n}`:`D+${-n}`));
    const row=h("div",{class:"dd"},
      h("div",{class:"n"}, String(ev.name||""), h("div",{class:"d", text:String(ev.date||"")})),
      h("div",{class:"v"+(n!==null&&n>=0&&n<=7?" soon":"")+(n!==null&&n<0?" past":""), text:v}));
    if(ed) row.appendChild(h("button",{class:"del","aria-label":"삭제",text:"✕", onclick:()=>{ if(confirm(`"${String(ev.name||"")}"을(를) 지울까요?`)) commit(List.del(w.id,"events",ev.id)); }}));
    p.appendChild(row);
  });
  const nIn=h("input",{placeholder:"이름", "aria-label":"D-Day 이름"}), dIn=h("input",{type:"date", value:isoNow(), "aria-label":"날짜"});
  const add=()=>{ const v=nIn.value.trim(); if(!v||!dIn.value) return; commit(List.add(w.id,"events",{id:uid(), name:v, date:dIn.value})); };
  nIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  p.appendChild(h("div",{class:"add"}, nIn, dIn, h("button",{class:"mini go", text:"추가", onclick:add})));
}

function drawLinks(sec,w,title){
  const items=(cfg(w).items||[]).filter(x=>x&&typeof x==="object");
  const ed=editing.has(w.id);
  sec.appendChild(h("div",{class:"head"}, h("h2",{class:"ttl", text:title}), h("button",{class:"tool", text:ed?"완료":"편집", onclick:()=>{ ed?editing.delete(w.id):editing.add(w.id); render(); }})));
  const p=h("div",{class:"body"}); sec.appendChild(p);
  const box=h("div",{class:"links"}); p.appendChild(box);
  if(!items.length) box.appendChild(h("div",{class:"empty", text:"자주 가는 사이트를 추가해 보세요."}));
  items.forEach(it=>{
    const url=safeUrl(it.url);
    const b=h("button",{class:"lk", title:url||"열 수 없는 주소", onclick:(e)=>{ if(e.target.classList.contains("x")) return;
      if(url) window.open(url,"_blank","noopener"); else toast("웹 주소가 아니라 열 수 없어요"); }}, h("span",{text:String(it.name||url||"이름 없음")}));
    if(ed) b.appendChild(h("button",{class:"x","aria-label":"삭제",text:"✕", onclick:(e)=>{ e.stopPropagation();
      if(confirm(`"${String(it.name||"")}"을(를) 지울까요?`)) commit(List.del(w.id,"items",it.id)); }}));
    box.appendChild(b);
  });
  if(ed){
    const nIn=h("input",{placeholder:"이름", "aria-label":"사이트 이름"}), uIn=h("input",{placeholder:"주소", inputmode:"url", "aria-label":"사이트 주소"});
    const add=()=>{ const n=nIn.value.trim(); let u=uIn.value.trim(); if(!n||!u) return; if(!/^https?:\/\//i.test(u)) u="https://"+u;
      commit(List.add(w.id,"items",{id:uid(), name:n, url:u})); };
    p.appendChild(h("div",{class:"add"}, nIn, uIn, h("button",{class:"mini go", text:"추가", onclick:add})));
  }
}

    app.appendChild(h("section",{class:"hello"}, h("h1",{text:"설정이 필요해요"}),
