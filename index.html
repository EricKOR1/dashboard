<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#F3EFE6; --bg-soft:#FBF9F2;
    --card:#FFFFFF; --card-2:#F6F1E7;
    --border:#E8E1D0; --border-strong:#D7CDB6;
    --text:#231D12; --muted:#7F7666; --faint:#AEA48F;
    --accent:#B88923; --accent-2:#9A7115; --accent-soft:rgba(184,137,35,.12);
    --accent-ink:#2A2005;
    --teal:#2E9E92; --danger:#D25A50; --good:#3F9E55;
    --dot:rgba(70,56,28,.06);
    --radius:20px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(56,44,20,.05), 0 14px 34px -20px rgba(56,44,20,.18);
    --shadow-lift:0 5px 12px rgba(56,44,20,.08), 0 26px 52px -18px rgba(56,44,20,.22);
    --ease:cubic-bezier(.25,.6,.3,1);
  }
  [data-theme="dark"]{
    --bg:#181510; --bg-soft:#201B14;
    --card:#231E15; --card-2:#2C2618;
    --border:#342D1E; --border-strong:#48402C;
    --text:#F2EDE2; --muted:#A79D8B; --faint:#746B59;
    --accent:#E7BD54; --accent-2:#D2A539; --accent-soft:rgba(231,189,84,.15);
    --accent-ink:#241C05;
    --teal:#7FD6CC; --danger:#E5736B; --good:#86C98B;
    --dot:rgba(255,240,219,.05);
    --shadow:0 2px 4px rgba(0,0,0,.25), 0 18px 40px -20px rgba(0,0,0,.5);
    --shadow-lift:0 6px 14px rgba(0,0,0,.3), 0 26px 52px -16px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    color:var(--text);
    background:
      radial-gradient(1100px 460px at 12% -8%, rgba(214,171,74,.14), transparent 60%),
      radial-gradient(900px 420px at 96% -4%, rgba(46,158,146,.07), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; min-height:100vh;
  }

  /* ===== 테두리 없는 창의 상단 (창 이동 손잡이 + 창 버튼) ===== */
  #titlebar{
    position:fixed; top:0; left:0; right:0; height:42px; z-index:1000;
    display:none; align-items:center; justify-content:space-between;
    padding:0 12px 0 18px; user-select:none;
  }
  body.app #titlebar{display:flex;}
  #titlebar .tb-title{font-size:12.5px; font-weight:600; color:var(--faint); letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
  #titlebar .tb-title .dotmark{width:13px; height:13px; border-radius:4px; background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .tb-controls{display:flex; gap:4px;}
  .wbtn{
    width:34px; height:28px; border-radius:9px; background:transparent; color:var(--muted);
    font-size:14px; display:grid; place-items:center; transition:background .13s var(--ease), color .13s var(--ease);
  }
  .wbtn:hover{background:var(--card-2); color:var(--text);}
  .wbtn.close:hover{background:rgba(210,90,80,.14); color:var(--danger);}

  .wrap{position:relative; z-index:1; max-width:none; margin:0; padding:24px 30px 80px;}
  body.app .wrap{padding-top:54px;}

  /* ===== 상단 인사 ===== */
  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:20px; flex-wrap:wrap;}
  .hello{display:flex; flex-direction:column; gap:5px;}
  .greet{font-size:26px; font-weight:800; color:var(--text); letter-spacing:-.6px;}
  .today{font-size:26px; font-weight:800; letter-spacing:-.6px;}
  .today .dim{color:var(--muted); font-weight:600;}
  .actions{display:flex; gap:9px; align-items:center;}

  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 16px;
    border-radius:var(--radius-sm); background:var(--card); color:var(--text);
    border:1px solid var(--border); font-size:13.5px; font-weight:600;
    box-shadow:0 1px 2px rgba(56,44,20,.05);
    transition:border-color .14s var(--ease), box-shadow .14s var(--ease), transform .14s var(--ease);
  }
  .btn:hover{border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0); box-shadow:0 1px 2px rgba(56,44,20,.05);}
  .btn.icon{width:42px; padding:0; justify-content:center; font-size:17px;}
  .btn.primary{background:linear-gradient(135deg,#D7AC45,var(--accent)); color:var(--accent-ink); border:none; box-shadow:0 10px 22px -10px rgba(184,137,35,.55);}
  .btn.primary:hover{filter:brightness(1.04);}

  /* ===== 자유 배치 보드 ===== */
  .board{
    position:relative; min-height:60vh;
    background-image:radial-gradient(var(--dot) 1.3px, transparent 1.3px);
    background-size:26px 26px; border-radius:18px;
  }
  .card{
    position:absolute; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 16px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    transition:box-shadow .16s var(--ease), border-color .16s var(--ease);
    animation:pop .18s var(--ease) both; overflow:hidden;
  }
  .card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-lift);}
  .card.moving,.card.sizing{transition:none; box-shadow:var(--shadow-lift); border-color:var(--accent);}
  @keyframes pop{from{opacity:0; transform:scale(.99);}}
  .card .head{display:flex; align-items:center; gap:8px; margin-bottom:11px; cursor:grab; flex:none;}
  .card.moving .head{cursor:grabbing;}
  .card .head .ttl{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .card .head .ttl .ico{font-size:15px;}
  .card .head .sp{flex:1;}
  .hact{width:27px; height:27px; border-radius:9px; display:grid; place-items:center; background:transparent; color:var(--faint); font-size:13px; opacity:.45; transition:opacity .13s var(--ease), background .13s var(--ease), color .13s var(--ease);}
  .card:hover .hact{opacity:1;}
  .hact:hover{background:var(--card-2); color:var(--text);}
  .hact.del:hover{color:var(--danger);}
  .card .body{flex:1; overflow:auto; min-height:0; margin:-2px; padding:2px;}

  /* 카드 크기조절 손잡이 */
  .rsz{position:absolute; right:3px; bottom:3px; width:18px; height:18px; cursor:nwse-resize; opacity:0; transition:opacity .13s;}
  .card:hover .rsz{opacity:.55;}
  .rsz:hover{opacity:1;}
  .rsz::after{content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); border-radius:0 0 3px 0;}

  /* 창 크기조절 손잡이 (오른쪽 아래) */
  #winResize{position:fixed; right:0; bottom:0; width:20px; height:20px; z-index:900; cursor:nwse-resize; display:none;}
  body.app #winResize{display:block;}
  #winResize::after{content:""; position:absolute; right:4px; bottom:4px; width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint);}

  /* 공통 폼 */
  input,textarea,select{font-family:inherit; color:var(--text); background:var(--bg-soft); border:1px solid var(--border); border-radius:11px; padding:10px 12px; font-size:14px; outline:none; width:100%; transition:border-color .13s var(--ease), box-shadow .13s var(--ease), background .13s var(--ease);}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:focus,textarea:focus,select:focus{border-color:var(--accent); background:var(--card); box-shadow:0 0 0 3px var(--accent-soft);}
  .row{display:flex; gap:8px;}
  .mini{height:38px; padding:0 13px; border-radius:11px; font-size:13px; font-weight:600; background:var(--card); color:var(--text); border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px; transition:border-color .13s var(--ease), background .13s var(--ease); white-space:nowrap;}
  .mini:hover{border-color:var(--border-strong);}
  .mini.go{background:var(--accent-soft); color:var(--accent-2); border-color:transparent; font-weight:700;}
  .mini.go:hover{background:rgba(184,137,35,.2);}
  .empty{color:var(--muted); font-size:13px; line-height:1.6; padding:6px 2px;}

  .clock .time{font-size:50px; font-weight:800; letter-spacing:-1.5px; line-height:1; font-variant-numeric:tabular-nums;}
  .clock .time .sec{font-size:22px; font-weight:600; color:var(--accent); vertical-align:super; margin-left:4px;}
  .clock .sub{margin-top:10px; color:var(--muted); font-size:13.5px;}

  .wx .now{display:flex; align-items:center; gap:13px;}
  .wx .emoji{font-size:44px; line-height:1;}
  .wx .temp{font-size:40px; font-weight:800; letter-spacing:-1.5px;}
  .wx .temp small{font-size:17px; color:var(--muted); font-weight:600;}
  .wx .desc{color:var(--muted); font-size:13px;}
  .wx .wxloc{cursor:pointer; display:inline-block; transition:color .13s;}
  .wx .wxloc:hover{color:var(--accent);}
  .wx .meta{display:flex; gap:14px; margin-top:11px; color:var(--muted); font-size:12.5px; flex-wrap:wrap;}
  .wx .meta b{color:var(--text); font-weight:700;}
  .wx .fc{display:flex; gap:7px; margin-top:13px;}
  .wx .fc .d{flex:1; text-align:center; background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:8px 3px;}
  .wx .fc .d .dn{font-size:11.5px; color:var(--muted);}
  .wx .fc .d .de{font-size:19px; margin:3px 0;}
  .wx .fc .d .dt{font-size:11.5px; font-weight:700;}
  .wx .fc .d .dt .lo{color:var(--muted); font-weight:500;}
  .wx .fc .d .dp{font-size:10.5px; color:var(--teal); font-weight:700; margin-top:2px;}
  .wx .wsrc{font-size:10.5px; color:var(--faint); margin-top:8px;}
  .wx .hrs{display:flex; gap:4px; margin-top:11px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;}
  .wx .hrs .h{flex:none; width:47px; text-align:center; padding:7px 2px; border-radius:11px; background:var(--card-2); border:1px solid var(--border);}
  .wx .hrs .h[data-hnow]{border-color:var(--accent); background:var(--accent-soft);}
  .wx .hrs .hh{font-size:10.5px; color:var(--muted); font-weight:700;}
  .wx .hrs .he{font-size:16px; margin:3px 0 1px;}
  .wx .hrs .ht{font-size:13px; font-weight:800;}
  .wx .hrs .hp{font-size:10px; color:var(--faint); margin-top:2px; font-weight:700;}
  .wx .hrs .hp.wet{color:var(--teal);}
  .wx .air{display:flex; gap:14px; margin-top:9px; flex-wrap:wrap;}
  .wx .air .ai{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted);}
  .wx .air .ai b{color:var(--text); font-weight:700;}
  .wx .air .ai em{color:var(--faint); font-style:normal; font-size:11px;}
  .wx .air .dotg{width:8px; height:8px; border-radius:50%; flex:none;}
  .dotg.g1{background:#3F9E55;} .dotg.g2{background:#4C93D8;} .dotg.g3{background:#E0A23B;} .dotg.g4{background:#D25A50;}

  .quote .q-body{display:flex; flex-direction:column; justify-content:center; min-height:70px; padding:4px 2px;}
  .quote .q-t{font-size:15.5px; line-height:1.6; font-weight:600; word-break:keep-all;}
  .quote .q-a{margin-top:9px; font-size:12.5px; color:var(--accent-2); font-weight:700;}
  .quote .q-foot{margin-top:10px;}

  .dict .dict-body{margin-top:10px;}
  .dict .dmodes{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px;}
  .dict .dmode{font-size:11.5px; padding:5px 10px; border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:999px; cursor:pointer; transition:border-color .12s, color .12s, background .12s;}
  .dict .dmode:hover{border-color:var(--accent); color:var(--text);}
  .dict .dmode.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .dict .tr-main{font-size:20px; font-weight:800; margin-top:8px; word-break:break-word; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .dict .tr-read{font-size:13.5px; color:var(--accent-2); font-weight:700; margin-top:6px;}
  .dict .d-word{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .dict .spk{width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--card-2); color:var(--muted); font-size:12px; cursor:pointer; flex:none; transition:border-color .12s, color .12s;}
  .dict .spk:hover{border-color:var(--accent); color:var(--text);}
  .dict .tr-alts{margin-top:12px; padding-top:8px; border-top:1px solid var(--border);}
  .dict .tr-lbl{font-size:11px; font-weight:700; color:var(--accent-2); margin-bottom:4px;}
  .dict .tr-alt{font-size:13.5px; padding:3px 0; color:var(--muted);}
  .dict .d-more{font-size:11.5px; color:var(--accent-2); font-weight:700; margin-top:4px; cursor:pointer;}
  .dict .d-more:hover{text-decoration:underline;}
  .dict .d-src{font-size:10.5px; color:var(--faint); margin-top:10px;}
  .dict .dset{margin-bottom:10px; padding:10px; background:var(--card-2); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; gap:8px;}
  .dict .dset .setrow{display:flex; align-items:center; gap:8px;}
  .dict .dset .setrow span{flex:none; width:74px; font-size:11.5px; color:var(--muted); font-weight:700;}
  .dict .dset .setnote{font-size:11px; color:var(--faint); line-height:1.5;}

  .encyc .ency-body{margin-top:10px;}
  .encyc .e-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .encyc .e-img{width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--border); flex:none;}
  .encyc .e-title{font-size:17px; font-weight:800; word-break:break-word;}
  .encyc .e-text{font-size:13.5px; line-height:1.65; word-break:break-word; white-space:pre-wrap;}
  .encyc .e-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .encyc .e-src{font-size:10.5px; color:var(--faint);}

  .roster .rcount{font-size:10.5px; color:var(--faint); margin:6px 2px 4px;}
  .roster .rbody{overflow:auto;}
  .roster .rhead{font-size:11px; font-weight:700; color:var(--accent-2); margin:4px 2px 6px;}
  .roster .rrow{padding:8px 9px; border-radius:10px; background:var(--card-2); border:1px solid var(--border); margin-bottom:5px;}
  .roster .rn{font-size:14.5px; font-weight:800;}
  .roster .rc{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .roster .rp{font-size:11.5px; color:var(--accent-2); margin-top:4px;}
  .ctc .cphone{font-size:15px; font-weight:800; color:var(--accent-2); margin:3px 0 6px;}
  .ctc .cline{display:flex; gap:8px; font-size:12px; line-height:1.5; margin-top:2px;}
  .ctc .cline span{flex:none; width:42px; color:var(--muted); font-weight:700;}
  .ctc .cline b{font-weight:600; word-break:break-word;}
  .roster .rset{margin-bottom:10px; padding:10px; background:var(--card-2); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; gap:8px;}
  .roster .rset .setrow{display:flex; gap:8px; align-items:center;}
  .roster .rset .setrow span{flex:none; width:36px; font-size:11.5px; color:var(--muted); font-weight:700;}
  .roster .rset .rfile{font-size:12px; word-break:break-all;}
  .roster .rchk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;}
  .roster .rchk input{width:auto;}
  .roster .setnote{font-size:11px; color:var(--faint); line-height:1.5;}
  .roster .rup{display:flex; gap:6px; flex-wrap:wrap;}
  .roster .mini.up{position:relative; overflow:hidden; cursor:pointer;}
  .roster .mini.up input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}
  .roster .rdrop{border:2px dashed var(--border-strong); border-radius:14px; padding:20px 14px; text-align:center; transition:border-color .14s, background .14s;}
  .roster .rdrop.over{border-color:var(--accent); background:var(--accent-soft);}
  .roster .rd-i{font-size:30px; line-height:1;}
  .roster .rd-t{font-size:12.5px; color:var(--muted); margin:8px 0 12px;}
  .roster .rdrop .rup{justify-content:center;}
  .tt2 .ttabs{display:flex; gap:6px; margin-bottom:8px;}
  .tt2 .ttabs button{flex:1; padding:7px 0; font-size:12.5px; font-weight:700; border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:10px; cursor:pointer; transition:background .13s,color .13s,border-color .13s;}
  .tt2 .ttabs button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .tt2 .ttgrid{overflow:auto;}
  table.tt{width:100%; border-collapse:collapse; table-layout:fixed;}
  table.tt th{font-size:10.5px; color:var(--muted); font-weight:700; padding:4px 0; border-bottom:1px solid var(--border);}
  table.tt th.pn{width:20px; color:var(--faint);}
  table.tt th.now{color:var(--accent-2);}
  table.tt td{border:1px solid var(--border); border-radius:0; padding:3px 2px; text-align:center; vertical-align:middle; height:34px;}
  table.tt td.now{background:var(--accent-soft);}
  table.tt td .s{font-size:11px; font-weight:700; line-height:1.25; word-break:break-all;}
  table.tt td .t{font-size:9.5px; color:var(--faint); line-height:1.2; margin-top:1px; word-break:break-all;}
  .tt2 .ttsum{font-size:11px; color:var(--faint); margin-top:8px; text-align:right;}
  .dict .d-word{font-size:18px; font-weight:800;}
  .dict .d-word .d-ph{font-size:13px; font-weight:500; color:var(--muted); margin-left:6px;}
  .dict .d-mean{margin-top:10px; padding-top:8px; border-top:1px solid var(--border);}
  .dict .d-pos{display:inline-block; font-size:11px; font-weight:700; color:var(--accent-2); background:var(--accent-soft); padding:2px 8px; border-radius:999px; margin-bottom:4px;}
  .dict .d-def{font-size:13.5px; line-height:1.5;}
  .dict .d-ex{font-size:12.5px; color:var(--muted); margin-top:3px; font-style:italic;}

  .hist .hist-body{overflow:auto;}
  .hist .hist-note{font-size:11px; color:var(--faint); margin-bottom:6px;}
  .hist .hrow{display:flex; gap:10px; padding:7px 4px; border-bottom:1px solid var(--border);}
  .hist .hrow:last-child{border-bottom:none;}
  .hist .hrow.hlink{cursor:pointer; border-radius:8px; transition:background .11s;}
  .hist .hrow.hlink:hover{background:var(--card-2);}
  .hist .hyr{flex:none; width:44px; font-size:13px; font-weight:800; color:var(--accent-2);}
  .hist .htx{font-size:13px; line-height:1.45; word-break:break-word;}

  .country .ctry-body{margin-top:10px;}
  .country .c-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .country .c-flag{width:52px; height:auto; border-radius:6px; border:1px solid var(--border);}
  .country .c-flagem{font-size:46px; line-height:1;}
  .country .c-name{font-size:18px; font-weight:800;}
  .country .c-en{font-size:12.5px; color:var(--muted);}
  .country .c-rows{display:flex; flex-direction:column; gap:6px;}
  .country .c-r{display:flex; gap:10px; font-size:13.5px; padding:6px 8px; background:var(--card-2); border:1px solid var(--border); border-radius:10px;}
  .country .c-r span{flex:none; width:44px; color:var(--muted); font-weight:700; font-size:12px; align-self:center;}
  .country .c-r b{font-weight:700; word-break:break-word;}

  .ac-pop{position:fixed; z-index:10001; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lift); padding:4px; max-height:262px; overflow:auto;}
  .ac-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px;}
  .ac-item:hover, .ac-item.on{background:var(--card-2);}
  .ac-item .ac-l{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ac-item .ac-s{font-size:11.5px; color:var(--faint); flex:none;}

  .todo .list{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
  .todo .ttabs{display:flex; gap:6px; margin-bottom:8px;}

  .toast{position:fixed; z-index:2200; left:50%; bottom:30px; transform:translateX(-50%) translateY(16px); background:var(--text); border:none; color:var(--bg); padding:12px 18px; border-radius:13px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease);}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

  .spin{display:inline-block; width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint);}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<body>
  <div id="titlebar" class="pywebview-drag-region">
    <div class="tb-title pywebview-drag-region"><span class="dotmark pywebview-drag-region"></span> My Dashboard</div>
    <div class="tb-controls">
      <button class="wbtn" id="winMin" title="최소화">—</button>
      <button class="wbtn" id="winMax" title="최대화">▢</button>
      <button class="wbtn close" id="winClose" title="닫기">✕</button>
    </div>
  </div>

  <div class="wrap">
    <header class="top">
      <div class="hello">
        <div class="greet" id="greet">반가워요</div>
      </div>
      <div class="actions">
        <button class="btn icon" id="themeBtn" title="밝게/어둡게">🌙</button>
        <button class="btn primary" id="addBtn">＋ 위젯 추가</button>
      </div>
    </header>
    <div class="board" id="board"></div>
  </div>

  <div class="scrim" id="scrim">
    <div class="sheet">
      <h2>위젯 추가</h2>
      <p class="s">원하는 위젯을 골라 보드에 올리세요. 카드 제목줄을 끌면 자유롭게 옮기고, 오른쪽 아래 모서리를 끌면 크기를 바꿀 수 있어요. <span id="verTag" class="vertag"></span></p>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="winResize" title="창 크기 조절"></div>

<script>
/* ===== 저장 / 불러오기 ===== */
let state = { theme:"dark", widgets:[] };
let booted = false, maxZ = 1;

function hasApi(n){ return !!(window.pywebview && window.pywebview.api && window.pywebview.api[n]); }
async function persist(){
  if(!_ready) return;
  state.savedAt = Date.now();
  const data = JSON.stringify(state);
  try{ localStorage.setItem("dash.state", data); }catch(e){}
  if(hasApi("save_state")){ try{ await window.pywebview.api.save_state(data); }catch(e){} }
}
async function loadState(){
  let py=null, ls=null;
  if(hasApi("load_state")){ try{ const r=await window.pywebview.api.load_state(); if(r) py=r; }catch(e){} }
  try{ ls=localStorage.getItem("dash.state"); }catch(e){}
  const parse=(d)=>{ try{ const p=JSON.parse(d); return (p&&p.widgets)?p:null; }catch(e){ return null; } };
  const pp=parse(py), pl=parse(ls);
  let chosen=null;
  if(pp&&pl){ chosen = ((pl.savedAt||0) > (pp.savedAt||0)) ? pl : pp; }
  else { chosen = pp||pl; }
  if(chosen) state=chosen;
}
async function httpGet(url){
  if(hasApi("http_get")){
    const res=await window.pywebview.api.http_get(url);
    if(res&&res.ok) return res.text;
    throw new Error((res&&res.error)||"요청 실패");
  }
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return await r.text();
}
function openLink(url){ if(hasApi("open_url")) window.pywebview.api.open_url(url); else window.open(url,"_blank"); }
async function openPath(path){ if(!hasApi("open_path")){ toast("이 기능은 설치형(exe)에서만 동작해요"); return; } try{ const r=await window.pywebview.api.open_path(path); if(r&&!r.ok){ toast(r.error==="notfound"?"경로를 찾을 수 없어요":"열지 못했어요"); } }catch(e){ toast("열지 못했어요"); } }

function printContent(title, html){
  let area=document.getElementById("printArea");
  if(!area){ area=document.createElement("div"); area.id="printArea"; document.body.appendChild(area); }
  area.innerHTML=html;
  document.body.classList.add("printing");
  const done=()=>{ document.body.classList.remove("printing"); window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  setTimeout(()=>{ try{ window.print(); }catch(e){ done(); } },60);
}

let _calPop=null;
function closeCalendar(){ if(_calPop){ _calPop.remove(); _calPop=null; document.removeEventListener("pointerdown",_calOutside,true); document.removeEventListener("keydown",_calEsc,true); } }
function _calOutside(e){ if(_calPop && !_calPop.contains(e.target)) closeCalendar(); }
function _calEsc(e){ if(e.key==="Escape") closeCalendar(); }
function openCalendar(anchor, initial, onPick){
  closeCalendar();
  const pop=el("div","calpop"); _calPop=pop;
  const view=new Date(initial.getFullYear(), initial.getMonth(), 1);
  const z=n=>String(n).padStart(2,"0");
  const render=()=>{
    const y=view.getFullYear(), m=view.getMonth(), dim=new Date(y,m+1,0).getDate(), startDow=new Date(y,m,1).getDay();
    const days=["일","월","화","수","목","금","토"]; const todayY=ymd(new Date()), selY=ymd(initial);
    let h=`<div class="cal-h"><button data-pm>‹</button><span>${y}년 ${m+1}월</span><button data-nm>›</button></div><div class="cal-grid">`;
    days.forEach((d,i)=>h+=`<div class="cal-w${i===0?' sun':i===6?' sat':''}">${d}</div>`);
    for(let i=0;i<startDow;i++) h+=`<div></div>`;
    for(let dn=1; dn<=dim; dn++){ const ds=`${y}${z(m+1)}${z(dn)}`, dow=new Date(y,m,dn).getDay(); const cl=["cal-d"]; if(ds===todayY)cl.push("today"); if(ds===selY)cl.push("sel"); if(dow===0)cl.push("sun"); if(dow===6)cl.push("sat"); h+=`<div class="${cl.join(' ')}" data-d="${dn}">${dn}</div>`; }
    h+=`</div>`; pop.innerHTML=h;
    $("[data-pm]",pop).onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
    $("[data-nm]",pop).onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
    [...pop.querySelectorAll("[data-d]")].forEach(c=>c.onclick=()=>{ const picked=new Date(view.getFullYear(), view.getMonth(), +c.dataset.d); closeCalendar(); onPick(picked); });
  };
  render(); document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  let left=Math.max(8, Math.min(r.left+r.width/2-pop.offsetWidth/2, window.innerWidth-pop.offsetWidth-8));
  let top=r.bottom+6; if(top+pop.offsetHeight>window.innerHeight-8) top=Math.max(8, r.top-pop.offsetHeight-6);
  pop.style.left=left+"px"; pop.style.top=top+"px";
  setTimeout(()=>{ document.addEventListener("pointerdown",_calOutside,true); document.addEventListener("keydown",_calEsc,true); },0);
}

/* ===== 유틸 ===== */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const isoOf=s=>`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v/8)*8;
let toastTimer=null;
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1700);}

/* ===== 위젯 정의 (시계/날씨/할일/급식/디데이/바로가기) ===== */
const WIDGETS = {
  clock:{ title:"시계", icon:"🕑", desc:"현재 시각과 오늘 날짜를 큼직하게.",
    mount(b){ b.classList.add("clock"); b.innerHTML=`<div class="time" data-clock-time>00:00<span class="sec">00</span></div><div class="sub" data-clock-date>—</div>`; tickClock(); } },

  weather:{ title:"날씨", icon:"⛅", desc:"오늘 날씨와 3일 예보. 도시 변경 가능.", settings:true,
    defaultCfg:()=>({name:"서울",lat:37.5665,lon:126.9780}),
    mount(b,w){ b.classList.add("wx"); b.innerHTML=`<div data-wx-main><span class="spin"></span> 날씨 불러오는 중…</div>`; this.load(b,w);
      if(w._timer) clearInterval(w._timer); w._timer=setInterval(()=>{ if(!document.body.contains(b)){ clearInterval(w._timer); w._timer=null; return; } this.load(b,w); }, 900000); },
    openSettings(b,w){
      const old=$(".wxset",b); if(old){ old.remove(); return; }
      const box=el("div","wxset"); box.style.marginBottom="4px";
      box.innerHTML=`<div class="row"><input placeholder="지역 (예: 포항, 강남, Tokyo)" data-q value="${w.config.name||''}"><button class="mini go" data-find>검색</button></div><div class="sresult" data-res></div>`;
      b.insertBefore(box, b.firstChild);
      const q=$("[data-q]",box), res=$("[data-res]",box);
      const pick=(name,lat,lon)=>{ w.config={name:name,lat:lat,lon:lon}; persist(); box.remove(); this.load(b,w); toast(`${name} 날씨로 변경`); };
      const find=async()=>{const name=q.value.trim(); if(!name)return; res.innerHTML=`<div class="empty"><span class="spin"></span> 검색 중…</div>`;
        const kr=krPlaceMatch(name);
        if(kr.length){ res.innerHTML=""; kr.forEach(p=>{ const it=el("div","si",`<div class="sn">${p.n}</div><div class="sr">${p.r}</div>`); it.onclick=()=>pick(p.n,p.lat,p.lon); res.appendChild(it); }); return; }
        try{ const d=JSON.parse(await httpGet(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=10&language=ko&format=json`)); res.innerHTML="";
          if(!d.results||!d.results.length){res.innerHTML=`<div class="empty">검색 결과가 없어요. 시·군·구 이름으로 다시 시도해 보세요.</div>`; return;}
          d.results.forEach(r=>{const it=el("div","si",`<div class="sn">${r.name}</div><div class="sr">${[r.admin2,r.admin1,r.country].filter(Boolean).join(" · ")}</div>`);
            it.onclick=()=>pick(r.name,r.latitude,r.longitude); res.appendChild(it);});
        }catch(e){res.innerHTML=`<div class="empty">검색 실패. 인터넷 연결을 확인하세요.</div>`;} };
      $("[data-find]",box).onclick=find;
      attachAutocomplete(q,{ min:1, source:async(qv)=>{ const out=krPlaceMatch(qv).map(p=>({label:p.n, sub:p.r, value:p}));
          if(out.length>=5) return out;
          try{ const d=JSON.parse(await httpGet(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(qv)}&count=6&language=ko&format=json`)); (d.results||[]).forEach(r=>{ out.push({label:r.name, sub:[r.admin1,r.country].filter(Boolean).join(" · "), value:{n:r.name,lat:r.latitude,lon:r.longitude}}); }); }catch(e){}
          return out.slice(0,8); },
        onPick:(p)=>pick(p.n,p.lat,p.lon), onEnter:find });
      q.focus();
    },
    async load(b,w){
      const main=$("[data-wx-main]",b)||b; main.innerHTML=`<span class="spin"></span> 날씨 불러오는 중…`;
      try{
        const c=w.config;
        const base=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
          +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day`
          +`&hourly=temperature_2m,precipitation_probability,weather_code`
          +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
          +`&wind_speed_unit=ms&timezone=auto&forecast_days=4`;
        const inKR = c.lat>=33 && c.lat<=38.8 && c.lon>=124.5 && c.lon<=132.2;
        const tries = inKR ? [base+"&models=kma_seamless", base] : [base];
        let data=null, usedKma=false;
        for(let i=0;i<tries.length;i++){ try{ const j=JSON.parse(await httpGet(tries[i])); if(j&&j.current&&j.current.temperature_2m!=null&&j.daily&&j.daily.temperature_2m_max&&j.daily.temperature_2m_max[0]!=null){ data=j; usedKma=(inKR&&i===0); break; } }catch(e){} }
        if(!data) throw new Error("no data");
        const cur=data.current, dy=data.daily; const wc=wcode(cur.weather_code, cur.is_day);
        const days=["일","월","화","수","목","금","토"]; let fc="";
        for(let i=1;i<Math.min(4,dy.time.length);i++){const dd=new Date(dy.time[i]+"T00:00"); const wi=wcode(dy.weather_code[i]);
          const pp=dy.precipitation_probability_max?dy.precipitation_probability_max[i]:null;
          fc+=`<div class="d"><div class="dn">${days[dd.getDay()]}</div><div class="de">${wi.e}</div><div class="dt">${Math.round(dy.temperature_2m_max[i])}°<span class="lo"> / ${Math.round(dy.temperature_2m_min[i])}°</span></div>${(pp!=null&&pp>0)?`<div class="dp">☔ ${pp}%</div>`:""}</div>`;}
        const tmax=dy.temperature_2m_max?Math.round(dy.temperature_2m_max[0]):null, tmin=dy.temperature_2m_min?Math.round(dy.temperature_2m_min[0]):null;
        const rain=dy.precipitation_probability_max?dy.precipitation_probability_max[0]:null;
        let hr="";
        const hy=data.hourly;
        if(hy&&hy.time&&hy.time.length){
          const nowH=(cur.time||"").slice(0,13);
          let s=hy.time.findIndex(t=>t.slice(0,13)>=nowH); if(s<0) s=0;
          for(let i=s;i<Math.min(s+12,hy.time.length);i++){
            const t=hy.time[i], hh=+t.slice(11,13); const wi=wcode(hy.weather_code?hy.weather_code[i]:0, (hh>=6&&hh<19)?1:0);
            const pp=hy.precipitation_probability?hy.precipitation_probability[i]:null;
            hr+=`<div class="h"${i===s?' data-hnow="1"':''}><div class="hh">${i===s?"지금":hh+"시"}</div><div class="he">${wi.e}</div><div class="ht">${Math.round(hy.temperature_2m[i])}°</div><div class="hp${(pp!=null&&pp>=30)?' wet':''}">${pp!=null?pp+"%":"-"}</div></div>`;
          }
        }
        main.innerHTML=`<div class="now"><div class="emoji">${wc.e}</div><div><div class="temp">${Math.round(cur.temperature_2m)}<small>°C</small></div><div class="desc wxloc" title="지역 변경">📍 ${c.name} · ${wc.k}</div></div></div>
          <div class="meta"><span>체감 <b>${Math.round(cur.apparent_temperature)}°</b></span>${(tmax!=null)?`<span>최고·최저 <b>${tmax}° / ${tmin}°</b></span>`:""}<span>습도 <b>${cur.relative_humidity_2m}%</b></span><span>바람 <b>${cur.wind_speed_10m.toFixed(1)}㎧</b></span>${(rain!=null)?`<span>강수확률 <b>${rain}%</b></span>`:""}</div><div class="air" data-air></div>${hr?`<div class="hrs">${hr}</div>`:""}<div class="fc">${fc}</div><div class="wsrc">${usedKma?"기상청(KMA) 모델 · 1.5km":"글로벌 모델"} · ${new Date().getHours()}시 ${pad(new Date().getMinutes())}분 기준</div>`;
        const lc=$(".wxloc",main); if(lc) lc.onclick=()=>this.openSettings(b,w);
        this.loadAir(main,c);
      }catch(e){ main.innerHTML=`<div class="empty">날씨를 불러오지 못했어요. 설정(⚙)에서 도시를 다시 선택해 보세요.</div>`; }
    },
    async loadAir(main,c){ const box=$("[data-air]",main); if(!box)return;
      try{
        const d=JSON.parse(await httpGet(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&current=pm10,pm2_5&timezone=auto`));
        const cur=d.current; if(!cur){ box.style.display="none"; return; }
        const pm10=Math.round(cur.pm10), pm25=Math.round(cur.pm2_5);
        const g10=this.airGrade(pm10,[30,80,150]), g25=this.airGrade(pm25,[15,35,75]);
        box.innerHTML=`<span class="ai"><i class="dotg ${g10.c}"></i>미세먼지 <b>${g10.t}</b> <em>${pm10}</em></span><span class="ai"><i class="dotg ${g25.c}"></i>초미세 <b>${g25.t}</b> <em>${pm25}</em></span>`;
      }catch(e){ box.style.display="none"; } },
    airGrade(v,[a,b,c]){ if(v<=a)return {t:"좋음",c:"g1"}; if(v<=b)return {t:"보통",c:"g2"}; if(v<=c)return {t:"나쁨",c:"g3"}; return {t:"매우나쁨",c:"g4"}; } },

  todo:{ title:"할 일", icon:"✓", desc:"날짜별 할 일. 목록·달력 모드.",
    defaultCfg:()=>({items:[],tab:"list",sel:null,moff:0}),
    mount(b,w){ b.classList.add("todo"); if(!w.config.tab) w.config.tab="list";
      b.innerHTML=`<div class="ttabs" data-tabs><button data-t="list">목록</button><button data-t="cal">달력</button></div><div class="tbody" data-body></div>`;
      [...b.querySelectorAll("[data-t]")].forEach(btn=>{ btn.className=(w.config.tab===btn.dataset.t?"on":""); btn.onclick=()=>{ w.config.tab=btn.dataset.t; persist(); this.mount(b,w); }; });
      if(w.config.tab==="cal") this.drawCal(b,w); else this.drawList(b,w); },
    addRow(b,w,fixedDate){ const wrap=el("div","row t-add");
      wrap.innerHTML=`<input type="date" data-d style="flex:1"><input placeholder="할 일 입력 후 Enter" data-in style="flex:1.6">`;
      const di=$("[data-d]",wrap), inp=$("[data-in]",wrap);
      di.value = fixedDate || isoOf(ymd(new Date()));
      const add=()=>{ const t=inp.value.trim(); if(!t) return; if(!di.value){ toast("날짜를 선택하세요"); di.focus(); return; }
        w.config.items.push({id:uid(),text:t,done:false,date:di.value.replace(/-/g,"")}); inp.value=""; persist(); if(w.config.tab==="cal") this.drawCal(b,w); else this.drawList(b,w); };
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
      return wrap; },
    make(b,w,it,drag,showDate){ const row=el("div","ti"+(it.done?" done":"")); row.innerHTML=`<div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#241c05" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="tw"><div class="tx"></div></div><div class="x">✕</div>`;
      if(drag) row.dataset.rid=it.id;
      const tx=$(".tx",row); tx.textContent=it.text; tx.title="클릭: 완료 / 더블클릭: 수정";
      if(showDate&&it.date){ const dt=el("div","tdate"); const dow=["일","월","화","수","목","금","토"][new Date(+it.date.slice(0,4),+it.date.slice(4,6)-1,+it.date.slice(6,8)).getDay()]; dt.textContent=`${+it.date.slice(4,6)}/${+it.date.slice(6,8)}(${dow})`; dt.title="클릭하면 날짜 변경";
        dt.onpointerdown=e=>e.stopPropagation();
        dt.onclick=e=>{ e.stopPropagation(); const cur=new Date(+it.date.slice(0,4),+it.date.slice(4,6)-1,+it.date.slice(6,8));
          openCalendar(dt, cur, picked=>{ it.date=ymd(picked); persist(); if(w.config.tab==="cal") this.drawCal(b,w); else this.drawList(b,w); toast("날짜 변경됨"); }); };
        $(".tw",row).insertBefore(dt, $(".tx",row)); }
      const redraw=()=>{ if(w.config.tab==="cal") this.drawCal(b,w); else this.drawList(b,w); };
      const toggle=()=>{ const a=w.config.items, i=a.indexOf(it); if(i<0) return;
        if(!it.done){ let prev=null; for(let k=i-1;k>=0;k--){ if(!a[k].done){ prev=a[k].id; break; } } it._prevId=prev; it.done=true; w.config.showDone=false; a.splice(i,1); a.push(it); }
        else { it.done=false; a.splice(i,1); let at; if(it._prevId){ const pi=a.findIndex(x=>x.id===it._prevId && !x.done); at = pi>=0 ? pi+1 : a.findIndex(x=>x.done); } else { at=0; } if(at<0) at=a.length; a.splice(at,0,it); it._prevId=null; }
        persist(); redraw(); };
      const startEdit=()=>{ const ed=el("input"); ed.className="tedit"; ed.value=it.text; ed.style.width="100%"; ed.style.fontWeight="400"; ed.onpointerdown=e=>e.stopPropagation(); tx.replaceWith(ed); ed.focus(); ed.select(); let fin=false; const done2=(save)=>{ if(fin)return; fin=true; if(save){ const v=ed.value.trim(); if(v) it.text=v; } persist(); redraw(); }; ed.addEventListener("keydown",e=>{ if(e.key==="Enter"){done2(true);} else if(e.key==="Escape"){done2(false);} }); ed.addEventListener("blur",()=>done2(true)); };

    modes:{"국어":{ph:"우리말 단어 (예: 나무)",kr:true,inLang:"ko-KR"},"영영":{ph:"영어 단어 (예: apple)",en:true,inLang:"en-US"},"영한":{ph:"영어 단어 → 한국어",pair:"en|ko",en:true,inLang:"en-US",outLang:"ko-KR"},"한영":{ph:"한국어 단어 → 영어",pair:"ko|en",inLang:"ko-KR",outLang:"en-US"},"일한":{ph:"일본어 단어 → 한국어",pair:"ja|ko",inLang:"ja-JP",outLang:"ko-KR",jaIn:true},"한일":{ph:"한국어 단어 → 일본어",pair:"ko|ja",inLang:"ko-KR",outLang:"ja-JP"}},
    spk(text,lang){ const bt=el("button","spk","🔊"); bt.title="듣기"; bt.onclick=(e)=>{ e.stopPropagation(); speak(text,lang); }; return bt; },
    openSettings(b,w){ const old=$(".dset",b); if(old){ old.remove(); return; }
      const box=el("div","dset");
      box.innerHTML=`<div class="setrow"><span>국어사전 키</span><input data-kk placeholder="표준국어대사전 인증키" value="${w.config.krKey||''}"></div>
        <div class="setrow"><span>영영 키</span><input data-mk placeholder="Merriam-Webster 키 (선택)" value="${w.config.mwKey||''}"></div>
        <div class="row"><button class="mini go" data-save>저장</button></div>
        <div class="setnote">국어사전 키는 stdict.korean.go.kr 또는 공공데이터포털에서 무료로 발급받습니다. 영영 키를 넣으면 발음·뜻이 더 자세히 나오고, 없으면 무료 사전으로 동작합니다.</div>`;
      b.insertBefore(box,b.firstChild);

    mount(b,w){ b.classList.add("dict"); if(!this.modes[w.config.mode]) w.config.mode="국어";

      const q=$("[data-q]",b), body=$("[data-body]",b), mwrap=$("[data-modes]",b);

      const renderModes=()=>{ mwrap.innerHTML=""; Object.keys(this.modes).forEach(k=>{ const c=el("button","dmode"+(w.config.mode===k?" on":""),k); c.onclick=()=>{ w.config.mode=k; persist(); renderModes(); setPh(); body.innerHTML=""; q.focus(); }; mwrap.appendChild(c); }); setPh(); };
      const find=async()=>{ const word=q.value.trim(); if(!word)return; const md=this.modes[w.config.mode]; body.innerHTML=`<div class="empty"><span class="spin"></span> 찾는 중…</div>`;
        try{
          if(md.kr){
            if(!w.config.krKey){ body.innerHTML=`<div class="empty">설정(⚙)에서 국어사전 인증키를 넣어 주세요. stdict.korean.go.kr에서 무료로 발급받을 수 있어요.</div>`; return; }
            const d=JSON.parse(await httpGet(`https://stdict.korean.go.kr/api/search.do?key=${encodeURIComponent(w.config.krKey)}&q=${encodeURIComponent(word)}&req_type=json&num=10`));
            let items=(d.channel&&d.channel.item)||[]; if(!Array.isArray(items)) items=[items];
            if(!items.length){ body.innerHTML=`<div class="empty">‘${escapeHtml(word)}’을(를) 찾지 못했어요.</div>`; return; }
            body.innerHTML=`<div class="d-word"><span class="dw-t"></span></div>`; $(".dw-t",body).textContent=items[0].word||word; $(".d-word",body).appendChild(this.spk(items[0].word||word,"ko-KR"));
            items.slice(0,5).forEach(it=>{ let sn=it.sense; if(Array.isArray(sn)) sn=sn[0]; if(!sn)return;
              const blk=el("div","d-mean"); blk.innerHTML=`<span class="d-pos">${escapeHtml(it.pos||"")}</span><div class="d-def"></div>`; $(".d-def",blk).textContent=sn.definition||"";
              if(sn.link){ const a=el("div","d-more","자세히 보기"); a.onclick=()=>openLink(sn.link); blk.appendChild(a); }
              body.appendChild(blk); });
            body.appendChild(el("div","d-src","출처: 국립국어원 표준국어대사전"));
          } else if(w.config.mode==="영영"){
            if(w.config.mwKey){
              const arr=JSON.parse(await httpGet(`https://www.dictionaryapi.com/api/v3/references/collegiate/json/${encodeURIComponent(word.toLowerCase())}?key=${encodeURIComponent(w.config.mwKey)}`));
              if(Array.isArray(arr)&&arr.length&&typeof arr[0]==="object"){
                const e=arr[0]; const ph=(e.hwi&&e.hwi.prs&&e.hwi.prs[0]&&e.hwi.prs[0].mw)||"";
                body.innerHTML=`<div class="d-word"><span class="dw-t"></span> <span class="d-ph"></span></div>`; $(".dw-t",body).textContent=word; $(".d-ph",body).textContent=ph?`[${ph}]`:""; $(".d-word",body).appendChild(this.spk(word,"en-US"));
                arr.slice(0,3).forEach(en=>{ if(typeof en!=="object"||!en.shortdef||!en.shortdef.length)return; const blk=el("div","d-mean"); blk.innerHTML=`<span class="d-pos">${escapeHtml(en.fl||"")}</span><div class="d-def"></div>`; $(".d-def",blk).textContent=en.shortdef[0]; body.appendChild(blk); });
                body.appendChild(el("div","d-src","출처: Merriam-Webster")); return;
              }
            }
            const arr=JSON.parse(await httpGet(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`));
            if(!Array.isArray(arr)||!arr[0]||!arr[0].meanings){ body.innerHTML=`<div class="empty">‘${escapeHtml(word)}’ 뜻을 찾지 못했어요. 철자를 확인해 보세요.</div>`; return; }
            const e=arr[0]; const ph=e.phonetic||((e.phonetics||[]).find(pp=>pp.text)||{}).text||"";
            body.innerHTML=`<div class="d-word"><span class="dw-t"></span> <span class="d-ph"></span></div>`; $(".dw-t",body).textContent=e.word; $(".d-ph",body).textContent=ph; $(".d-word",body).appendChild(this.spk(e.word,"en-US"));
            e.meanings.slice(0,3).forEach(m=>{ const def=(m.definitions||[])[0]; if(!def)return; const blk=el("div","d-mean"); blk.innerHTML=`<span class="d-pos">${escapeHtml(m.partOfSpeech||"")}</span><div class="d-def"></div>`; $(".d-def",blk).textContent=def.definition||""; if(def.example){ const ex=el("div","d-ex"); ex.textContent=`“${def.example}”`; blk.appendChild(ex); } body.appendChild(blk); });
          } else {
            const d=JSON.parse(await httpGet(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${encodeURIComponent(md.pair)}`));
            const main=d.responseData&&d.responseData.translatedText;
            if(!main){ body.innerHTML=`<div class="empty">뜻을 찾지 못했어요. (학교망에서 막혀 있을 수 있어요)</div>`; return; }
            body.innerHTML=`<div class="d-word"><span class="dw-t"></span></div><div class="tr-main"><span class="tm-t"></span></div>`;
            $(".dw-t",body).textContent=word; $(".d-word",body).appendChild(this.spk(word,md.inLang));
            const addReading=(afterEl,ja)=>{ const rd=el("div","tr-read"); rd.textContent="읽기 …"; afterEl.insertAdjacentElement("afterend",rd); jaReading(ja).then(h=>{ if(h){ rd.textContent="읽기: "+h; } else { rd.style.display="none"; } }); };
            if(md.jaIn){ addReading($(".d-word",body), word); }
            $(".tm-t",body).textContent=main; $(".tr-main",body).appendChild(this.spk(main,md.outLang));
            if(w.config.mode==="한일"){ addReading($(".tr-main",body), main); }
            const alts=[]; (d.matches||[]).forEach(m=>{ const t=(m.translation||"").trim(); if(t && t.toLowerCase()!==main.toLowerCase() && !alts.includes(t) && alts.length<4) alts.push(t); });
            if(alts.length){ const box=el("div","tr-alts"); box.innerHTML=`<div class="tr-lbl">다른 뜻</div>`; alts.forEach(t=>{ const it=el("div","tr-alt"); it.textContent=t; box.appendChild(it); }); body.appendChild(box); }
          }
        }catch(err){ body.innerHTML=`<div class="empty">사전을 불러오지 못했어요. (키가 맞는지, 인터넷이 되는지 확인해 주세요)</div>`; } };
      $("[data-find]",b).onclick=find;
      attachAutocomplete(q,{ min:1, source:(qv)=>{ if(!this.modes[w.config.mode].en) return []; const ql=qv.toLowerCase(); return COMMON_WORDS.filter(x=>x.startsWith(ql)).slice(0,8).map(x=>({label:x,value:x})); }, onPick:(word)=>{ q.value=word; find(); }, onEnter:find });
      renderModes(); } },

  encyc:{ title:"백과사전", icon:"📚", desc:"위키백과에서 항목을 찾아 요약을 봅니다.",
    defaultCfg:()=>({}),
    mount(b,w){ b.classList.add("encyc");
      b.innerHTML=`<div class="row"><input placeholder="찾을 항목 (예: 광합성, 세종대왕)" data-q><button class="mini go" data-find>검색</button></div><div class="ency-body" data-body></div>`;
      const q=$("[data-q]",b), body=$("[data-body]",b);
      const show=async(title)=>{ body.innerHTML=`<div class="empty"><span class="spin"></span> 불러오는 중…</div>`;
        try{ const d=JSON.parse(await httpGet(`https://ko.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages&exintro=1&explaintext=1&redirects=1&pithumbsize=180&format=json&origin=*&titles=${encodeURIComponent(title)}`));
          const pages=d.query&&d.query.pages; const pg=pages&&pages[Object.keys(pages)[0]];
          if(!pg||pg.missing!==undefined||!pg.extract){ body.innerHTML=`<div class="empty">내용을 찾지 못했어요.</div>`; return; }
          let txt=(pg.extract||"").trim(); if(txt.length>700) txt=txt.slice(0,700)+"…";
          const url=`https://ko.wikipedia.org/wiki/${encodeURIComponent(pg.title)}`;
          body.innerHTML=`<div class="e-head">${pg.thumbnail?`<img class="e-img" src="${pg.thumbnail.source}" alt="">`:""}<div class="e-title"></div></div><div class="e-text"></div><div class="e-foot"><span class="e-src">출처: 위키백과 (CC BY-SA)</span><button class="mini" data-more>원문 보기</button></div>`;

          $("[data-more]",body).onclick=()=>openLink(url);

      const find=async()=>{ const s=q.value.trim(); if(!s)return; body.innerHTML=`<div class="empty"><span class="spin"></span> 찾는 중…</div>`;
        try{ const d=JSON.parse(await httpGet(`https://ko.wikipedia.org/w/api.php?action=query&list=search&srlimit=8&format=json&origin=*&srsearch=${encodeURIComponent(s)}`));

        }catch(e){ body.innerHTML=`<div class="empty">검색하지 못했어요. (그 PC/망에서 위키백과가 막혀 있을 수 있어요)</div>`; } };
      $("[data-find]",b).onclick=find;
      attachAutocomplete(q,{ min:2, delay:220, source:async(qv)=>{ try{ const d=JSON.parse(await httpGet(`https://ko.wikipedia.org/w/api.php?action=opensearch&limit=8&format=json&origin=*&search=${encodeURIComponent(qv)}`)); return (d[1]||[]).map(t=>({label:t,value:t})); }catch(e){ return []; } }, onPick:(t)=>{ q.value=t; show(t); }, onEnter:find }); } },

  history:{ title:"오늘의 역사", icon:"📜", desc:"그날 있었던 역사적 사건.",
    defaultCfg:()=>({off:0}),
    mount(b,w){ b.classList.add("hist"); b.innerHTML=`<div class="ndate" data-nav></div><div class="hist-body" data-body></div>`; this.load(b,w); },
    async load(b,w){ const d=new Date(); d.setDate(d.getDate()+(w.config.off||0)); const mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
      $("[data-nav]",b).innerHTML=`<button data-prev>‹</button><span>${d.getMonth()+1}월 ${d.getDate()}일</span><button data-next>›</button>`;
      $("[data-prev]",b).onclick=()=>{w.config.off=(w.config.off||0)-1; persist(); this.load(b,w);}; $("[data-next]",b).onclick=()=>{w.config.off=(w.config.off||0)+1; persist(); this.load(b,w);};
      const out=$("[data-body]",b); out.innerHTML=`<div class="empty"><span class="spin"></span> 불러오는 중…</div>`;
      const koUrls=[`https://api.wikimedia.org/feed/v1/wikipedia/ko/onthisday/events/${mm}/${dd}`,`https://ko.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`];
      let evs=null, isEn=false;
      for(const u of koUrls){ try{ const j=JSON.parse(await httpGet(u)); if(j&&Array.isArray(j.events)&&j.events.length){ evs=j.events.map(e=>({year:e.year,text:e.text,page:(e.pages&&e.pages[0]&&e.pages[0].content_urls&&e.pages[0].content_urls.desktop&&e.pages[0].content_urls.desktop.page)||""})); break; } }catch(e){} }
      if(!evs){ try{ const j=JSON.parse(await httpGet(`https://byabbe.se/on-this-day/${d.getMonth()+1}/${d.getDate()}/events.json`)); if(j&&Array.isArray(j.events)&&j.events.length){ isEn=true; evs=j.events.map(e=>({year:e.year,text:e.description,page:(e.wikipedia&&e.wikipedia[0]&&e.wikipedia[0].wikipedia)||""})); } }catch(e){} }
      if(!evs||!evs.length){ out.innerHTML=`<div class="empty">불러오지 못했어요. app.py도 새로 빌드했는지 확인해 주세요. (또는 그 PC/망에서 위키백과가 막혀 있을 수 있어요)</div>`; return; }
      evs=evs.sort((a,c)=>(Number(c.year)||0)-(Number(a.year)||0)).slice(0,15);
      out.innerHTML=""; let note=null; if(isEn){ note=el("div","hist-note","영어 원문을 한글로 자동 번역 중… (원문: 위키백과)"); out.appendChild(note); }
      const refs=[]; evs.forEach(ev=>{ const row=el("div","hrow"); const yr=el("div","hyr"); yr.textContent=ev.year!=null?String(ev.year):""; const tx=el("div","htx"); tx.textContent=ev.text||""; row.appendChild(yr); row.appendChild(tx);
        if(ev.page){ row.classList.add("hlink"); row.onclick=()=>openLink(ev.page); }
        out.appendChild(row); refs.push({tx,text:ev.text||""}); });
      if(isEn){ (async()=>{ let ok=0; for(const r of refs){ if(!document.body.contains(r.tx)) return; const ko=await translateText(r.text,"en","ko"); if(ko){ r.tx.textContent=ko; ok++; } } if(note) note.textContent = ok? "영어 원문을 한글로 자동 번역했습니다. (원문: 위키백과)" : "번역에 실패해 영어 원문으로 표시합니다. (원문: 위키백과)"; })(); } } },

      $(".c-name",out).textContent=c.ko; $(".c-en",out).textContent=c.en; $(".cv-cap",out).textContent=c.cap; $(".cv-reg",out).textContent=c.region; $(".cv-pop",out).textContent="약 "+c.pop.toLocaleString()+"명"; $(".cv-lang",out).textContent=c.lang; } },

  timetable:{ title:"시간표", icon:"📆", desc:"교사별·학반별 주간 시간표를 봅니다.", settings:true,
    defaultCfg:()=>({file:"",fileName:"",tab:"teacher",sel:""}),
    async take(b,w,file){ if(!file) return;
      if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){ toast("엑셀 파일만 올릴 수 있어요"); return; }
      if(!hasApi("save_upload")){ toast("설치형(exe)에서만 동작해요"); return; }
      toast("시간표 등록 중…");
      try{ const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(new Error("read")); r.readAsDataURL(file); });
        const r=await window.pywebview.api.save_upload("timetable",file.name,b64);
        if(r&&r.ok){ w.config.file=r.path; w.config.fileName=file.name; persist(); this.mount(b,w); } else toast("파일을 저장하지 못했어요");
      }catch(e){ toast("파일을 읽지 못했어요"); } },
    hookFile(b,w,scope){ const fi=$("[data-file]",scope); if(fi) fi.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) this.take(b,w,f); };
      const pk=$("[data-pick]",scope); if(pk) pk.onclick=async()=>{ if(!hasApi("pick_path")){ toast("설치형(exe)에서만 동작해요"); return; }
        try{ const r=await window.pywebview.api.pick_path("file"); if(r&&r.ok&&r.path){ w.config.file=r.path; w.config.fileName=r.path.split(/[\\/]/).pop(); persist(); this.mount(b,w); } }catch(e){ toast("파일을 열지 못했어요"); } }; },
    dropZone(b,w,zone){ if(!zone)return;
      ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); zone.classList.add("over"); }));
      ["dragleave","drop"].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); zone.classList.remove("over"); }));
      zone.addEventListener("drop",e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) this.take(b,w,f); }); },
    openSettings(b,w){ const old=$(".rset",b); if(old){ old.remove(); return; }
      const box=el("div","rset");
      box.innerHTML=`<div class="setrow"><span>파일</span><b class="rfile"></b></div>
        <div class="rup"><label class="mini up">📤 파일 올리기<input type="file" data-file accept=".xlsx,.xlsm,.xls"></label><button class="mini" data-pick>📂 찾아보기</button></div>
        <div class="setnote">엑셀을 위젯에 끌어다 놓아도 등록됩니다. 교사별·학반별 어느 양식이든 자동으로 인식해요.</div>`;
      b.insertBefore(box,b.firstChild);
      $(".rfile",box).textContent=w.config.fileName||(w.config.file? w.config.file.split(/[\\/]/).pop():"(선택 안 됨)");

  stocks:{ title:"시세", icon:"📈", desc:"주식·코인·환율·원자재 실시간 시세.",
    defaultCfg:()=>({items:[]}),
    mount(b,w){ b.classList.add("stk");
      b.innerHTML=`<div class="row"><input placeholder="예: 삼성전자, AAPL, 비트코인, 달러, WTI, 금" data-q><button class="mini go" data-find>추가</button></div><div class="sresult" data-res></div><div class="stk-list" data-list></div>`;
      const q=$("[data-q]",b), res=$("[data-res]",b);
      const addItem=(o)=>{ if(!w.config.items.some(i=>i.code===o.code&&i.src===o.src)){ w.config.items.push(Object.assign({id:uid()},o)); persist(); } q.value=""; res.innerHTML=""; this.draw(b,w); toast(`${o.name} 추가`); };
      const find=async()=>{ const raw=q.value.trim(); if(!raw)return; res.innerHTML=`<div class="empty"><span class="spin"></span> 찾는 중…</div>`;
        try{
          const low=raw.toLowerCase().replace(/\s/g,"");
          if(/^\d{6}$/.test(raw)){ const nm=await this.krName(raw)||raw; addItem({src:"kr",code:"A"+raw,name:nm}); return; }
          const pre=PRESETS.find(p=>p.a.includes(low)); if(pre){ addItem({src:pre.src,code:pre.code,name:pre.name}); return; }
          const dc=KR_STOCKS[raw]||KR_STOCKS[raw.replace(/\s/g,"")]||KR_STOCKS[low]||KR_STOCKS[raw.toUpperCase()];
          if(dc){ addItem({src:"kr",code:"A"+dc,name:raw}); return; }
          const coins=await this.coinSearch(raw);
          if(coins&&coins.length){
            const exact=coins.find(c=>c.name===raw||c.code.split("-")[1]===raw.toUpperCase());
            if(exact){ addItem({src:"coin",code:exact.code,name:exact.name}); return; }
            res.innerHTML=""; coins.forEach(c=>{ const e=el("div","si",`<div class="sn">${c.name}</div><div class="sr">코인 · ${c.code.split("-")[1]}</div>`); e.onclick=()=>addItem({src:"coin",code:c.code,name:c.name}); res.appendChild(e); }); return;
          }
          if(/^[\^A-Za-z][A-Za-z0-9.\-=]*$/.test(raw)){ addItem({src:"yahoo",code:raw.toUpperCase(),name:raw.toUpperCase()}); return; }
          res.innerHTML=`<div class="empty">못 찾았어요. 예) 삼성전자·005930, AAPL, 비트코인·BTC, 달러, WTI, 금</div>`;
        }catch(e){ res.innerHTML=`<div class="empty">검색 실패. 인터넷 연결을 확인하세요.</div>`; } };
      $("[data-find]",b).onclick=find;
      attachAutocomplete(q,{ min:1, delay:200, source:async(qv)=>{ const ql=qv.toLowerCase().replace(/\s/g,""); const out=[]; const seen={};
          const push=(o,score)=>{ const k=o.value.src+o.value.code; if(seen[k])return; seen[k]=1; o._s=score; out.push(o); };
          for(const nm in KR_STOCKS){ const code=KR_STOCKS[nm]; const key=nm.toLowerCase(); const idx=key.indexOf(ql); if(idx>=0){ push({label:nm, sub:"국내주식 "+code, value:{src:"kr",code:"A"+code,name:nm}}, idx===0?0:1); } }
          PRESETS.forEach(p=>{ const hit=p.a.some(a=>a.includes(ql)) || p.name.toLowerCase().includes(ql); if(hit){ const st=p.a.some(a=>a.startsWith(ql))?0:1; push({label:p.name, sub:(p.src==="coin"?"코인":"환율·원자재·지수"), value:{src:p.src,code:p.code,name:p.name}}, st); } });
          try{ const ms=await coinMarkets(); ms.forEach(m=>{ const sym=m.market.split("-")[1].toLowerCase(); const kn=(m.korean_name||""); if(kn.includes(qv)||sym.startsWith(ql)){ push({label:kn||m.market, sub:"코인 "+m.market.split("-")[1], value:{src:"coin",code:m.market,name:kn||m.market}}, (kn.startsWith(qv)||sym.startsWith(ql))?0:1); } }); }catch(e){}
          return out.sort((a,c)=>a._s-c._s).slice(0,8); },
        onPick:(v)=>addItem(v), onEnter:find });

      this.draw(b,w); },
    refresh(b,w){ const list=$("[data-list]",b); if(!list||!document.body.contains(b)){ if(w._timer){clearInterval(w._timer); w._timer=null;} return; } const rows=[...list.querySelectorAll("[data-rid]")]; rows.forEach((row,idx)=>{ const it=w.config.items.find(x=>x.id===row.dataset.rid); if(it) setTimeout(()=>this.loadQuote(row,it), idx*180); }); },
    async krName(code6){ try{ const j=JSON.parse(await httpGet(`https://polling.finance.naver.com/api/realtime/domestic/stock/${code6}`)); const d=j.datas&&j.datas[0]; return d&&d.stockName||null; }catch(e){ return null; } },
    async coinSearch(query){ try{ const ms=await coinMarkets(); const q=query.trim(), ql=q.toLowerCase();
        return ms.filter(m=>{ const sym=m.market.split("-")[1].toLowerCase(); const kn=m.korean_name||"", en=(m.english_name||"").toLowerCase(); return kn===q||kn.includes(q)||sym===ql||en===ql||en.includes(ql); }).slice(0,8).map(m=>({code:m.market,name:m.korean_name||m.market.split("-")[1]})); }catch(e){ return []; } },
    draw(b,w){ const list=$("[data-list]",b); if(!list)return; if(!w.config.items.length){ list.innerHTML=`<div class="empty">관심 종목·코인을 추가해 보세요. (국내주식: 종목명·6자리 코드 / 해외주식: 티커 / 코인: 비트코인·BTC)</div>`; return; }
      list.innerHTML=""; w.config.items.forEach((it,idx)=>{ const row=el("div","sq"); row.dataset.rid=it.id;
        row.innerHTML=`<div class="sq-l"><div class="sq-n"></div><div class="sq-s">${it.code}</div></div><div class="sq-r"><span class="spin"></span></div><div class="sq-x">✕</div>`;
        $(".sq-n",row).textContent=it.name;
        $(".sq-x",row).onclick=(e)=>{ e.stopPropagation(); w.config.items=w.config.items.filter(x=>x.id!==it.id); persist(); this.draw(b,w); };
        row.onclick=()=>{ if(_cvtOpen.has(it.id)) _cvtOpen.delete(it.id); else _cvtOpen.add(it.id); this.loadQuote(row,it); };
        list.appendChild(row); setTimeout(()=>this.loadQuote(row,it), idx*180); });
      enableListDnD(list, w.config.items, persist); },
    async loadQuote(row,it){ const r=$(".sq-r",row); if(!r)return; const num=v=>typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(/,/g,""))||0;
      const krw=v=>Math.abs(v)>=100?Math.round(v).toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:2});
      const finish=(price,ccy,html)=>{ _lastQuote[it.id]=html; r.innerHTML=html; if(_cvtOpen.has(it.id)) this.appendConv(r,price,ccy); };
      try{
        if(it.src==="coin"){
          let d=null; try{ const j=JSON.parse(await httpGet(`https://api.upbit.com/v1/ticker?markets=${it.code}`)); d=Array.isArray(j)?j[0]:null; }catch(_){}
          if(d&&d.trade_price!=null){
            const price=num(d.trade_price), change=num(d.signed_change_price), rate=num(d.signed_change_rate)*100;
            const up=(d.change?d.change==="RISE":change>=0);
            return finish(price,"KRW",`<div class="sq-p">₩${krw(price)}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${krw(Math.abs(change))} (${Math.abs(rate).toFixed(2)}%)</div>`);
          }
          const meta=await yahooChart(String(it.code).split("-")[1]+"-KRW");
          if(!meta){ if(_lastQuote[it.id]){ r.innerHTML=_lastQuote[it.id]; } else { r.innerHTML=`<span class="sq-na">불러오기 실패</span>`; } return; }
          const price=meta.regularMarketPrice, base=meta.chartPreviousClose||meta.previousClose||price, diff=price-base, pct=base?diff/base*100:0, up=diff>=0;
          return finish(price,"KRW",`<div class="sq-p">₩${krw(price)}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${krw(Math.abs(diff))} (${Math.abs(pct).toFixed(2)}%)</div>`);

async function setFavicon(img, fb, url, host){
  if(!host){ fb.style.display="grid"; return; }
  if(_favCache[host]){ applyFav(img, fb, _favCache[host], host); return; }
  if(typeof hasApi==="function" && hasApi("get_favicon")){
    try{ const r=await window.pywebview.api.get_favicon(url); if(r&&r.ok&&r.dataUrl){ _favCache[host]=r.dataUrl; applyFav(img, fb, r.dataUrl, host); return; } }catch(e){}
  }
  fallbackChain(img, fb, host, 0);
}
function fallbackChain(img, fb, host, i){
  const srcs=[`https://icons.duckduckgo.com/ip3/${host}.ico`, `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`];
  if(i>=srcs.length){ img.style.display="none"; fb.style.display="grid"; return; }
  img.onload=()=>{ fb.style.display="none"; img.style.display="block"; };
  img.onerror=()=>{ fallbackChain(img, fb, host, i+1); };
  img.src=srcs[i];
}

    if(!/[a-z]/.test(ch)){ out+=(ch===" "?" ":""); i++; continue; }
    if("kstpgdbjcz".includes(ch)&&rom[i+1]===ch){ out=addTail(out,19); i++; continue; }
    if(ch==="n"&&!/[aeiouy]/.test(rom[i+1]||"")){ out=addTail(out,4); i++; continue; }
    let m=false; for(let len=3;len>=1;len--){ const seg=rom.substr(i,len); if(RO_MAP[seg]){ out+=RO_MAP[seg]; i+=len; m=true; break; } } if(!m) i++;
  } return out.trim(); }

function inlineRename(elm, get, set, done){
  elm.style.cursor="text"; elm.title="더블클릭하면 이름 수정";
  elm.addEventListener("pointerdown",e=>e.stopPropagation());
  elm.addEventListener("click",e=>{ e.stopPropagation(); e.preventDefault(); });
  elm.addEventListener("dblclick",e=>{ e.stopPropagation(); e.preventDefault();
    const inp=document.createElement("input"); inp.className="nm-edit"; inp.value=get();
    inp.onpointerdown=ev=>ev.stopPropagation(); inp.onclick=ev=>ev.stopPropagation();
    elm.replaceWith(inp); inp.focus(); inp.select();
    let fin=false; const commit=(save)=>{ if(fin)return; fin=true; if(save){ const v=inp.value.trim(); if(v) set(v); } done(); };
    inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter")commit(true); else if(ev.key==="Escape")commit(false); });
    inp.addEventListener("blur",()=>commit(true));
  });
}

function attachAutocomplete(input, opts){
  if(input._acPop){ try{input._acPop.remove();}catch(e){} }
  const pop=el("div","ac-pop"); document.body.appendChild(pop); pop.style.display="none"; input._acPop=pop;
  let items=[], active=-1, timer=null, seq=0;
  const close=()=>{ pop.style.display="none"; active=-1; };
  const place=()=>{ const r=input.getBoundingClientRect(); pop.style.left=r.left+"px"; pop.style.top=(r.bottom+4)+"px"; pop.style.minWidth=r.width+"px"; };
  const render=()=>{ if(!items.length){ close(); return; } pop.innerHTML=""; items.forEach((it,i)=>{ const r2=el("div","ac-item"+(i===active?" on":"")); const l=el("span","ac-l"); l.textContent=it.label; r2.appendChild(l); if(it.sub){ const s=el("span","ac-s"); s.textContent=it.sub; r2.appendChild(s); } r2.onmousedown=(e)=>{ e.preventDefault(); pick(it); }; pop.appendChild(r2); }); place(); pop.style.display="block"; };
  const pick=(it)=>{ close(); opts.onPick(it.value,it); };
  const run=async()=>{ const qv=input.value.trim(); if(qv.length<(opts.min||1)){ items=[]; close(); return; } const my=++seq; let r=[]; try{ r=await opts.source(qv); }catch(e){ r=[]; } if(my!==seq)return; items=(r||[]).slice(0,8); active=-1; render(); };
  input.addEventListener("input",()=>{ clearTimeout(timer); timer=setTimeout(run,opts.delay||170); });
  input.addEventListener("keydown",(e)=>{ const open=pop.style.display!=="none";
    if(e.key==="ArrowDown"&&open){ e.preventDefault(); active=Math.min(active+1,items.length-1); render(); }
    else if(e.key==="ArrowUp"&&open){ e.preventDefault(); active=Math.max(active-1,0); render(); }
    else if(e.key==="Enter"){ if(open&&active>=0&&items[active]){ e.preventDefault(); pick(items[active]); } else { close(); if(opts.onEnter) opts.onEnter(); } }
    else if(e.key==="Escape"){ close(); } });
  input.addEventListener("blur",()=>{ setTimeout(close,120); });
  return {close};
}

        const sibs=[...list.querySelectorAll("[data-rid]")];

        for(const s of sibs){ const bx=s.getBoundingClientRect(); const cx=bx.left+bx.width/2, cy=bx.top+bx.height/2; const d=Math.hypot(ev.clientX-cx, ev.clientY-cy);
          if(d<bd){ bd=d; best=s; before=(ev.clientY<cy-bx.height*0.2)?true:(ev.clientY>cy+bx.height*0.2?false:(ev.clientX<cx)); } }
        if(best){ list.insertBefore(ph, before?best:best.nextSibling); } else { list.appendChild(ph); }
      };
      const up=()=>{
        document.removeEventListener("pointermove",move,true); document.removeEventListener("pointerup",up,true);
        if(dragging){
          row.classList.remove("lift");
          row.style.position=""; row.style.left=""; row.style.top=""; row.style.width=""; row.style.height=""; row.style.margin=""; row.style.zIndex=""; row.style.pointerEvents="";
          if(ph){ list.insertBefore(row, ph); ph.remove(); }
          const order=[...list.querySelectorAll("[data-rid]")].map(r=>r.dataset.rid);
          arr.sort((a,b)=>{ const ia=order.indexOf(String(a.id)), ib=order.indexOf(String(b.id)); if(ia<0&&ib<0)return 0; if(ia<0)return 1; if(ib<0)return -1; return ia-ib; });
          const swallow=ev2=>{ ev2.stopPropagation(); ev2.preventDefault(); row.removeEventListener("click",swallow,true); };
          row.addEventListener("click",swallow,true); setTimeout(()=>row.removeEventListener("click",swallow,true),350);
          if(onDone) onDone();
        }
      };
      document.addEventListener("pointermove",move,true); document.addEventListener("pointerup",up,true);
    });
  });
}

/* 항목 끌어서 순서 바꾸기 (목록형 위젯 공용) */
function enableReorder(list, arr, onDone){
  if(!list) return;
  list.querySelectorAll(".drag-h").forEach(h=>{
    const row=h.closest("[data-rid]"); if(!row) return;
    h.addEventListener("click", ev=>ev.stopPropagation());
    h.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation(); row.classList.add("dragging");
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      const move=ev=>{
        const rows=[...list.querySelectorAll("[data-rid]:not(.dragging)")];
        let best=null, bd=Infinity, before=true;
        rows.forEach(r=>{ const bx=r.getBoundingClientRect(); const cx=bx.left+bx.width/2, cy=bx.top+bx.height/2; const d=Math.hypot(ev.clientX-cx, ev.clientY-cy);
          if(d<bd){ bd=d; best=r; before=(ev.clientY<cy-0.5)||(Math.abs(ev.clientY-cy)<=bx.height/2 && ev.clientX<cx); } });
        if(best){ list.insertBefore(row, before?best:best.nextSibling); } else { list.appendChild(row); }
      };
      const up=()=>{ try{ h.releasePointerCapture(e.pointerId); }catch(_){}
        h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up); row.classList.remove("dragging");
        const order=[...list.querySelectorAll("[data-rid]")].map(r=>r.dataset.rid);
        arr.sort((a,b)=>{ const ia=order.indexOf(String(a.id)), ib=order.indexOf(String(b.id)); if(ia<0&&ib<0)return 0; if(ia<0)return 1; if(ib<0)return -1; return ia-ib; });
        if(onDone) onDone();
      };
      h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
    });
  });
}

/* ===== 보드 / 카드 / 자유 배치·크기조절 ===== */
const board=$("#board");
const boardW=()=>board.clientWidth;
function cardOf(id){ return board.querySelector(`.card[data-id="${id}"]`); }
let mode="normal";
function lay(w){
  if(mode==="max"){ if(!w.layoutMax) w.layoutMax=Object.assign({}, w.layout||{x:0,y:0,w:300,h:200,z:1}); return w.layoutMax; }
  if(!w.layout) w.layout=Object.assign({}, w.layoutMax||{x:0,y:0,w:300,h:200,z:1}); return w.layout;
}
function renderPositions(){ state.widgets.forEach(w=>{ const c=cardOf(w.id); if(c) applyPos(c,w); }); growBoard(); }
function setMode(m){ if(mode===m) return; mode=m; renderPositions(); persist(); }
function rdLay(o){ return mode==="max" ? (o.layoutMax||o.layout) : o.layout; }
function applyPos(card,w){ const L=lay(w); card.style.left=L.x+"px"; card.style.top=L.y+"px"; card.style.width=L.w+"px"; card.style.height=L.h+"px"; card.style.zIndex=L.z||1; }
function bringFront(card,w){ const L=lay(w); L.z=++maxZ; card.style.zIndex=L.z; }
function growBoard(){ let max=320; state.widgets.forEach(w=>{ const L=rdLay(w); if(L) max=Math.max(max, L.y+L.h); }); board.style.height=(max+40)+"px"; }
function overlap(a,b){ return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y); }
function findFreeSpot(wd,ht){ const bw=boardW()||1000; const step=24; for(let y=0;y<5000;y+=step){ for(let x=0;x+wd<=bw;x+=step){ const cand={x,y,w:wd,h:ht}; const hit=state.widgets.some(o=>{ const lo=rdLay(o); return lo&&overlap(cand,lo); }); if(!hit) return {x,y}; } } return {x:0,y:0}; }

function mountCard(w){
  const def=WIDGETS[w.type]; if(!def) return null;
  const card=el("div","card"); card.dataset.id=w.id; applyPos(card,w);
  const head=el("div","head");
  const ttl=el("div","ttl",`<span class="ico">${def.icon}</span><span class="tname"></span>`);
  $(".tname",ttl).textContent = w.title || def.title;
  head.appendChild(ttl); head.appendChild(el("div","sp"));
  const ren=el("div","hact",`✎`); ren.title="제목 변경"; ren.onpointerdown=e=>e.stopPropagation(); ren.onclick=()=>renameTitle(ttl,w,def); head.appendChild(ren);
  if(def.print){ const pr=el("div","hact",`🖨`); pr.title="인쇄"; pr.onpointerdown=e=>e.stopPropagation(); pr.onclick=()=>{ const o=def.print(w); printContent(o.title,o.html); }; head.appendChild(pr); }
  if(def.settings){ const gear=el("div","hact",`⚙`); gear.title="설정"; gear.onpointerdown=e=>e.stopPropagation(); gear.onclick=()=>def.openSettings($(".body",card),w); head.appendChild(gear); }
  const del=el("div","hact del",`✕`); del.title="삭제"; del.onpointerdown=e=>e.stopPropagation(); del.onclick=()=>removeWidget(w,card); head.appendChild(del);
  const body=el("div","body"); const rsz=el("div","rsz");
  card.appendChild(head); card.appendChild(body); card.appendChild(rsz);
  def.mount(body,w);
  enableMove(card,head,w); enableResize(card,rsz,w);
  card.addEventListener("pointerdown",()=>bringFront(card,w));
  return card;
}
function renameTitle(ttl,w,def){
  const cur=w.title||def.title;
  const inp=el("input"); inp.className="tedit"; inp.value=cur; inp.maxLength=24;
  inp.onpointerdown=e=>e.stopPropagation();
  const nameEl=$(".tname",ttl); nameEl.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const finish=(val)=>{ if(done)return; done=true; const ns=el("span","tname"); ns.textContent=val; inp.replaceWith(ns); };
  const commit=()=>{ const v=inp.value.trim(); w.title=v||def.title; finish(w.title); persist(); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){commit();} else if(e.key==="Escape"){finish(cur);} });
  inp.addEventListener("blur",commit);
}
function enableMove(card,head,w){
  head.addEventListener("pointerdown",e=>{
    if(e.target.closest(".hact")) return; e.preventDefault(); bringFront(card,w);
    const sTop=()=>window.pageYOffset||document.documentElement.scrollTop||0;
    const L=lay(w); const sx=e.clientX, sy=e.clientY+sTop(), ox=L.x, oy=L.y;
    card.classList.add("moving"); head.setPointerCapture(e.pointerId);
    let lastEv=e, autoT=null;
    const place=(cx,cy)=>{ let nx=snap(clamp(ox+(cx-sx),0,Math.max(0,boardW()-L.w))); let ny=snap(Math.max(0,oy+(cy-sy)));
      L.x=nx; L.y=ny; card.style.left=nx+"px"; card.style.top=ny+"px"; growBoard(); };
    const EDGE=80, STEP=16;
    autoT=setInterval(()=>{
      if(!lastEv) return; const vh=window.innerHeight; let dir=0;
      if(lastEv.clientY > vh-EDGE) dir=1; else if(lastEv.clientY < EDGE && sTop()>0) dir=-1;
      if(!dir) return;
      const before=sTop(); window.scrollBy(0, dir*STEP);
      if(sTop()!==before) place(lastEv.clientX, lastEv.clientY+sTop());
    },16);
    const mv=ev=>{ lastEv=ev; place(ev.clientX, ev.clientY+sTop()); };
    const up=()=>{ if(autoT){clearInterval(autoT); autoT=null;} head.releasePointerCapture(e.pointerId); head.removeEventListener("pointermove",mv); head.removeEventListener("pointerup",up); card.classList.remove("moving"); growBoard(); persist(); };
    head.addEventListener("pointermove",mv); head.addEventListener("pointerup",up);
  });
}
function enableResize(card,rsz,w){
  rsz.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation(); bringFront(card,w);
    const L=lay(w); const sx=e.clientX, sy=e.clientY, ow=L.w, oh=L.h; card.classList.add("sizing"); rsz.setPointerCapture(e.pointerId);
    const mv=ev=>{ let nw=snap(clamp(ow+(ev.clientX-sx),220,boardW()-L.x)); let nh=snap(Math.max(130,oh+(ev.clientY-sy))); L.w=nw; L.h=nh; card.style.width=nw+"px"; card.style.height=nh+"px"; growBoard(); };
    const up=()=>{ rsz.releasePointerCapture(e.pointerId); rsz.removeEventListener("pointermove",mv); rsz.removeEventListener("pointerup",up); card.classList.remove("sizing"); growBoard(); persist(); };
    rsz.addEventListener("pointermove",mv); rsz.addEventListener("pointerup",up);
  });
}

function addWidget(type){

function notifDismissed(){ try{ return JSON.parse(localStorage.getItem("dash.notif")||"{}"); }catch(e){ return {}; } }
function notifDismiss(key){ try{ const d=notifDismissed(); d[key]=ymd(new Date()); localStorage.setItem("dash.notif",JSON.stringify(d)); }catch(e){} }
function memoDatesToday(text){
  const now=new Date(), M=now.getMonth()+1, D=now.getDate(), Y=now.getFullYear(); const out=[];
  (text||"").split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const pats=[ /(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/, /(?:^|[^\d])(\d{1,2})[-.\/](\d{1,2})(?![\d\-.\/])/, /(\d{1,2})\s*월\s*(\d{1,2})\s*일/ ];
    for(let i=0;i<pats.length;i++){ const m=t.match(pats[i]); if(!m) continue;
      let mo,da; if(i===0){ if(+m[1]!==Y) continue; mo=+m[2]; da=+m[3]; } else { mo=+m[1]; da=+m[2]; }
      if(mo===M&&da===D){ out.push(t); break; }
    }
  });
  return out;
}
async function collectNotices(){
  const list=[], today=ymd(new Date());
  state.widgets.forEach(w=>{
    const title=w.title||(WIDGETS[w.type]&&WIDGETS[w.type].title)||"";
    if(w.type==="todo"&&w.config&&Array.isArray(w.config.items)){
      w.config.items.filter(i=>!i.done&&i.date===today).forEach(i=>list.push({key:"todo:"+i.id, icon:"✓", from:title||"할 일", text:i.text}));
    }
    if(w.type==="memo"&&w.config&&w.config.text){
      memoDatesToday(w.config.text).forEach((line,idx)=>list.push({key:"memo:"+w.id+":"+today+":"+idx, icon:"📝", from:title||"메모", text:line}));
    }
  });
  const neis=state.widgets.find(w=>w.type==="neis"&&w.config&&w.config.school);
  if(neis){
    try{ const sc=neis.config.school; let url=`https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pSize=50&ATPT_OFCDC_SC_CODE=${sc.atpt}&SD_SCHUL_CODE=${sc.code}&AA_FROM_YMD=${today}&AA_TO_YMD=${today}`; if(neis.config.key)url+=`&KEY=${neis.config.key}`;
      const d=JSON.parse(await httpGet(url)); const rows=(d.SchoolSchedule&&d.SchoolSchedule[1]&&d.SchoolSchedule[1].row)||[];
      const seen={}; rows.forEach(r=>{ const nm=(r.EVENT_NM||"").trim(); if(!nm||nm==="토요휴업일"||seen[nm])return; seen[nm]=1;
        list.push({key:"neis:"+today+":"+nm, icon:"📅", from:"학사일정", text:nm}); });
    }catch(e){}
  }
  return list;
}
function showNotices(items){

async function runNotices(){

    if(res.app){

}

const APP_VER="2026-09-09";
function buildPalette(){ const p=$("#palette"); p.innerHTML=""; const vt=$("#verTag"); if(vt) vt.textContent=`화면 버전 ${APP_VER} · 위젯 ${Object.keys(WIDGETS).length}개`; Object.keys(WIDGETS).forEach(type=>{ const d=WIDGETS[type]; const c=el("div","pcard",`<div class="pi">${d.icon}</div><div><div class="pt">${d.title}</div><div class="pd">${d.desc}</div></div>`); c.onclick=()=>addWidget(type); p.appendChild(c); }); }
function openSheet(){ $("#scrim").classList.add("on"); }
function closeSheet(){ $("#scrim").classList.remove("on"); }
$("#addBtn").onclick=openSheet; $("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeSheet(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("resize",clampAll);

/* ===== 시작 ===== */
function ensureDefaults(){
  if(!state.widgets||!state.widgets.length){
    state.widgets=[ {id:uid(),type:"clock"}, {id:uid(),type:"weather"}, {id:uid(),type:"todo"}, {id:uid(),type:"meal"} ];
  }
}
var bootedWithApi=false, _ready=false;
async function boot(){
  if(booted && (bootedWithApi || !hasApi("load_state"))) return;
  booted=true; bootedWithApi=hasApi("load_state"); _ready=false;
  await loadState(); if(!state.theme)state.theme="light"; ensureDefaults(); assignLayouts();
  if(hasApi("is_maximized")){ try{ if(await window.pywebview.api.is_maximized()){ isMax=true; mode="max"; } }catch(e){} }
  const _mb=$("#winMax"); if(_mb){ _mb.textContent=isMax?"❐":"▢"; _mb.title=isMax?"이전 크기로":"최대화"; }
  applyTheme(); updateTopbar(); buildPalette(); renderAll(); _ready=true; setTimeout(runNotices,1200); setTimeout(()=>checkUpdate(false),2500); }
window.addEventListener("pywebviewready",()=>{ document.body.classList.add("app"); boot(); });
window.addEventListener("DOMContentLoaded",()=>{ updateTopbar(); setTimeout(()=>{ if(!window.pywebview) boot(); },1500); });
</script>
</body>
