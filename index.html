  const list=[], today=ymd(new Date());
  state.widgets.forEach(w=>{
    const title=w.title||(WIDGETS[w.type]&&WIDGETS[w.type].title)||"";
    if(w.type==="todo"&&w.config&&Array.isArray(w.config.items)){
      w.config.items.filter(i=>!i.done&&i.date===today).forEach(i=>list.push({key:"todo:"+i.id, icon:"✓", from:title||"할 일", text:i.text}));
    }
    if(w.type==="memo"&&w.config&&w.config.text){
      memoDatesToday(w.config.text).forEach((line,idx)=>list.push({key:"memo:"+w.id+":"+today+":"+idx, icon:"📝", from:title||"메모", text:line}));
    }
  });
  const neis=state.widgets.find(w=>w.type==="neis"&&w.config&&w.config.school);
  if(neis){
    try{ const sc=neis.config.school; let url=`https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pSize=50&ATPT_OFCDC_SC_CODE=${sc.atpt}&SD_SCHUL_CODE=${sc.code}&AA_FROM_YMD=${today}&AA_TO_YMD=${today}`; if(neis.config.key)url+=`&KEY=${neis.config.key}`;
      const d=JSON.parse(await httpGet(url)); const rows=(d.SchoolSchedule&&d.SchoolSchedule[1]&&d.SchoolSchedule[1].row)||[];
      const seen={}; rows.forEach(r=>{ const nm=(r.EVENT_NM||"").trim(); if(!nm||nm==="토요휴업일"||seen[nm])return; seen[nm]=1;
        list.push({key:"neis:"+today+":"+nm, icon:"📅", from:"학사일정", text:nm}); });
    }catch(e){}
  }
  return list;
}
function showNotices(items){
  if(!items.length) return;
  let wrap=document.getElementById("noticeWrap");
  if(!wrap){ wrap=document.createElement("div"); wrap.id="noticeWrap"; document.body.appendChild(wrap); }
  items.slice(0,6).forEach((n,i)=>{
    const card=el("div","notice");
    card.innerHTML=`<div class="nt-i">${n.icon}</div><div class="nt-b"><div class="nt-f"></div><div class="nt-t"></div></div><div class="nt-x">✕</div>`;
    $(".nt-f",card).textContent=n.from+" · 오늘";
    $(".nt-t",card).textContent=n.text;
    const close=()=>{ notifDismiss(n.key); card.classList.remove("on"); setTimeout(()=>card.remove(),200); };
    $(".nt-x",card).onclick=close;
    wrap.appendChild(card);
    setTimeout(()=>card.classList.add("on"), 80+i*110);
  });
}
async function runNotices(){
  try{
    const done=notifDismissed(), today=ymd(new Date());
    const all=await collectNotices();
    const fresh=all.filter(n=>done[n.key]!==today);
    showNotices(fresh);
  }catch(e){}
}

function tickClock(){ const now=new Date(); document.querySelectorAll("[data-clock-time]").forEach(e=>e.innerHTML=`${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`); const wd=["일","월","화","수","목","금","토"][now.getDay()]; document.querySelectorAll("[data-clock-date]").forEach(e=>e.textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${wd}요일`); checkDayRollover(); }
let _curDay=new Date().toDateString();
function checkDayRollover(){ const d=new Date().toDateString(); if(d===_curDay) return; const prevToday=ymd(new Date(_curDay)); _curDay=d; updateTopbar();
  state.widgets.forEach(w=>{ if(w.type==="todo" && w.config && w.config.sel===prevToday){ w.config.sel=ymd(new Date()); w.config.moff=0; } });
  setTimeout(runNotices,800);
  state.widgets.forEach(w=>{ if(["dday","meal","neis","quote","history","todo"].includes(w.type)){ const c=cardOf(w.id); if(!c) return; const body=c.querySelector(".body"); if(!body) return; const def=WIDGETS[w.type]; try{ def.mount(body,w); }catch(e){} } }); }
function updateTopbar(){ const now=new Date(), h=now.getHours(); let g="반가워요"; if(h>=5&&h<11)g="좋은 아침이에요"; else if(h>=11&&h<17)g="좋은 오후예요"; else if(h>=17&&h<22)g="좋은 저녁이에요"; else g="편안한 밤 되세요"; $("#greet").textContent=g; }
setInterval(tickClock,1000); setInterval(updateTopbar,60000);

/* ===== 창 버튼 (테두리 없는 창) ===== */
$("#winMin").onclick=()=>{ if(hasApi("minimize")) window.pywebview.api.minimize(); };
$("#winMax").onclick=toggleMax;
$("#winClose").onclick=()=>{ if(hasApi("close")) window.pywebview.api.close(); };
$("#titlebar").addEventListener("dblclick",e=>{ if(e.target.closest(".wbtn"))return; toggleMax(); });
/* 제목줄을 끌어 옮긴 뒤: 창을 되돌리지 말고, 최대화 여부만 다시 읽어 아이콘/상태를 맞춤 */
$("#titlebar").addEventListener("mousedown",e=>{ if(e.target.closest(".wbtn"))return;
  const up=()=>{ window.removeEventListener("mouseup",up); setTimeout(syncMaxIcon,200); };
  window.addEventListener("mouseup",up); });
let isMax=false;
async function syncMaxIcon(){
  const mb=$("#winMax"); if(!mb) return;
  if(hasApi("is_maximized")){ try{ isMax=!!(await window.pywebview.api.is_maximized()); }catch(e){} }
  mb.textContent = isMax ? "❐" : "▢";
  mb.title = isMax ? "이전 크기로" : "최대화";
  setMode(isMax?"max":"normal");
}
function toggleMax(){
  if(hasApi("toggle_max")){ window.pywebview.api.toggle_max(); setTimeout(syncMaxIcon,200); }
  else { isMax=!isMax; const mb=$("#winMax"); if(mb){ mb.textContent=isMax?"❐":"▢"; mb.title=isMax?"이전 크기로":"최대화"; } setMode(isMax?"max":"normal"); }
}
let _rsTimer=null;
window.addEventListener("resize",()=>{ clearTimeout(_rsTimer); _rsTimer=setTimeout(syncMaxIcon,220); });
(function(){ const grip=$("#winResize"); let raf=null,pw,ph;
  grip.addEventListener("pointerdown",e=>{ if(!hasApi("resize"))return; e.preventDefault(); grip.setPointerCapture(e.pointerId);
    const sx=e.screenX, sy=e.screenY, sw=window.innerWidth, sh=window.innerHeight;
    const mv=ev=>{ pw=Math.max(760,sw+(ev.screenX-sx)); ph=Math.max(540,sh+(ev.screenY-sy)); if(!raf)raf=requestAnimationFrame(()=>{raf=null; window.pywebview.api.resize(Math.round(pw),Math.round(ph));}); };
    const up=()=>{ grip.releasePointerCapture(e.pointerId); grip.removeEventListener("pointermove",mv); grip.removeEventListener("pointerup",up); setTimeout(clampAll,80); };
    grip.addEventListener("pointermove",mv); grip.addEventListener("pointerup",up); });
})();

/* ===== 위젯 추가 모달 ===== */

/* ===== 자동 업데이트 ===== */
async function checkUpdate(manual){
  if(!hasApi("check_update")){ if(manual) toast("설치형(exe)에서만 확인할 수 있어요"); return; }
  let r=null; try{ r=await window.pywebview.api.check_update(); }catch(e){}
  if(!r||!r.ok){ if(manual) toast(r&&r.reason==="offline"?"업데이트 서버에 연결할 수 없어요":"업데이트를 확인하지 못했어요"); return; }
  if(!r.ui && !r.app){ if(manual) toast("최신 버전입니다"); return; }
  showUpdateBar(r);
}
function showUpdateBar(r){
  const old=document.getElementById("updBar"); if(old) old.remove();
  const bar=el("div","updbar"); bar.id="updBar";
  const what=[r.ui?"화면":"", r.app?"프로그램":""].filter(Boolean).join("·");
  bar.innerHTML=`<div class="ub-i">🎉</div><div class="ub-b"><div class="ub-t">새 버전이 나왔습니다</div><div class="ub-s"></div></div><button class="ub-go">업데이트</button><div class="ub-x">✕</div>`;
  $(".ub-s",bar).textContent=(r.notes||`${what} 업데이트가 준비되어 있어요.`);
  $(".ub-x",bar).onclick=()=>bar.remove();
  const btn=$(".ub-go",bar);
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="받는 중…";
    let res=null; try{ res=await window.pywebview.api.apply_update(); }catch(e){}
    if(!res||!res.ok){ btn.disabled=false; btn.textContent="다시 시도"; toast("업데이트를 받지 못했어요"); return; }
    if(res.app){
      btn.textContent="설치 중…";
      $(".ub-s",bar).textContent="잠시 후 프로그램이 자동으로 다시 시작됩니다.";
      try{ await window.pywebview.api.finish_app_update(); }catch(e){}
      setTimeout(()=>{ try{ window.pywebview.api.close(); }catch(e){} }, 1200);
      return;
    }
    if(res.ui){
      $(".ub-t",bar).textContent="업데이트 완료";
      $(".ub-s",bar).textContent="새 화면을 적용하기 위해 다시 시작합니다…";
      btn.remove();
      if(hasApi("restart_app")){
        try{ const rr=await window.pywebview.api.restart_app();
          if(rr&&rr.ok){ setTimeout(()=>{ try{ window.pywebview.api.close(); }catch(e){} }, 1000); return; }
        }catch(e){}
      }
      $(".ub-s",bar).textContent="프로그램을 껐다 켜면 새 화면이 적용됩니다.";
      return;
    }
    btn.disabled=false; btn.textContent="업데이트";
    toast(res.app_error==="not_frozen"?"설치형(exe)에서만 프로그램 업데이트가 됩니다":"이미 최신 상태예요");
  };
  document.body.appendChild(bar);
  setTimeout(()=>bar.classList.add("on"), 60);
}

const APP_VER="2026-09-22";
let _palTab="basic";
function buildPalette(){ const p=$("#palette"); p.innerHTML=""; const vt=$("#verTag");
  if(vt){ vt.textContent=`화면 ${APP_VER} · 위젯 ${Object.keys(WIDGETS).length}개`;
    if(hasApi("get_versions")){ window.pywebview.api.get_versions().then(v=>{ if(v&&v.app&&vt.isConnected) vt.textContent=`화면 ${APP_VER} · 프로그램 ${v.app} · 위젯 ${Object.keys(WIDGETS).length}개`; }).catch(()=>{}); } }
  [...document.querySelectorAll("[data-pt]")].forEach(btn=>{
    btn.className=(btn.dataset.pt===_palTab)?"on":"";
    btn.onclick=()=>{ _palTab=btn.dataset.pt; buildPalette(); }; });
  const keys=Object.keys(WIDGETS).filter(t=>!!WIDGETS[t].special===(_palTab==="special"));
  if(_palTab==="special"){
    const note=el("div","pnote","내 컴퓨터의 다른 프로그램과 연결해 쓰는 기능입니다. 해당 프로그램이 설치·로그인되어 있어야 동작해요.");
    p.appendChild(note); }
  if(!keys.length){ p.appendChild(el("div","empty","표시할 항목이 없어요.")); return; }
  keys.forEach(type=>{ const d=WIDGETS[type];
    const c=el("div","pcard",`<div class="pi">${d.icon}</div><div><div class="pt">${d.title}</div><div class="pd">${d.desc}</div></div>`);
    c.onclick=()=>addWidget(type); p.appendChild(c); });
}
function openSheet(){ buildPalette(); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#scrim").classList.remove("on"); }
$("#addBtn").onclick=openSheet; $("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeSheet(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("resize",clampAll);

/* ===== 시작 ===== */
function ensureDefaults(){
  if(!state.widgets||!state.widgets.length){
    state.widgets=[ {id:uid(),type:"clock"}, {id:uid(),type:"weather"}, {id:uid(),type:"todo"}, {id:uid(),type:"meal"} ];
  }
}
var bootedWithApi=false, _ready=false;
async function boot(){
  if(booted && (bootedWithApi || !hasApi("load_state"))) return;
  booted=true; bootedWithApi=hasApi("load_state"); _ready=false;
  await loadState(); if(!state.theme)state.theme="light"; ensureDefaults(); adaptLayouts(); assignLayouts();
  if(hasApi("is_maximized")){ try{ if(await window.pywebview.api.is_maximized()){ isMax=true; mode="max"; } }catch(e){} }
  const _mb=$("#winMax"); if(_mb){ _mb.textContent=isMax?"❐":"▢"; _mb.title=isMax?"이전 크기로":"최대화"; }
  applyTheme(); updateTopbar(); _bootPhase=true; renderAll(); requestAnimationFrame(()=>runMountQueue());
  _ready=true; setTimeout(runNotices,1500); setTimeout(()=>Sync.init(),1800); setTimeout(()=>checkUpdate(false),2500); }
window.addEventListener("pywebviewready",()=>{ document.body.classList.add("app"); boot(); });
window.addEventListener("DOMContentLoaded",()=>{ updateTopbar(); setTimeout(()=>{ if(!window.pywebview) boot(); },1500); });
</script>
