<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard</title>
<style>
  :root{
    --bg:#F3EFE6; --bg-soft:#FBF9F2;
    --card:#FFFFFF; --card-2:#F6F1E7;
    --border:#E8E1D0; --border-strong:#D7CDB6;
    --text:#231D12; --muted:#7F7666; --faint:#AEA48F;
    --accent:#B88923; --accent-2:#9A7115; --accent-soft:rgba(184,137,35,.12);
    --accent-ink:#2A2005;
    --teal:#2E9E92; --danger:#D25A50; --good:#3F9E55;
    --dot:rgba(70,56,28,.06);
    --radius:20px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(56,44,20,.05), 0 14px 34px -20px rgba(56,44,20,.18);
    --shadow-lift:0 5px 12px rgba(56,44,20,.08), 0 26px 52px -18px rgba(56,44,20,.22);
    --ease:cubic-bezier(.25,.6,.3,1);
  }
  [data-theme="dark"]{
    --bg:#181510; --bg-soft:#201B14;
    --card:#231E15; --card-2:#2C2618;
    --border:#342D1E; --border-strong:#48402C;
    --text:#F2EDE2; --muted:#A79D8B; --faint:#746B59;
    --accent:#E7BD54; --accent-2:#D2A539; --accent-soft:rgba(231,189,84,.15);
    --accent-ink:#241C05;
    --teal:#7FD6CC; --danger:#E5736B; --good:#86C98B;
    --dot:rgba(255,240,219,.05);
    --shadow:0 2px 4px rgba(0,0,0,.25), 0 18px 40px -20px rgba(0,0,0,.5);
    --shadow-lift:0 6px 14px rgba(0,0,0,.3), 0 26px 52px -16px rgba(0,0,0,.55);
  }

  .card.hasfont,.card.hasfont *{font-family:inherit;}
  .card.fz .body{zoom:var(--fz,1);}
  /* 글꼴별 특성 — 굵기·자간·줄간격까지 다르게 */
  .f-serif .body{letter-spacing:-.1px; line-height:1.62;}
  .f-serif .clock .time,.f-serif .wx .temp{font-weight:600; letter-spacing:-1px;}
  .f-gowun .body{letter-spacing:.2px; line-height:1.68;}
  .f-gowun .clock .time,.f-gowun .wx .temp{font-weight:400; letter-spacing:-.5px;}
  .f-cafe24 .clock .time,.f-cafe24 .wx .temp{font-weight:400; letter-spacing:0;}
  .f-cafe24 .body{line-height:1.6;}
  .f-mono .body{letter-spacing:-.3px;}
  .f-mono .clock .time,.f-mono .wx .temp,.f-mono .stk .sq-p{font-weight:500; letter-spacing:-1px;}
  .f-nanum .clock .time,.f-nanum .wx .temp{font-weight:700;}
  .f-spoqa .stk .sq-p,.f-spoqa .clock .time{font-variant-numeric:tabular-nums; font-weight:700;}
  .f-suit .clock .time,.f-suit .wx .temp{font-weight:700; letter-spacing:-2px;}
  .f-wanted .clock .time,.f-wanted .wx .temp{font-weight:600; letter-spacing:-1.8px;}
  .fontpop{position:fixed; z-index:10002; width:228px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow-lift); padding:11px;}
  .fontpop .fp-t{font-size:10.5px; font-weight:700; color:var(--muted); margin:2px 2px 6px;}
  .fontpop .fp-t:nth-of-type(2){margin-top:11px;}
  .fontpop .fp-g{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
  .fontpop .fp-g.z{grid-template-columns:1fr 1fr 1fr;}
  .fontpop .fp-b{padding:6px 4px; font-size:12px; border:1px solid var(--border); background:var(--card-2);
    color:var(--text); border-radius:8px; cursor:pointer; transition:border-color .12s;}
  .fontpop .fp-b:hover{border-color:var(--accent);}
  .fontpop .fp-b.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}

  .tsec{font-size:11.5px; font-weight:700; color:var(--muted); margin:16px 2px 8px; letter-spacing:.3px;}
  .tsec:first-of-type{margin-top:4px;}
  .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px;}
  .tcard{border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer;
    transition:border-color .13s var(--ease), transform .13s var(--ease);}
  .tcard:hover{border-color:var(--accent); transform:translateY(-2px);}
  .tcard.on{border-color:var(--accent); border-width:2px;}
  .tprev2{padding:10px; height:96px; box-sizing:border-box;}
  .tdesc{font-size:10px; color:var(--faint); padding:0 8px 7px; text-align:center; background:var(--card-2);}
  .tprev{height:52px; padding:7px; display:flex; flex-direction:column; gap:4px;}
  .tprev i{display:block; border-radius:4px; height:12px;}
  .tprev i.a{width:62%;} .tprev i.b{width:88%; height:9px;}
  .tpname{font-size:11px; padding:5px 7px; text-align:center; background:var(--card-2); color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tcard.on .tpname{color:var(--accent-2); font-weight:700;}

  /* ══════════ 벤토 그리드 ══════════ */
  [data-theme="bento"]{
    --bg:#0D0D0F; --bg-soft:#141417; --card:#17171B; --card-2:#1F1F24;
    --border:#232329; --border-strong:#33333B;
    --text:#FFFFFF; --muted:#808089; --faint:#65656C;
    --accent:#D63B2F; --accent-2:#E85A4E; --accent-soft:rgba(214,59,47,.15); --accent-ink:#FFFFFF;
    --teal:#2CB67D; --danger:#D63B2F; --good:#2CB67D; --dot:rgba(255,255,255,.025);
    --radius:20px; --radius-sm:14px;
    --shadow:none; --shadow-lift:0 10px 34px rgba(0,0,0,.65);
  }
  [data-theme="bento"] body{ background:var(--bg); }
  [data-theme="bento"] .card{ padding:14px 16px 13px; border:none; }
  [data-theme="bento"] .card:hover{ background:var(--card-2); }
  [data-theme="bento"] .card .head{ margin-bottom:9px; }
  [data-theme="bento"] .card .head .ico{ display:none; }
  [data-theme="bento"] .card .head .ttl{ font-size:9px; letter-spacing:2.4px; text-transform:uppercase;
    color:var(--muted); font-weight:600; }
  [data-theme="bento"] .hact{ border-radius:50%; }
  /* 시계 — 숫자를 압도적으로, 콜론만 흐리게 */
  [data-theme="bento"] .clock{ display:flex; flex-direction:column; justify-content:space-between; height:100%; }
  [data-theme="bento"] .clock .time{ font-size:58px; font-weight:300; letter-spacing:-3.5px; }
  [data-theme="bento"] .clock .time .sec{ font-size:15px; color:var(--accent); vertical-align:super; }
  [data-theme="bento"] .clock .sub{ font-size:9px; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--faint); margin-top:8px; }
  /* 날씨 — 온도 크게, 예보는 알약 타일 */
  [data-theme="bento"] .wx .temp{ font-size:48px; font-weight:300; letter-spacing:-2.5px; }
  [data-theme="bento"] .wx .temp small{ font-size:14px; }
  [data-theme="bento"] .wx .emoji{ font-size:34px; opacity:.9; }
  [data-theme="bento"] .wx .desc{ font-size:10px; letter-spacing:.6px; }
  [data-theme="bento"] .wx .meta{ font-size:9.5px; letter-spacing:.8px; gap:14px; margin-top:13px; }
  [data-theme="bento"] .wx .fc{ gap:6px; }
  [data-theme="bento"] .wx .fc .d{ background:var(--card-2); border:none; border-radius:16px; padding:10px 3px; }
  [data-theme="bento"] .wx .air{ gap:16px; }
  [data-theme="bento"] .wx .hrs .h{ background:var(--card-2); border:none; border-radius:15px; }
  /* 할 일 — 원형 체크, 완료 헤더 대문자 */
  [data-theme="bento"] .ti{ border-radius:14px; padding:9px 10px; }
  [data-theme="bento"] .ti:hover{ background:var(--card-2); }
  [data-theme="bento"] .ti .box{ border-radius:50%; border-width:1.5px; }
  [data-theme="bento"] .ti.done .box{ background:var(--accent); border-color:var(--accent); }
  [data-theme="bento"] .ti .tx{ font-size:13.5px; }
  [data-theme="bento"] .donehdr{ font-size:9px; letter-spacing:1.8px; text-transform:uppercase; }
  [data-theme="bento"] .todo .tdate{ border-radius:999px; background:var(--accent-soft); color:var(--accent-2); }
  [data-theme="bento"] .todo .ttabs button,[data-theme="bento"] .neis .ntabs button,
  [data-theme="bento"] .tt2 .ttabs button{ border-radius:999px; border:none; background:var(--card-2); }
  /* 시세·급식·바로가기 — 알약 통일 */
  [data-theme="bento"] .stk .sq-p{ font-size:17px; font-weight:400; letter-spacing:-.5px; }
  [data-theme="bento"] .stk .sq{ border-bottom-color:var(--border); }
  [data-theme="bento"] .meal .dishes span{ border-radius:999px; background:var(--card-2); border:none; padding:6px 12px; }
  [data-theme="bento"] .links a,[data-theme="bento"] .mini,[data-theme="bento"] .news .nsrc,
  [data-theme="bento"] .quickpick .qp,[data-theme="bento"] .dict .dmode{ border-radius:999px; border:none;
    background:var(--card-2); }
  [data-theme="bento"] input,[data-theme="bento"] textarea,[data-theme="bento"] select{
    border-radius:14px; border:none; background:var(--card-2); }
  [data-theme="bento"] .apps .ic-img{ border-radius:18px; border:none; background:var(--card-2); }
  [data-theme="bento"] .neis .sch,[data-theme="bento"] .neis .tt-row,
  [data-theme="bento"] .roster .rrow,[data-theme="bento"] .news .nitem{ border-radius:14px; border:none;
    background:var(--card-2); }
  [data-theme="bento"] table.tt td{ border-color:var(--border); }
  [data-theme="bento"] .dday .item .dv{ font-size:19px; font-weight:400; }

  /* ══════════ 사이버펑크 HUD ══════════ */
  [data-theme="hud"]{
    --bg:#0B0E14; --bg-soft:#0F131B; --card:rgba(0,229,160,.035); --card-2:rgba(0,229,160,.07);
    --border:#1E4D3E; --border-strong:#00E5A0;
    --text:#00E5A0; --muted:#3D6B5C; --faint:#2A5044;
    --accent:#00E5A0; --accent-2:#00FFB0; --accent-soft:rgba(0,229,160,.12); --accent-ink:#0B0E14;
    --teal:#00E5A0; --danger:#FF3B5C; --good:#00E5A0; --dot:rgba(0,229,160,.05);
    --radius:0px; --radius-sm:0px;
    --shadow:none; --shadow-lift:0 0 24px rgba(0,229,160,.25);
  }
  [data-theme="hud"] body{ background:
    repeating-linear-gradient(0deg, rgba(0,229,160,.025) 0 1px, transparent 1px 3px), var(--bg); }
  [data-theme="hud"] .card{ border:1px solid var(--border); padding:14px 13px 12px;
    font-family:"JetBrains Mono","Consolas",monospace; }
  [data-theme="hud"] .card::before{ content:""; pointer-events:none; position:absolute; top:-1px; left:-1px; width:9px; height:9px;
    border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  [data-theme="hud"] .card::after{ content:""; pointer-events:none; position:absolute; bottom:-1px; right:-1px; width:9px; height:9px;
    border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }
  [data-theme="hud"] .card:hover{ border-color:var(--accent); box-shadow:0 0 16px rgba(0,229,160,.18); }
  [data-theme="hud"] .card .head{ margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:7px; }
  [data-theme="hud"] .card .head .ico{ display:none; }
  [data-theme="hud"] .card .head .ttl{ font-size:9.5px; letter-spacing:2.2px; text-transform:uppercase; }
  [data-theme="hud"] .card .head .ttl::before{ content:"▸ "; color:var(--accent); }
  [data-theme="hud"] .hact{ border-radius:0; border:1px solid transparent; }
  [data-theme="hud"] .hact:hover{ border-color:var(--accent); background:transparent; }
  /* 시계 — 발광 숫자 */
  [data-theme="hud"] .clock .time{ font-size:42px; font-weight:500; letter-spacing:2px;
    text-shadow:0 0 14px rgba(0,229,160,.55); }
  [data-theme="hud"] .clock .time .sec{ font-size:14px; color:var(--muted); text-shadow:none; }
  [data-theme="hud"] .clock .sub{ font-size:9px; letter-spacing:1.6px; color:var(--muted); }
  /* 날씨 — 계기판 느낌 */
  [data-theme="hud"] .wx .temp{ font-size:38px; font-weight:500; letter-spacing:0;
    text-shadow:0 0 12px rgba(0,229,160,.45); }
  [data-theme="hud"] .wx .emoji{ font-size:26px; filter:grayscale(.4); }
  [data-theme="hud"] .wx .desc{ font-size:9.5px; letter-spacing:1px; text-transform:uppercase; }
  [data-theme="hud"] .wx .meta{ font-size:9px; letter-spacing:1px; }
  [data-theme="hud"] .wx .meta b{ color:var(--accent); }
  [data-theme="hud"] .wx .fc .d,[data-theme="hud"] .wx .hrs .h{ border:1px solid var(--border);
    border-radius:0; background:var(--card-2); }
  /* 할 일 — 각진 체크, 대괄호 */
  [data-theme="hud"] .ti{ border-radius:0; border-left:2px solid transparent; padding:7px 8px; }
  [data-theme="hud"] .ti:hover{ background:var(--card-2); border-left-color:var(--accent); }
  [data-theme="hud"] .ti .box{ border-radius:0; border-width:1px; border-color:var(--accent); }
  [data-theme="hud"] .ti.done .tx{ color:var(--faint); }
  [data-theme="hud"] .ti .tx{ font-size:12.5px; letter-spacing:-.2px; }
  [data-theme="hud"] .donehdr{ font-size:9px; letter-spacing:1.6px; text-transform:uppercase; }
  [data-theme="hud"] .todo .tdate{ border-radius:0; border:1px solid var(--border); background:transparent;
    color:var(--accent); font-size:11px; }
  /* 입력·버튼·탭 — 전부 각지게 */
  [data-theme="hud"] input,[data-theme="hud"] textarea,[data-theme="hud"] select,
  [data-theme="hud"] .mini,[data-theme="hud"] .links a,[data-theme="hud"] .news .nsrc,
  [data-theme="hud"] .quickpick .qp,[data-theme="hud"] .dict .dmode,
  [data-theme="hud"] .todo .ttabs button,[data-theme="hud"] .neis .ntabs button,
  [data-theme="hud"] .tt2 .ttabs button{ border-radius:0; border:1px solid var(--border);
    background:transparent; font-family:inherit; }
  [data-theme="hud"] .mini.go,[data-theme="hud"] .todo .ttabs button.on,
  [data-theme="hud"] .neis .ntabs button.on,[data-theme="hud"] .tt2 .ttabs button.on,
  [data-theme="hud"] .dict .dmode.on,[data-theme="hud"] .news .nsrc.on{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  [data-theme="hud"] .apps .ic-img{ border-radius:0; border:1px solid var(--border); }
  [data-theme="hud"] .meal .dishes span{ border-radius:0; border:1px solid var(--border); background:var(--card-2); }
  [data-theme="hud"] .neis .sch,[data-theme="hud"] .neis .tt-row,[data-theme="hud"] .roster .rrow,
  [data-theme="hud"] .news .nitem{ border-radius:0; border:1px solid var(--border); background:var(--card-2); }
  [data-theme="hud"] .stk .sq-p{ font-size:15px; font-weight:500; letter-spacing:0; }
  [data-theme="hud"] .stk .sq-c.up{ color:#FF3B5C; } [data-theme="hud"] .stk .sq-c.down{ color:#00A8FF; }
  [data-theme="hud"] .dday .item .dv{ font-size:17px; font-weight:500; letter-spacing:0; }

  /* ══════════ 클레이모피즘 ══════════ */
  [data-theme="clay"]{
    --bg:#FFEEF5; --bg-soft:#FFF6FA; --card:#FFFFFF; --card-2:#FFE3B8;
    --border:#F5D3E2; --border-strong:#EBB8CE;
    --text:#5C3A4A; --muted:#93677D; --faint:#AA8798;
    --accent:#FF6FA5; --accent-2:#E85490; --accent-soft:#FFE0EC; --accent-ink:#FFFFFF;
    --teal:#2E6B44; --danger:#E8546C; --good:#4FA86E; --dot:rgba(180,120,150,.05);
    --radius:28px; --radius-sm:20px;
    --shadow:0 7px 0 #F5C6DD, 0 11px 18px rgba(220,150,180,.22);
    --shadow-lift:0 10px 0 #F0B8D2, 0 18px 30px rgba(220,150,180,.3);
  }
  [data-theme="clay"] body{ background:var(--bg); }
  [data-theme="clay"] .card{ padding:16px 18px 15px; border:none; }
  [data-theme="clay"] .card:hover{ box-shadow:var(--shadow-lift); }
  [data-theme="clay"] .card .head .ttl{ font-size:12.5px; font-weight:700; }
  [data-theme="clay"] .card .head .ico{ font-size:17px; }
  [data-theme="clay"] .hact{ border-radius:50%; }
  [data-theme="clay"] .hact:hover{ background:var(--accent-soft); }
  /* 시계 — 두툼한 숫자, 가운데 */
  [data-theme="clay"] .clock{ text-align:center; }
  [data-theme="clay"] .clock .time{ font-size:46px; font-weight:800; letter-spacing:-2px; }
  [data-theme="clay"] .clock .time .sec{ font-size:17px; color:var(--accent); }
  [data-theme="clay"] .clock .sub{ font-size:12px; font-weight:600; margin-top:8px; }
  /* 날씨 — 도톰한 예보 타일 */
  [data-theme="clay"] .wx .temp{ font-size:42px; font-weight:800; letter-spacing:-1.5px; }
  [data-theme="clay"] .wx .emoji{ font-size:42px; }
  [data-theme="clay"] .wx .desc{ font-size:12px; font-weight:600; }
  [data-theme="clay"] .wx .meta{ font-size:11.5px; font-weight:600; }
  [data-theme="clay"] .wx .fc .d{ background:var(--card-2); border:none; border-radius:22px;
    box-shadow:0 5px 0 #EBC38C; padding:11px 4px; }
  [data-theme="clay"] .wx .fc{ gap:9px; }
  [data-theme="clay"] .wx .hrs .h{ background:#DCEEFF; border:none; border-radius:18px;
    box-shadow:0 4px 0 #B9D8F5; }
  [data-theme="clay"] .wx .air .ai{ font-weight:600; }
  /* 할 일 — 둥근 알약 행, 도톰한 체크 */
  [data-theme="clay"] .ti{ border-radius:20px; padding:10px 12px; margin-bottom:3px; }
  [data-theme="clay"] .ti:hover{ background:var(--accent-soft); }
  [data-theme="clay"] .ti .box{ border-radius:9px; border:none; background:#FFE0EC;
    box-shadow:0 3px 0 #F0B8D2; width:23px; height:23px; }
  [data-theme="clay"] .ti.done .box{ background:var(--accent); box-shadow:0 3px 0 var(--accent-2); }
  [data-theme="clay"] .ti .tx{ font-size:14px; font-weight:600; }
  [data-theme="clay"] .todo .tdate{ border-radius:999px; background:#C8E6D0; color:#2E6B44;
    box-shadow:0 3px 0 #A5CFB0; font-weight:700; padding:4px 10px; }
  [data-theme="clay"] .donehdr{ font-size:11.5px; font-weight:700; }
  /* 버튼·칩 — 전부 도톰하게 */
  [data-theme="clay"] .mini,[data-theme="clay"] .links a,[data-theme="clay"] .news .nsrc,
  [data-theme="clay"] .quickpick .qp,[data-theme="clay"] .dict .dmode{
    border-radius:999px; border:none; background:var(--card-2); box-shadow:0 4px 0 #EBC38C;
    font-weight:600; }
  [data-theme="clay"] .mini.go,[data-theme="clay"] .dict .dmode.on,[data-theme="clay"] .news .nsrc.on{
    background:var(--accent); color:#FFF; box-shadow:0 4px 0 var(--accent-2); }
  [data-theme="clay"] .todo .ttabs button,[data-theme="clay"] .neis .ntabs button,
  [data-theme="clay"] .tt2 .ttabs button{ border-radius:999px; border:none; background:#FFE0EC;
    box-shadow:0 4px 0 #F0B8D2; font-weight:700; }
  [data-theme="clay"] .todo .ttabs button.on,[data-theme="clay"] .neis .ntabs button.on,
  [data-theme="clay"] .tt2 .ttabs button.on{ background:var(--accent); color:#FFF; box-shadow:0 4px 0 var(--accent-2); }
  [data-theme="clay"] input,[data-theme="clay"] textarea,[data-theme="clay"] select{
    border-radius:18px; border:none; background:#FFF4F8; box-shadow:inset 0 2px 5px rgba(200,150,175,.18); }
  [data-theme="clay"] .meal .dishes span{ border-radius:999px; background:#C8E6D0; color:#2E6B44;
    border:none; box-shadow:0 3px 0 #A5CFB0; padding:7px 13px; font-weight:600; }
  [data-theme="clay"] .apps .ic-img{ border-radius:20px; border:none; background:var(--card-2);
    box-shadow:0 4px 0 #EBC38C; }
  [data-theme="clay"] .neis .sch,[data-theme="clay"] .neis .tt-row,[data-theme="clay"] .roster .rrow,
  [data-theme="clay"] .news .nitem{ border-radius:18px; border:none; background:#FFF4F8; }
  [data-theme="clay"] .dday .item .dv{ font-size:19px; font-weight:800; }
  [data-theme="clay"] .stk .sq-p{ font-size:15px; font-weight:700; }

  /* ══════════ 글래스모피즘 ══════════ */
  [data-theme="glass"]{

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    color:var(--text);
    background:var(--bg);
    background-attachment:fixed;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; min-height:100vh;
  }

  /* ===== 테두리 없는 창의 상단 (창 이동 손잡이 + 창 버튼) ===== */
  #titlebar{
    position:fixed; top:0; left:0; right:0; height:42px; z-index:1000;
    display:none; align-items:center; justify-content:space-between;
    padding:0 12px 0 18px; user-select:none;
  }
  body.app #titlebar{display:flex;}
  #titlebar .tb-title{font-size:12.5px; font-weight:600; color:var(--faint); letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
  #titlebar .tb-title .dotmark{width:13px; height:13px; border-radius:4px; background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .tb-controls{display:flex; gap:4px;}
  .wbtn{
    width:34px; height:28px; border-radius:9px; background:transparent; color:var(--muted);
    font-size:14px; display:grid; place-items:center; transition:background .13s var(--ease), color .13s var(--ease);
  }
  .wbtn:hover{background:var(--card-2); color:var(--text);}
  .wbtn.close:hover{background:rgba(210,90,80,.14); color:var(--danger);}

  .wrap{position:relative; z-index:1; max-width:none; margin:0; padding:24px 30px 80px;}
  body.app .wrap{padding-top:54px;}

  /* ===== 상단 인사 ===== */
  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:20px; flex-wrap:wrap;}
  .hello{display:flex; flex-direction:column; gap:5px;}
  .greet{font-size:26px; font-weight:800; color:var(--text); letter-spacing:-.6px;}
  .today{font-size:26px; font-weight:800; letter-spacing:-.6px;}
  .today .dim{color:var(--muted); font-weight:600;}
  .actions{display:flex; gap:9px; align-items:center;}

  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 16px;
    border-radius:var(--radius-sm); background:var(--card); color:var(--text);
    border:1px solid var(--border); font-size:13.5px; font-weight:600;
    box-shadow:0 1px 2px rgba(56,44,20,.05);
    transition:border-color .14s var(--ease), box-shadow .14s var(--ease), transform .14s var(--ease);
  }
  .btn:hover{border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0); box-shadow:0 1px 2px rgba(56,44,20,.05);}
  .btn.icon{width:42px; padding:0; justify-content:center; font-size:17px;}
  .btn.primary{background:linear-gradient(135deg,#D7AC45,var(--accent)); color:var(--accent-ink); border:none; box-shadow:0 10px 22px -10px rgba(184,137,35,.55);}
  .btn.primary:hover{filter:brightness(1.04);}

  /* ===== 자유 배치 보드 ===== */
  .board{
    position:relative; min-height:60vh;
    background-image:radial-gradient(var(--dot) 1.3px, transparent 1.3px);
    background-size:26px 26px; border-radius:18px;
  }
  .card{
    position:absolute; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 16px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    transition:box-shadow .16s var(--ease), border-color .16s var(--ease);
    animation:pop .18s var(--ease) both; overflow:hidden;
  }
  .card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-lift);}
  .card.moving,.card.sizing{transition:none; box-shadow:var(--shadow-lift); border-color:var(--accent);}
  @keyframes pop{from{opacity:0; transform:scale(.99);}}
  .card .head{display:flex; align-items:center; gap:8px; margin-bottom:11px; cursor:grab; flex:none;}
  .card.moving .head{cursor:grabbing;}
  .card .head .ttl{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .card .head .ttl .ico{font-size:15px;}
  .card .head .sp{flex:1;}
  .hact{width:27px; height:27px; border-radius:9px; display:grid; place-items:center; background:transparent; color:var(--faint); font-size:13px; opacity:.45; transition:opacity .13s var(--ease), background .13s var(--ease), color .13s var(--ease);}
  .card:hover .hact{opacity:1;}
  .hact:hover{background:var(--card-2); color:var(--text);}
  .hact.del:hover{color:var(--danger);}
  .card .body{flex:1; overflow:auto; min-height:0; margin:-2px; padding:2px;}

  /* 카드 크기조절 손잡이 */
  .rsz{position:absolute; right:3px; bottom:3px; width:18px; height:18px; cursor:nwse-resize; opacity:0; transition:opacity .13s; z-index:5;}
  .card:hover .rsz{opacity:.55;}
  .rsz:hover{opacity:1;}
  .rsz::after{content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); border-radius:0 0 3px 0;}

  /* 창 크기조절 손잡이 (오른쪽 아래) */
  #winResize{position:fixed; right:0; bottom:0; width:20px; height:20px; z-index:900; cursor:nwse-resize; display:none;}
  body.app #winResize{display:block;}
  #winResize::after{content:""; position:absolute; right:4px; bottom:4px; width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint);}

  /* 공통 폼 */
  input,textarea,select{font-family:inherit; color:var(--text); background:var(--bg-soft); border:1px solid var(--border); border-radius:11px; padding:10px 12px; font-size:14px; outline:none; width:100%; transition:border-color .13s var(--ease), box-shadow .13s var(--ease), background .13s var(--ease);}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:focus,textarea:focus,select:focus{border-color:var(--accent); background:var(--card); box-shadow:0 0 0 3px var(--accent-soft);}
  .row{display:flex; gap:8px;}
  .mini{height:38px; padding:0 13px; border-radius:11px; font-size:13px; font-weight:600; background:var(--card); color:var(--text); border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px; transition:border-color .13s var(--ease), background .13s var(--ease); white-space:nowrap;}
  .mini:hover{border-color:var(--border-strong);}
  .mini.go{background:var(--accent-soft); color:var(--accent-2); border-color:transparent; font-weight:700;}
  .mini.go:hover{background:rgba(184,137,35,.2);}
  .empty{color:var(--muted); font-size:13px; line-height:1.6; padding:6px 2px;}

  .clock .time{font-size:50px; font-weight:800; letter-spacing:-1.5px; line-height:1; font-variant-numeric:tabular-nums;}
  .clock .time .sec{font-size:22px; font-weight:600; color:var(--accent); vertical-align:super; margin-left:4px;}
  .clock .sub{margin-top:10px; color:var(--muted); font-size:13.5px;}

  .wx .now{display:flex; align-items:center; gap:13px;}
  .wx .emoji{font-size:44px; line-height:1;}
  .wx .temp{font-size:40px; font-weight:800; letter-spacing:-1.5px;}
  .wx .temp small{font-size:17px; color:var(--muted); font-weight:600;}
  .wx .desc{color:var(--muted); font-size:13px;}
  .wx .wxloc{cursor:pointer; display:inline-block; transition:color .13s;}
  .wx .wxloc:hover{color:var(--accent);}
  .wx .meta{display:flex; gap:14px; margin-top:11px; color:var(--muted); font-size:12.5px; flex-wrap:wrap;}
  .wx .meta b{color:var(--text); font-weight:700;}
  .wx .fc{display:flex; gap:7px; margin-top:13px;}
  .wx .fc .d{flex:1; text-align:center; background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:8px 3px;}

  .spin{display:inline-block; width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  ::-webkit-scrollbar{width:8px; height:8px;}

<script>
/* ===== 저장 / 불러오기 ===== */
let state = { theme:"dark", widgets:[] };
let booted = false, maxZ = 1;

function hasApi(n){ return !!(window.pywebview && window.pywebview.api && window.pywebview.api[n]); }
async function persist(){
  if(!_ready) return;
  snapshotLays();
  state.savedAt = Date.now();
  const data = JSON.stringify(state);
  try{ localStorage.setItem("dash.state", data); }catch(e){}
  if(hasApi("save_state")){ try{ await window.pywebview.api.save_state(data); }catch(e){} }
  if(typeof Sync!=="undefined") Sync.queuePush();
}
/* 다른 컴퓨터에서 가져온 내용을 저장할 때: 저장 시각을 바꾸지 않아 다시 올리지 않음 */
async function saveLocalOnly(){
  const data = JSON.stringify(state);
  try{ localStorage.setItem("dash.state", data); }catch(e){}
  if(hasApi("save_state")){ try{ await window.pywebview.api.save_state(data); }catch(e){} }
}
async function loadState(){
  let py=null, ls=null;
  if(hasApi("load_state")){ try{ const r=await window.pywebview.api.load_state(); if(r) py=r; }catch(e){} }
  try{ ls=localStorage.getItem("dash.state"); }catch(e){}
  const parse=(d)=>{ try{ const p=JSON.parse(d); return (p&&p.widgets)?p:null; }catch(e){ return null; } };
  const pp=parse(py), pl=parse(ls);
  let chosen=null;
  if(pp&&pl){ chosen = ((pl.savedAt||0) > (pp.savedAt||0)) ? pl : pp; }
  else { chosen = pp||pl; }
  if(chosen) state=chosen;
}
async function httpGet(url){
  if(hasApi("http_get")){
    const res=await window.pywebview.api.http_get(url);
    if(res&&res.ok) return res.text;
    throw new Error((res&&res.error)||"요청 실패");
  }
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return await r.text();
}
function openLink(url){ if(hasApi("open_url")) window.pywebview.api.open_url(url); else window.open(url,"_blank"); }
async function openPath(path){ if(!hasApi("open_path")){ toast("이 기능은 설치형(exe)에서만 동작해요"); return; } try{ const r=await window.pywebview.api.open_path(path); if(r&&!r.ok){ toast(r.error==="notfound"?"경로를 찾을 수 없어요":"열지 못했어요"); } }catch(e){ toast("열지 못했어요"); } }

function printContent(title, html){
  let area=document.getElementById("printArea");
  if(!area){ area=document.createElement("div"); area.id="printArea"; document.body.appendChild(area); }
  area.innerHTML=html;
  document.body.classList.add("printing");
  const done=()=>{ document.body.classList.remove("printing"); window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  setTimeout(()=>{ try{ window.print(); }catch(e){ done(); } },60);
}

let _calPop=null;
function closeCalendar(){ if(_calPop){ _calPop.remove(); _calPop=null; document.removeEventListener("pointerdown",_calOutside,true); document.removeEventListener("keydown",_calEsc,true); } }
function _calOutside(e){ if(_calPop && !_calPop.contains(e.target)) closeCalendar(); }
function _calEsc(e){ if(e.key==="Escape") closeCalendar(); }
function openCalendar(anchor, initial, onPick){
  closeCalendar();
  const pop=el("div","calpop"); _calPop=pop;
  const view=new Date(initial.getFullYear(), initial.getMonth(), 1);
  const z=n=>String(n).padStart(2,"0");
  const render=()=>{
    const y=view.getFullYear(), m=view.getMonth(), dim=new Date(y,m+1,0).getDate(), startDow=new Date(y,m,1).getDay();
    const days=["일","월","화","수","목","금","토"]; const todayY=ymd(new Date()), selY=ymd(initial);
    let h=`<div class="cal-h"><button data-pm>‹</button><span>${y}년 ${m+1}월</span><button data-nm>›</button></div><div class="cal-grid">`;
    days.forEach((d,i)=>h+=`<div class="cal-w${i===0?' sun':i===6?' sat':''}">${d}</div>`);
    for(let i=0;i<startDow;i++) h+=`<div></div>`;
    for(let dn=1; dn<=dim; dn++){ const ds=`${y}${z(m+1)}${z(dn)}`, dow=new Date(y,m,dn).getDay(); const cl=["cal-d"]; if(ds===todayY)cl.push("today"); if(ds===selY)cl.push("sel"); if(dow===0)cl.push("sun"); if(dow===6)cl.push("sat"); h+=`<div class="${cl.join(' ')}" data-d="${dn}">${dn}</div>`; }
    h+=`</div>`; pop.innerHTML=h;
    $("[data-pm]",pop).onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
    $("[data-nm]",pop).onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
    [...pop.querySelectorAll("[data-d]")].forEach(c=>c.onclick=()=>{ const picked=new Date(view.getFullYear(), view.getMonth(), +c.dataset.d); closeCalendar(); onPick(picked); });
  };
  render(); document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  let left=Math.max(8, Math.min(r.left+r.width/2-pop.offsetWidth/2, window.innerWidth-pop.offsetWidth-8));
  let top=r.bottom+6; if(top+pop.offsetHeight>window.innerHeight-8) top=Math.max(8, r.top-pop.offsetHeight-6);
  pop.style.left=left+"px"; pop.style.top=top+"px";
  setTimeout(()=>{ document.addEventListener("pointerdown",_calOutside,true); document.addEventListener("keydown",_calEsc,true); },0);
}

/* ===== 유틸 ===== */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const isoOf=s=>`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v/8)*8;
let toastTimer=null;
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1700);}

/* ===== 위젯 정의 (시계/날씨/할일/급식/디데이/바로가기) ===== */
const WIDGETS = {
  netswitch:{ title:"인터넷 전환", icon:"🔌", desc:"유선과 무선(와이파이)을 버튼 하나로 전환합니다.", special:true,
    defaultCfg:()=>({}),
    mount(b,w){ b.classList.add("nsw");
      b.innerHTML=`<div class="nsw-body" data-body><div class="empty"><span class="spin"></span> 확인 중…</div></div>`;
      this.load(b,w);
      if(w._timer) clearInterval(w._timer);
      w._timer=setInterval(()=>{ if(!document.body.contains(b)){ clearInterval(w._timer); w._timer=null; return; } this.load(b,w,true); }, 20000); },
    async diagnose(b,w){ const out=$("[data-body]",b);
      out.innerHTML=`<div class="empty"><span class="spin"></span> 진단 중…</div>`;
      let r=null; try{ r=await window.pywebview.api.net_diagnose(); }catch(e){}
      if(!r){ out.innerHTML=`<div class="empty">진단하지 못했어요.</div>`; return; }
      let h=`<div class="nsw-dt">진단 결과</div>`;
      (r.steps||[]).forEach(x=>{
        h+=`<div class="nsw-d ${x.ok?"ok":"no"}"><span>${x.ok?"✔":"✕"}</span>
          <div><b>${escapeHtml(x.name)}</b>${x.note?`<i>${escapeHtml(x.note)}</i>`:""}</div></div>`; });
      const bad=(r.steps||[]).filter(x=>!x.ok);
      if(bad.length){
        const tip = bad.some(x=>x.name.indexOf("실행 정책")>=0) ? "PowerShell 실행이 차단되어 있습니다. 학교 보안 정책일 수 있어요."
          : bad.some(x=>x.name.indexOf("어댑터")>=0) ? "유선 또는 무선 어댑터를 찾지 못했습니다."
          : bad.some(x=>x.name.indexOf("마지막 오류")>=0) ? "위 오류 내용을 알려 주시면 원인을 찾을 수 있어요."
          : "위 항목 중 X 표시된 부분이 원인입니다.";
        h+=`<div class="nsw-tip">${tip}</div>`;
      } else {
        h+=`<div class="nsw-tip ok">문제가 없어 보입니다. 다시 전환해 보세요.</div>`;
      }
      h+=`<div class="nsw-btns" style="margin-top:10px"><button class="mini" data-back>돌아가기</button></div>`;
      out.innerHTML=h;
      const bb=$("[data-back]",out); if(bb) bb.onclick=()=>this.load(b,w); },
    async load(b,w,quiet){ const out=$("[data-body]",b);
      if(!hasApi("net_status")){ out.innerHTML=`<div class="empty">설치형(exe)에서만 동작해요.</div>`; return; }
      let r=null; try{ r=await window.pywebview.api.net_status(); }catch(e){}
      if(!r||!r.ok||(!r.wired&&!r.wifi)){ out.innerHTML=`<div class="empty">네트워크 어댑터를 찾지 못했어요.</div>`; return; }
      this.draw(b,w,r); },
    draw(b,w,r){ const out=$("[data-body]",b);
      const row=(o,label,icon)=>{ if(!o) return `<div class="nsw-row off"><span class="nsw-i">${icon}</span><div class="nsw-t"><b>${label}</b><i>없음</i></div></div>`;
        const on=o.up, dis=o.disabled;
        return `<div class="nsw-row ${on?"on":(dis?"dis":"")}"><span class="nsw-i">${icon}</span>
          <div class="nsw-t"><b>${label}</b><i>${escapeHtml(o.name)}</i></div>
          <span class="nsw-s">${on?"연결됨":(dis?"꺼짐":"대기")}</span></div>`; };
      out.innerHTML = row(r.wired,"유선","🖧") + row(r.wifi,"무선","📶") +
        `<div class="nsw-btns">
           <button class="mini" data-go="wired">유선만</button>
           <button class="mini" data-go="wifi">무선만</button>
           <button class="mini" data-go="both">둘 다</button>
         </div>
         <div class="nsw-foot"><span class="nsw-note">전환할 때 Windows 권한 확인 창이 한 번 뜹니다.</span>
           <button class="nsw-diag" data-diag>진단</button></div>`;
      const db=$("[data-diag]",out);
      if(db) db.onclick=()=>this.diagnose(b,w);
      [...out.querySelectorAll("[data-go]")].forEach(btn=>{
        btn.onclick=async()=>{
          const all=[...out.querySelectorAll("[data-go]")];
          all.forEach(x=>x.disabled=true); btn.textContent="전환 중…";
          let res=null; try{ res=await window.pywebview.api.net_switch(btn.dataset.go); }catch(e){}
          if(res&&res.ok){ toast("전환 완료"); this.draw(b,w,res.status); }
          else {
            const rs=(res&&res.reason)||"failed";
            const msg = rs==="denied" ? "권한 승인이 취소되었어요"
                      : rs==="timeout" ? "시간이 초과되었어요. 다시 시도해 주세요"
                      : rs==="no_adapter" ? "전환할 어댑터를 찾지 못했어요"
                      : "전환하지 못했어요";
            toast(msg);
            all.forEach(x=>x.disabled=false);
            this.load(b,w);
            if(res&&res.detail){ const d=$(".nsw-err",out)||el("div","nsw-err"); d.textContent=res.detail;
              if(!d.isConnected) out.appendChild(d); }
          }
        }; }); } },

  aiusage:{ title:"Claude 사용량", icon:"📊", desc:"Claude 구독의 5시간·주간 사용량을 확인합니다.", special:true,
    defaultCfg:()=>({}),
    mount(b,w){ b.classList.add("aiu");
      b.innerHTML=`<div class="aiu-body" data-body><div class="empty"><span class="spin"></span> 불러오는 중…</div></div>`;
      this.load(b,w);
      if(w._timer) clearInterval(w._timer);
      w._timer=setInterval(()=>{ if(!document.body.contains(b)){ clearInterval(w._timer); w._timer=null; return; } this.load(b,w); }, 600000); },
    toMs(ts){
      if(ts===null||ts===undefined||ts==="") return 0;
      if(typeof ts==="number"){ return ts>1e12 ? ts : ts*1000; }
      const str=String(ts).trim();
      if(/^\d+$/.test(str)){ const n=Number(str); return n>1e12 ? n : n*1000; }
      const t=Date.parse(str);
      return isNaN(t) ? 0 : t;
    },
    fmtLeft(ts){
      const at=this.toMs(ts); if(!at) return "";
      const ms=at-Date.now(); if(ms<=0) return "곧 초기화";
      const m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
      if(!isFinite(m)) return "";
      if(d>=1) return `${d}일 ${h%24}시간 후 초기화`;
      if(h>=1) return `${h}시간 ${m%60}분 후 초기화`;
      return `${m}분 후 초기화`; },
    async aiDiag(b,w){ const out=$("[data-body]",b);
      out.innerHTML=`<div class="empty"><span class="spin"></span> 진단 중…</div>`;
      let r=null; try{ r=await window.pywebview.api.ai_diagnose(); }catch(e){}
      if(!r){ out.innerHTML=`<div class="empty">진단하지 못했어요.</div>`; return; }
      let h=`<div class="aiu-dt">진단 결과</div>`;
      (r.steps||[]).forEach(x=>{
        h+=`<div class="aiu-d ${x.ok?"ok":"no"}"><span>${x.ok?"✔":"✕"}</span>
          <div><b>${escapeHtml(x.name)}</b>${x.note?`<i>${escapeHtml(x.note)}</i>`:""}</div></div>`; });
      h+=`<div class="aiu-btns" style="margin-top:11px">
            <button class="mini" data-back>돌아가기</button>
            <button class="mini" data-copy>내용 복사</button>
            <button class="mini" data-conn3>다시 연결</button></div>`;
      out.innerHTML=h;
      const bb=$("[data-back]",out); if(bb) bb.onclick=()=>this.load(b,w);
      const c3=$("[data-conn3]",out); if(c3) c3.onclick=()=>this.showConnect(b,w);
      const cb=$("[data-copy]",out);
      if(cb) cb.onclick=()=>{
        const txt=(r.steps||[]).map(x=>`${x.ok?"OK":"실패"} | ${x.name} | ${x.note}`).join("\n");
        try{ navigator.clipboard.writeText(txt); toast("복사했습니다"); }catch(e){ toast("복사하지 못했어요"); }
      };
    },
    showInstall(b,w){ const out=$("[data-body]",b);
      out.innerHTML=`<div class="aiu-guide"><div class="aiu-gi">📦</div>
        <div class="aiu-gt">Claude Code 설치가 필요합니다</div>
        <div class="aiu-gs">사용량을 가져오려면 <b>Claude Code</b>가 있어야 합니다.<br>한 번만 설치하면 됩니다.</div>
        <div class="aiu-steps">
          <div>1. 아래 [설치 페이지 열기] 클릭</div>
          <div>2. 안내대로 설치 (5분 정도)</div>
          <div>3. 이 위젯으로 돌아와 [연결하기]</div>
        </div>
        <button class="mini go" data-open style="margin-top:12px">설치 페이지 열기</button>
        <button class="aiu-rf" data-back style="margin-top:10px">돌아가기</button></div>`;
      const ob=$("[data-open]",out); if(ob) ob.onclick=()=>openLink("https://code.claude.com/docs/ko/quickstart");
      const bb=$("[data-back]",out); if(bb) bb.onclick=()=>this.showConnect(b,w);
    },
    showConnect(b,w,msg){ const out=$("[data-body]",b);
      out.innerHTML=`<div class="aiu-guide"><div class="aiu-gi">🔐</div>
        <div class="aiu-gt">Claude Code에 로그인하면 표시됩니다</div>
        <div class="aiu-gs">${msg||"아래 버튼을 누르면 Claude Code가 열립니다.<br>로그인한 뒤 창을 닫고 돌아오시면 됩니다."}</div>
        <div class="aiu-btns">
          <button class="mini go" data-conn>연결하기</button>
          <button class="mini" data-recheck>확인</button>
        </div>
        <button class="aiu-rf" data-help style="margin-top:10px">Claude Code 설치 방법</button></div>`;
      const cb=$("[data-conn]",out);
      if(cb) cb.onclick=async()=>{
        cb.disabled=true; cb.textContent="여는 중…";
        let rr=null; try{ rr=await window.pywebview.api.claude_refresh(); }catch(e){}
        cb.disabled=false; cb.textContent="연결하기";
        if(rr&&rr.ok) toast("열린 창에서 로그인한 뒤 [확인]을 눌러 주세요");
        else if(rr&&rr.reason==="not_installed") this.showInstall(b,w);
        else toast("창을 열지 못했어요");
      };
      const rc=$("[data-recheck]",out);
      if(rc) rc.onclick=async()=>{
        rc.disabled=true; rc.textContent="확인 중…";
        try{ await window.pywebview.api.ai_retry_now(); }catch(e){}
        this.load(b,w);
      };
      const hb=$("[data-help]",out); if(hb) hb.onclick=()=>this.showInstall(b,w);
    },
    async load(b,w){ const out=$("[data-body]",b);
      if(!hasApi("ai_usage")){ out.innerHTML=`<div class="empty">설치형(exe)에서만 동작해요.</div>`; return; }
      let r=null; try{ r=await window.pywebview.api.ai_usage(false); }catch(e){}
      if(!r||!r.ok){
        const why=(r&&r.reason)||"offline";

          }
        }
        main.innerHTML=`<div class="now"><div class="emoji">${wc.e}</div><div><div class="temp">${Math.round(cur.temperature_2m)}<small>°C</small></div><div class="desc wxloc" title="지역 변경">📍 ${escapeHtml(c.name)} · ${wc.k}</div></div></div>
          <div class="meta"><span>체감 <b>${Math.round(cur.apparent_temperature)}°</b></span>${(tmax!=null)?`<span>최고·최저 <b>${tmax}° / ${tmin}°</b></span>`:""}<span>습도 <b>${cur.relative_humidity_2m}%</b></span><span>바람 <b>${cur.wind_speed_10m.toFixed(1)}㎧</b></span>${(rain!=null)?`<span>강수확률 <b>${rain}%</b></span>`:""}</div><div class="air" data-air></div>${hr?`<div class="hrs">${hr}</div>`:""}<div class="fc">${fc}</div><div class="wsrc">${usedKma?"기상청(KMA) 모델 · 1.5km":"글로벌 모델"} · ${new Date().getHours()}시 ${pad(new Date().getMinutes())}분 기준</div>`;
        const lc=$(".wxloc",main); if(lc) lc.onclick=()=>this.openSettings(b,w);

  files:{ title:"폴더·파일", icon:"📂", desc:"내 PC의 폴더·파일·프로그램을 아이콘으로 열기.",
    defaultCfg:()=>({items:[]}),
    kindOf(path){ const p=(path||"").trim().replace(/["']/g,""); const low=p.toLowerCase();
      if(["바탕화면","desktop","다운로드","downloads","문서","documents","사진","pictures","홈","home"].includes(low)) return "folder";
      const m=low.match(/\.([a-z0-9]{1,5})$/); if(!m) return "folder";
      if(["exe","bat","cmd","com","msi","lnk","app"].includes(m[1])) return "app"; return "file"; },
    iconFor(kind){ return kind==="folder"?"📁":kind==="app"?"⚙️":"📄"; },
    mount(b,w){ b.classList.add("apps");
      b.innerHTML=`<div class="fpick"><button class="mini" data-pf>📁 폴더 선택</button><button class="mini" data-pfile>📄 파일 선택</button></div>
        <div class="quickpick" data-quick></div><div class="fconfirm" data-confirm style="display:none"></div><div class="grid-ic" data-list></div>`;
      const quicks=["바탕화면","다운로드","문서"]; const qb=$("[data-quick]",b);
      quicks.forEach(q=>{ const c=el("button","qp",q); c.onclick=()=>{ w.config.items.push({id:uid(),name:q,path:q,kind:"folder"}); persist(); this.draw(b,w); }; qb.appendChild(c); });
      const confirm=$("[data-confirm]",b);

        $(".fc-p",confirm).textContent=path; const cn=$("[data-cn]",confirm); cn.value=base; cn.title=path;
        const doAdd=()=>{ const nm=cn.value.trim()||base; w.config.items.push({id:uid(),name:nm,path:path,kind:kind}); persist(); confirm.style.display="none"; confirm.innerHTML=""; this.draw(b,w); };
        $("[data-cadd]",confirm).onclick=doAdd; cn.addEventListener("keydown",e=>{if(e.key==="Enter")doAdd();}); cn.focus(); cn.select(); };
      const pick=async(kind)=>{ if(!hasApi("pick_path")){ toast("이 기능은 설치형(exe)에서만 동작해요"); return; } try{ const r=await window.pywebview.api.pick_path(kind); if(r&&r.ok&&r.path){ showConfirm(r.path, kind==="folder"?"folder":this.kindOf(r.path)); } }catch(e){ toast("선택 창을 열지 못했어요"); } };
      $("[data-pf]",b).onclick=()=>pick("folder"); $("[data-pfile]",b).onclick=()=>pick("file");
      this.draw(b,w); },
    draw(b,w){ const list=$("[data-list]",b); list.innerHTML=""; if(!w.config.items.length){list.innerHTML=`<div class="empty">폴더·파일·프로그램을 추가하면 아이콘으로 모여요.</div>`; return;}
      w.config.items.forEach(it=>{ const kind=it.kind||this.kindOf(it.path);
        const tile=el("div","ic"); tile.title=it.path; tile.dataset.rid=it.id;
        tile.innerHTML=`<div class="ic-img"><span class="ic-emoji">${this.iconFor(kind)}</span></div><div class="ic-nm">${escapeHtml(it.name)}</div><div class="ic-x">✕</div>`;
        tile.onclick=()=>openPath(it.path); $(".ic-x",tile).onclick=e=>{e.stopPropagation(); w.config.items=w.config.items.filter(x=>x.id!==it.id); persist(); this.draw(b,w);};
        inlineRename($(".ic-nm",tile), ()=>it.name, v=>{it.name=v;}, ()=>{persist(); this.draw(b,w);});
        list.appendChild(tile);});
      enableListDnD(list, w.config.items, persist); } },

  news:{ title:"경제 뉴스", icon:"📰", desc:"국내외 경제 뉴스 헤드라인(RSS).",
    defaultCfg:()=>({feed:"gko"}),
    feeds:{ gko:{name:"국내경제",url:"https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko"}, stock:{name:"증시",url:"https://news.google.com/rss/search?q=%EC%A6%9D%EC%8B%9C&hl=ko&gl=KR&ceid=KR:ko"}, donga:{name:"동아경제",url:"http://rss.donga.com/economy.xml"}, world:{name:"해외경제",url:"https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en"} },
    mount(b,w){ b.classList.add("news"); if(!this.feeds[w.config.feed]) w.config.feed=Object.keys(this.feeds)[0];

    renderSrc(b,w){ const wrap=$("[data-src]",b); wrap.innerHTML=""; Object.keys(this.feeds).forEach(k=>{ const f=this.feeds[k]; const c=el("button","nsrc"+(w.config.feed===k?" on":""),f.name); c.onclick=()=>{ w.config.feed=k; persist(); this.renderSrc(b,w); this.load(b,w); }; wrap.appendChild(c); }); },
    async load(b,w){ const out=$("[data-list]",b); if(!out)return; out.innerHTML=`<div class="empty"><span class="spin"></span> 불러오는 중…</div>`;
      const f=this.feeds[w.config.feed]||this.feeds[Object.keys(this.feeds)[0]];

        const arr=items.slice(0,12).map(it=>{ const tn=it.querySelector("title"); const t=(tn?tn.textContent:"").trim(); let link=""; const l=it.querySelector("link"); if(l) link=(l.getAttribute("href")||l.textContent||"").trim(); return {t,link}; }).filter(x=>x.t);
        if(!arr.length){ out.innerHTML=`<div class="empty">불러올 뉴스가 없어요. 다른 출처를 눌러 보세요.</div>`; return; }
        out.innerHTML=""; arr.forEach(n=>{ const row=el("div","nitem"); const tt=el("div","ntitle"); tt.textContent=n.t; row.appendChild(tt); if(n.link) row.onclick=()=>openLink(n.link); out.appendChild(row); });
      }catch(e){ out.innerHTML=`<div class="empty">뉴스를 불러오지 못했어요. 다른 출처를 눌러 보거나 잠시 후 다시 시도하세요.</div>`; } } },

  stocks:{ title:"시세", icon:"📈", desc:"주식·코인·환율·원자재 실시간 시세.",
    defaultCfg:()=>({items:[]}),
    mount(b,w){ b.classList.add("stk");
      b.innerHTML=`<div class="row"><input placeholder="예: 삼성전자, AAPL, 비트코인, 달러, WTI, 금" data-q><button class="mini go" data-find>추가</button></div><div class="sresult" data-res></div><div class="stk-list" data-list></div>`;
      const q=$("[data-q]",b), res=$("[data-res]",b);
      const addItem=(o)=>{ if(!w.config.items.some(i=>i.code===o.code&&i.src===o.src)){ w.config.items.push(Object.assign({id:uid()},o)); persist(); } q.value=""; res.innerHTML=""; this.draw(b,w); toast(`${o.name} 추가`); };
      const find=async()=>{ const raw=q.value.trim(); if(!raw)return; res.innerHTML=`<div class="empty"><span class="spin"></span> 찾는 중…</div>`;
        try{
          const low=raw.toLowerCase().replace(/\s/g,"");
          if(/^\d{6}$/.test(raw)){ const nm=await this.krName(raw)||raw; addItem({src:"kr",code:"A"+raw,name:nm}); return; }
          const pre=PRESETS.find(p=>p.a.includes(low)); if(pre){ addItem({src:pre.src,code:pre.code,name:pre.name}); return; }
          const dc=KR_STOCKS[raw]||KR_STOCKS[raw.replace(/\s/g,"")]||KR_STOCKS[low]||KR_STOCKS[raw.toUpperCase()];
          if(dc){ addItem({src:"kr",code:"A"+dc,name:raw}); return; }
          const coins=await this.coinSearch(raw);
          if(coins&&coins.length){
            const exact=coins.find(c=>c.name===raw||c.code.split("-")[1]===raw.toUpperCase());
            if(exact){ addItem({src:"coin",code:exact.code,name:exact.name}); return; }
            res.innerHTML=""; coins.forEach(c=>{ const e=el("div","si",`<div class="sn">${escapeHtml(c.name)}</div><div class="sr">코인 · ${c.code.split("-")[1]}</div>`); e.onclick=()=>addItem({src:"coin",code:c.code,name:c.name}); res.appendChild(e); }); return;
          }
          if(/^[\^A-Za-z][A-Za-z0-9.\-=]*$/.test(raw)){ addItem({src:"yahoo",code:raw.toUpperCase(),name:raw.toUpperCase()}); return; }
          res.innerHTML=`<div class="empty">못 찾았어요. 예) 삼성전자·005930, AAPL, 비트코인·BTC, 달러, WTI, 금</div>`;
        }catch(e){ res.innerHTML=`<div class="empty">검색 실패. 인터넷 연결을 확인하세요.</div>`; } };
      $("[data-find]",b).onclick=find;
      attachAutocomplete(q,{ min:1, delay:200, source:async(qv)=>{ const ql=qv.toLowerCase().replace(/\s/g,""); const out=[]; const seen={};
          const push=(o,score)=>{ const k=o.value.src+o.value.code; if(seen[k])return; seen[k]=1; o._s=score; out.push(o); };
          for(const nm in KR_STOCKS){ const code=KR_STOCKS[nm]; const key=nm.toLowerCase(); const idx=key.indexOf(ql); if(idx>=0){ push({label:nm, sub:"국내주식 "+code, value:{src:"kr",code:"A"+code,name:nm}}, idx===0?0:1); } }
          PRESETS.forEach(p=>{ const hit=p.a.some(a=>a.includes(ql)) || p.name.toLowerCase().includes(ql); if(hit){ const st=p.a.some(a=>a.startsWith(ql))?0:1; push({label:p.name, sub:(p.src==="coin"?"코인":"환율·원자재·지수"), value:{src:p.src,code:p.code,name:p.name}}, st); } });
          try{ const ms=await coinMarkets(); ms.forEach(m=>{ const sym=m.market.split("-")[1].toLowerCase(); const kn=(m.korean_name||""); if(kn.includes(qv)||sym.startsWith(ql)){ push({label:kn||m.market, sub:"코인 "+m.market.split("-")[1], value:{src:"coin",code:m.market,name:kn||m.market}}, (kn.startsWith(qv)||sym.startsWith(ql))?0:1); } }); }catch(e){}
          return out.sort((a,c)=>a._s-c._s).slice(0,8); },
        onPick:(v)=>addItem(v), onEnter:find });
      if(w._timer) clearInterval(w._timer); w._timer=setInterval(()=>this.refresh(b,w), 20000);
      this.draw(b,w); },
    refresh(b,w){ const list=$("[data-list]",b); if(!list||!document.body.contains(b)){ if(w._timer){clearInterval(w._timer); w._timer=null;} return; } const rows=[...list.querySelectorAll("[data-rid]")]; rows.forEach((row,idx)=>{ const it=w.config.items.find(x=>x.id===row.dataset.rid); if(it) setTimeout(()=>this.loadQuote(row,it), idx*180); }); },
    async krName(code6){ try{ const j=JSON.parse(await httpGet(`https://polling.finance.naver.com/api/realtime/domestic/stock/${code6}`)); const d=j.datas&&j.datas[0]; return d&&d.stockName||null; }catch(e){ return null; } },
    async coinSearch(query){ try{ const ms=await coinMarkets(); const q=query.trim(), ql=q.toLowerCase();
        return ms.filter(m=>{ const sym=m.market.split("-")[1].toLowerCase(); const kn=m.korean_name||"", en=(m.english_name||"").toLowerCase(); return kn===q||kn.includes(q)||sym===ql||en===ql||en.includes(ql); }).slice(0,8).map(m=>({code:m.market,name:m.korean_name||m.market.split("-")[1]})); }catch(e){ return []; } },
    draw(b,w){ const list=$("[data-list]",b); if(!list)return; if(!w.config.items.length){ list.innerHTML=`<div class="empty">관심 종목·코인을 추가해 보세요. (국내주식: 종목명·6자리 코드 / 해외주식: 티커 / 코인: 비트코인·BTC)</div>`; return; }
      list.innerHTML=""; w.config.items.forEach((it,idx)=>{ const row=el("div","sq"); row.dataset.rid=it.id;
        row.innerHTML=`<div class="sq-l"><div class="sq-n"></div><div class="sq-s">${it.code}</div></div><div class="sq-r"><span class="spin"></span></div><div class="sq-x">✕</div>`;
        $(".sq-n",row).textContent=it.name;
        $(".sq-x",row).onclick=(e)=>{ e.stopPropagation(); w.config.items=w.config.items.filter(x=>x.id!==it.id); persist(); this.draw(b,w); };
        row.onclick=()=>{ if(_cvtOpen.has(it.id)) _cvtOpen.delete(it.id); else _cvtOpen.add(it.id); this.loadQuote(row,it); };
        list.appendChild(row); setTimeout(()=>this.loadQuote(row,it), idx*180); });
      enableListDnD(list, w.config.items, persist); },
    async loadQuote(row,it){ const r=$(".sq-r",row); if(!r)return; const num=v=>typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(/,/g,""))||0;
      const krw=v=>Math.abs(v)>=100?Math.round(v).toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:2});
      const finish=(price,ccy,html)=>{ _lastQuote[it.id]=html; r.innerHTML=html; if(_cvtOpen.has(it.id)) this.appendConv(r,price,ccy); };
      try{
        if(it.src==="coin"){
          let d=null; try{ const j=JSON.parse(await httpGet(`https://api.upbit.com/v1/ticker?markets=${it.code}`)); d=Array.isArray(j)?j[0]:null; }catch(_){}
          if(d&&d.trade_price!=null){
            const price=num(d.trade_price), change=num(d.signed_change_price), rate=num(d.signed_change_rate)*100;
            const up=(d.change?d.change==="RISE":change>=0);
            return finish(price,"KRW",`<div class="sq-p">₩${krw(price)}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${krw(Math.abs(change))} (${Math.abs(rate).toFixed(2)}%)</div>`);
          }
          const meta=await yahooChart(String(it.code).split("-")[1]+"-KRW");
          if(!meta){ if(_lastQuote[it.id]){ r.innerHTML=_lastQuote[it.id]; } else { r.innerHTML=`<span class="sq-na">불러오기 실패</span>`; } return; }
          const price=meta.regularMarketPrice, base=meta.chartPreviousClose||meta.previousClose||price, diff=price-base, pct=base?diff/base*100:0, up=diff>=0;
          return finish(price,"KRW",`<div class="sq-p">₩${krw(price)}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${krw(Math.abs(diff))} (${Math.abs(pct).toFixed(2)}%)</div>`);
        }else if(it.src==="yahoo"){
          const meta=await yahooChart(it.code);
          if(!meta){ if(_lastQuote[it.id]){ r.innerHTML=_lastQuote[it.id]; } else { r.innerHTML=`<span class="sq-na">불러오기 실패</span>`; } return; }
          const price=meta.regularMarketPrice, base=meta.chartPreviousClose||meta.previousClose||price;
          const diff=price-base, pct=base?diff/base*100:0, up=diff>=0;
          return finish(price,meta.currency||"",`<div class="sq-p">${fmtMoney(price,meta.currency)}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(Math.abs(diff))} (${Math.abs(pct).toFixed(2)}%)</div>`);
        }else{
          const code6=String(it.code).replace(/^A/,"");
          const j=JSON.parse(await httpGet(`https://polling.finance.naver.com/api/realtime/domestic/stock/${code6}`));
          const d=j.datas&&j.datas[0];
          if(!d||d.closePrice==null){ if(_lastQuote[it.id]){ r.innerHTML=_lastQuote[it.id]; } else { r.innerHTML=`<span class="sq-na">정보 없음</span>`; } return; }
          const price=num(d.closePrice), change=num(d.compareToPreviousClosePrice), rate=num(d.fluctuationsRatio);
          const dir=d.compareToPreviousPrice&&(d.compareToPreviousPrice.code||d.compareToPreviousPrice.name);
          const up=dir?(dir==="1"||dir==="2"||/상승|상한/.test(String(dir))):(change>=0);
          return finish(price,"KRW",`<div class="sq-p">${fmtMoney(price,"KRW")}</div><div class="sq-c ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(Math.abs(change))} (${Math.abs(rate).toFixed(2)}%)</div>`);
        }
      }catch(e){ if(_lastQuote[it.id]){ r.innerHTML=_lastQuote[it.id]; } else { r.innerHTML=`<span class="sq-na">불러오기 실패</span>`; } } },
    appendConv(r,price,ccy){ usdKrw().then(rate=>{ if(!rate||!r.isConnected)return; let line=""; if(ccy==="KRW"){ line=`≈ $${(price/rate).toLocaleString(undefined,{maximumFractionDigits:2})}`; } else if(ccy==="USD"){ line=`≈ ₩${Math.round(price*rate).toLocaleString()}`; } if(line){ const e=document.createElement("div"); e.className="sq-cvt"; e.textContent=line; r.appendChild(e); } }); } }
};

function inlineRename(elm, get, set, done){
  elm.style.cursor="text"; elm.title="더블클릭하면 이름 수정";
  elm.addEventListener("pointerdown",e=>e.stopPropagation());
  elm.addEventListener("click",e=>{ e.stopPropagation(); e.preventDefault(); });
  elm.addEventListener("dblclick",e=>{ e.stopPropagation(); e.preventDefault();
    const inp=document.createElement("input"); inp.className="nm-edit"; inp.value=get();
    inp.onpointerdown=ev=>ev.stopPropagation(); inp.onclick=ev=>ev.stopPropagation();
    elm.replaceWith(inp); inp.focus(); inp.select();
    let fin=false; const commit=(save)=>{ if(fin)return; fin=true; if(save){ const v=inp.value.trim(); if(v) set(v); } done(); };
    inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter")commit(true); else if(ev.key==="Escape")commit(false); });
    inp.addEventListener("blur",()=>commit(true));
  });
}

function attachAutocomplete(input, opts){
  if(input._acPop){ try{input._acPop.remove();}catch(e){} }
  const pop=el("div","ac-pop"); document.body.appendChild(pop); pop.style.display="none"; input._acPop=pop;
  let items=[], active=-1, timer=null, seq=0;
  const close=()=>{ pop.style.display="none"; active=-1; clearTimeout(timer); seq++;   /* 대기 중·진행 중 검색 무효화 */
    if(!input.isConnected){ try{ pop.remove(); }catch(e){} } };
  const place=()=>{ const r=input.getBoundingClientRect(); pop.style.left=r.left+"px"; pop.style.top=(r.bottom+4)+"px"; pop.style.minWidth=r.width+"px"; };
  const render=()=>{ if(!items.length||!input.isConnected||document.activeElement!==input){ close(); return; } pop.innerHTML=""; items.forEach((it,i)=>{ const r2=el("div","ac-item"+(i===active?" on":"")); const l=el("span","ac-l"); l.textContent=it.label; r2.appendChild(l); if(it.sub){ const s=el("span","ac-s"); s.textContent=it.sub; r2.appendChild(s); } r2.onmousedown=(e)=>{ e.preventDefault(); pick(it); }; pop.appendChild(r2); }); place(); pop.style.display="block"; };
  const pick=(it)=>{ close(); opts.onPick(it.value,it); };
  const run=async()=>{ const qv=input.value.trim(); if(qv.length<(opts.min||1)){ items=[]; close(); return; } const my=++seq; let r=[]; try{ r=await opts.source(qv); }catch(e){ r=[]; } if(my!==seq)return; items=(r||[]).slice(0,8); active=-1; render(); };
  input.addEventListener("input",()=>{ clearTimeout(timer); timer=setTimeout(run,opts.delay||170); });
  input.addEventListener("keydown",(e)=>{ const open=pop.style.display!=="none";
    if(e.key==="ArrowDown"&&open){ e.preventDefault(); active=Math.min(active+1,items.length-1); render(); }
    else if(e.key==="ArrowUp"&&open){ e.preventDefault(); active=Math.max(active-1,0); render(); }
    else if(e.key==="Enter"){ if(open&&active>=0&&items[active]){ e.preventDefault(); pick(items[active]); } else { close(); if(opts.onEnter) opts.onEnter(); } }
    else if(e.key==="Escape"){ close(); } });
  input.addEventListener("blur",()=>{ setTimeout(close,120); });
  return {close};
}

/* 행 전체를 잡고 끌어 순서 바꾸기 — 들어 올리고 다른 항목이 밀려남 (세로 목록) */
function enableListDnD(list, arr, onDone){
  if(!list) return;
  list.querySelectorAll("[data-rid]").forEach(row=>{
    row.addEventListener("pointerdown", e=>{
      if(e.button!==0) return;
      if(e.target.closest(".box, .x, .sq-x, .ic-x, .rx, .hact, input, select, textarea, button")) return;
      const startX=e.clientX, startY=e.clientY; let dragging=false, ph=null, offX=0, offY=0;
      const begin=()=>{
        dragging=true; const rect=row.getBoundingClientRect(); offX=startX-rect.left; offY=startY-rect.top;
        const zb=list.closest(".body"); const zf=zb?(parseFloat(getComputedStyle(zb).zoom)||1):1;
        ph=document.createElement("div"); ph.className="dnd-ph"; ph.style.width=(rect.width/zf)+"px"; ph.style.height=(rect.height/zf)+"px";
        list.insertBefore(ph, row);
        row.classList.add("lift");
        row.style.width=rect.width+"px"; row.style.height=rect.height+"px"; row.style.position="fixed"; row.style.left=rect.left+"px"; row.style.top=rect.top+"px"; row.style.margin="0"; row.style.zIndex="3000"; row.style.pointerEvents="none";
        document.body.appendChild(row);
      };
      const move=ev=>{
        if(!dragging){ if(Math.abs(ev.clientY-startY)<5 && Math.abs(ev.clientX-startX)<5) return; begin(); }
        row.style.left=(ev.clientX-offX)+"px"; row.style.top=(ev.clientY-offY)+"px";
        const sibs=[...list.querySelectorAll("[data-rid]")];
        let best=null, bd=Infinity, before=true;
        for(const s of sibs){ const bx=s.getBoundingClientRect(); const cx=bx.left+bx.width/2, cy=bx.top+bx.height/2; const d=Math.hypot(ev.clientX-cx, ev.clientY-cy);
          if(d<bd){ bd=d; best=s; before=(ev.clientY<cy-bx.height*0.2)?true:(ev.clientY>cy+bx.height*0.2?false:(ev.clientX<cx)); } }
        if(best){ list.insertBefore(ph, before?best:best.nextSibling); } else { list.appendChild(ph); }
      };
      const up=()=>{
        document.removeEventListener("pointermove",move,true); document.removeEventListener("pointerup",up,true);
        if(dragging){
          row.classList.remove("lift");
          row.style.position=""; row.style.left=""; row.style.top=""; row.style.width=""; row.style.height=""; row.style.margin=""; row.style.zIndex=""; row.style.pointerEvents="";
          if(ph){ list.insertBefore(row, ph); ph.remove(); }
          const order=[...list.querySelectorAll("[data-rid]")].map(r=>r.dataset.rid);
          arr.sort((a,b)=>{ const ia=order.indexOf(String(a.id)), ib=order.indexOf(String(b.id)); if(ia<0&&ib<0)return 0; if(ia<0)return 1; if(ib<0)return -1; return ia-ib; });
          const swallow=ev2=>{ ev2.stopPropagation(); ev2.preventDefault(); row.removeEventListener("click",swallow,true); };
          row.addEventListener("click",swallow,true); setTimeout(()=>row.removeEventListener("click",swallow,true),350);
          if(onDone) onDone();
        }
      };
      document.addEventListener("pointermove",move,true); document.addEventListener("pointerup",up,true);
    });
  });
}

/* 항목 끌어서 순서 바꾸기 (목록형 위젯 공용) */
function enableReorder(list, arr, onDone){
  if(!list) return;
  list.querySelectorAll(".drag-h").forEach(h=>{
    const row=h.closest("[data-rid]"); if(!row) return;
    h.addEventListener("click", ev=>ev.stopPropagation());
    h.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation(); row.classList.add("dragging");
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      const move=ev=>{
        const rows=[...list.querySelectorAll("[data-rid]:not(.dragging)")];
        let best=null, bd=Infinity, before=true;
        rows.forEach(r=>{ const bx=r.getBoundingClientRect(); const cx=bx.left+bx.width/2, cy=bx.top+bx.height/2; const d=Math.hypot(ev.clientX-cx, ev.clientY-cy);
          if(d<bd){ bd=d; best=r; before=(ev.clientY<cy-0.5)||(Math.abs(ev.clientY-cy)<=bx.height/2 && ev.clientX<cx); } });
        if(best){ list.insertBefore(row, before?best:best.nextSibling); } else { list.appendChild(row); }
      };
      const up=()=>{ try{ h.releasePointerCapture(e.pointerId); }catch(_){}
        h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up); row.classList.remove("dragging");
        const order=[...list.querySelectorAll("[data-rid]")].map(r=>r.dataset.rid);
        arr.sort((a,b)=>{ const ia=order.indexOf(String(a.id)), ib=order.indexOf(String(b.id)); if(ia<0&&ib<0)return 0; if(ia<0)return 1; if(ib<0)return -1; return ia-ib; });
        if(onDone) onDone();
      };
      h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
    });
  });
}

function rdLay(o){ return mode==="max" ? (o.layoutMax||o.layout) : o.layout; }
function applyPos(card,w){ const L=lay(w); card.style.left=L.x+"px"; card.style.top=L.y+"px"; card.style.width=L.w+"px"; card.style.height=L.h+"px"; card.style.zIndex=L.z||1; }
function bringFront(card,w){ const L=lay(w); L.z=++maxZ; card.style.zIndex=L.z; }
function growBoard(){ let max=320; state.widgets.forEach(w=>{ const L=rdLay(w); if(L) max=Math.max(max, L.y+L.h); }); board.style.height=(max+40)+"px"; }
function overlap(a,b){ return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y); }
function findFreeSpot(wd,ht){ const bw=boardW()||1000; const step=24; for(let y=0;y<5000;y+=step){ for(let x=0;x+wd<=bw;x+=step){ const cand={x,y,w:wd,h:ht}; const hit=state.widgets.some(o=>{ const lo=rdLay(o); return lo&&overlap(cand,lo); }); if(!hit) return {x,y}; } } return {x:0,y:0}; }

function mountCard(w){
  const def=WIDGETS[w.type]; if(!def) return null;
  const card=el("div","card"); card.dataset.id=w.id; card.dataset.type=w.type; applyPos(card,w);
  const head=el("div","head");
  const ttl=el("div","ttl",`<span class="ico">${def.icon}</span><span class="tname"></span>`);
  $(".tname",ttl).textContent = w.title || def.title;
  head.appendChild(ttl); head.appendChild(el("div","sp"));
  const ren=el("div","hact",`✎`); ren.title="제목 변경"; ren.onpointerdown=e=>e.stopPropagation(); ren.onclick=()=>renameTitle(ttl,w,def); head.appendChild(ren);
  if(def.print){ const pr=el("div","hact",`🖨`); pr.title="인쇄"; pr.onpointerdown=e=>e.stopPropagation(); pr.onclick=()=>{ const o=def.print(w); printContent(o.title,o.html); }; head.appendChild(pr); }
  if(def.settings){ const gear=el("div","hact",`⚙`); gear.title="설정"; gear.onpointerdown=e=>e.stopPropagation(); gear.onclick=()=>def.openSettings($(".body",card),w); head.appendChild(gear); }
  const fnt=el("div","hact",`가`); fnt.title="글꼴·크기"; fnt.onpointerdown=e=>e.stopPropagation(); fnt.onclick=()=>openFontMenu(fnt,w,card); head.appendChild(fnt);
  const del=el("div","hact del",`✕`); del.title="삭제"; del.onpointerdown=e=>e.stopPropagation(); del.onclick=()=>removeWidget(w,card); head.appendChild(del);
  const body=el("div","body"); const rsz=el("div","rsz");
  card.appendChild(head); card.appendChild(body); card.appendChild(rsz);
  applyCardFont(card,w);
  if(_bootPhase){ _mountQ.push(()=>{ try{ def.mount(body,w); }catch(e){} }); }
  else { try{ def.mount(body,w); }catch(e){} }
  enableMove(card,head,w); enableResize(card,rsz,w);
  card.addEventListener("pointerdown",()=>bringFront(card,w));
  return card;
}
function renameTitle(ttl,w,def){
  const cur=w.title||def.title;
  const inp=el("input"); inp.className="tedit"; inp.value=cur; inp.maxLength=24;
  inp.onpointerdown=e=>e.stopPropagation();
  const nameEl=$(".tname",ttl); nameEl.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const finish=(val)=>{ if(done)return; done=true; const ns=el("span","tname"); ns.textContent=val; inp.replaceWith(ns); };
  const commit=()=>{ const v=inp.value.trim(); w.title=v||def.title; finish(w.title); persist(); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){commit();} else if(e.key==="Escape"){finish(cur);} });
  inp.addEventListener("blur",commit);
}
function enableMove(card,head,w){
  head.addEventListener("pointerdown",e=>{
    if(e.target.closest(".hact")) return; e.preventDefault(); bringFront(card,w);
    const sTop=()=>window.pageYOffset||document.documentElement.scrollTop||0;
    const L=lay(w); const sx=e.clientX, sy=e.clientY+sTop(), ox=L.x, oy=L.y;
    card.classList.add("moving"); head.setPointerCapture(e.pointerId);
    let lastEv=e, autoT=null;
    const place=(cx,cy)=>{ let nx=snap(clamp(ox+(cx-sx),0,Math.max(0,boardW()-L.w))); let ny=snap(Math.max(0,oy+(cy-sy)));
      L.x=nx; L.y=ny; card.style.left=nx+"px"; card.style.top=ny+"px"; growBoard(); };
    const EDGE=80, STEP=16;
    autoT=setInterval(()=>{
      if(!lastEv) return; const vh=window.innerHeight; let dir=0;
      if(lastEv.clientY > vh-EDGE) dir=1; else if(lastEv.clientY < EDGE && sTop()>0) dir=-1;
      if(!dir) return;
      const before=sTop(); window.scrollBy(0, dir*STEP);
      if(sTop()!==before) place(lastEv.clientX, lastEv.clientY+sTop());
    },16);
    const mv=ev=>{ lastEv=ev; place(ev.clientX, ev.clientY+sTop()); };
    const up=()=>{ if(autoT){clearInterval(autoT); autoT=null;} head.releasePointerCapture(e.pointerId); head.removeEventListener("pointermove",mv); head.removeEventListener("pointerup",up); card.classList.remove("moving"); growBoard(); persist(); };
    head.addEventListener("pointermove",mv); head.addEventListener("pointerup",up);
  });
}
function enableResize(card,rsz,w){
  rsz.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation(); bringFront(card,w);
    const L=lay(w); const sx=e.clientX, sy=e.clientY, ow=L.w, oh=L.h; card.classList.add("sizing"); rsz.setPointerCapture(e.pointerId);
    const mv=ev=>{ let nw=snap(clamp(ow+(ev.clientX-sx),220,boardW()-L.x)); let nh=snap(Math.max(130,oh+(ev.clientY-sy))); L.w=nw; L.h=nh; card.style.width=nw+"px"; card.style.height=nh+"px"; growBoard(); };
    const up=()=>{ rsz.releasePointerCapture(e.pointerId); rsz.removeEventListener("pointermove",mv); rsz.removeEventListener("pointerup",up); card.classList.remove("sizing"); growBoard(); persist(); };
    rsz.addEventListener("pointermove",mv); rsz.addEventListener("pointerup",up);
  });
}

function addWidget(type){
  const def=WIDGETS[type]; const cfg=def.defaultCfg?def.defaultCfg():{}; const d=DEF_SIZE[type]||{w:320,h:240};
  const spot=findFreeSpot(d.w,d.h); const base={x:spot.x,y:spot.y,w:d.w,h:d.h,z:++maxZ};
  const w={id:uid(),type,config:cfg,layout:Object.assign({},base),layoutMax:Object.assign({},base)};
  state.widgets.push(w); const card=mountCard(w); if(card) board.appendChild(card); growBoard(); persist(); closeSheet(); toast(`${def.title} 위젯을 추가했어요`);
}
function removeWidget(w,card){ card.remove(); state.widgets=state.widgets.filter(x=>x.id!==w.id); growBoard(); persist(); toast("위젯을 삭제했어요"); }

/* ===== 화면 크기별 배치 기억 + 새 화면 자동 맞춤 ===== */
function screenKey(){ return Math.round(screen.availWidth||1920)+"x"+Math.round(screen.availHeight||1040); }
function _numL(L){
  if(!L||typeof L!=="object") return null;
  const n=(v,lo,hi)=>{ v=Number(v); v=isFinite(v)?Math.round(v):lo; return Math.min(hi,Math.max(lo,v)); };
  return {x:n(L.x,0,20000), y:n(L.y,0,20000), w:n(L.w,120,6000), h:n(L.h,90,6000), z:n(L.z||1,1,100000)};
}
/* 지금 배치를 이 화면용으로 기록 (저장할 때마다) */
function snapshotLays(){
  const k=screenKey();
  (state.widgets||[]).forEach(w=>{
    if(!w.lays||typeof w.lays!=="object"||Array.isArray(w.lays)) w.lays={};
    w.lays[k]={layout:_numL(w.layout), layoutMax:_numL(w.layoutMax)};
    const keys=Object.keys(w.lays);                 /* 화면 종류는 최근 6개까지만 */
    if(keys.length>6) keys.filter(x=>x!==k).slice(0,keys.length-6).forEach(x=>delete w.lays[x]);
  });
  state.lastKey=k;
}
/* 이 화면용 배치가 있으면 그것을, 없으면 다른 화면 배치를 비율로 맞춰 만든다 */
function adaptLayouts(){
  const k=screenKey(); const [tw,th]=k.split("x").map(Number);
  const derived=[];
  (state.widgets||[]).forEach(w=>{
    const lays=(w.lays&&typeof w.lays==="object"&&!Array.isArray(w.lays))?w.lays:null;
    if(!lays) return;                                /* 예전 데이터: 그대로 둠 */
    const mine=lays[k];
    if(mine&&(mine.layout||mine.layoutMax)){
      const fit=(L)=>{ L=_numL(L); if(!L) return null; L.w=Math.min(L.w,tw); L.x=Math.min(L.x,Math.max(0,tw-L.w)); return L; };
      if(mine.layout) w.layout=fit(mine.layout);
      if(mine.layoutMax) w.layoutMax=fit(mine.layoutMax);
      return;
    }
    const keys=Object.keys(lays).filter(x=>/^\d{3,5}x\d{3,5}$/.test(x));
    if(!keys.length) return;
    const src=keys.includes(state.lastKey)?state.lastKey:keys[keys.length-1];
    const [sw,sh]=src.split("x").map(Number); const S=lays[src]||{};
    const sx=tw/sw, sy=th/sh, sc=Math.min(sx,sy);
    const scale=(L)=>{ L=_numL(L); if(!L) return null;
      return {x:Math.round(L.x*sx), y:Math.round(L.y*sy),
              w:Math.max(200,Math.round(L.w*sc)), h:Math.max(130,Math.round(L.h*sc)), z:L.z}; };
    w.layout=scale(S.layout||S.layoutMax); w.layoutMax=scale(S.layoutMax||S.layout);
    derived.push(w);
  });
  if(derived.length){ ["layout","layoutMax"].forEach(f=>_settle(derived,f,tw)); }
  return derived.length;
}
/* 맞춰 만든 위젯이 화면 밖으로 나가거나 겹치면 정리 */
function _settle(derived,f,tw){
  const bw=Math.max(400,(boardW&&boardW())||tw-60);
  const placed=(state.widgets||[]).filter(w=>!derived.includes(w)&&w[f]).map(w=>w[f]);
  derived.slice().sort((a,b)=>((a[f]||{}).y-(b[f]||{}).y)||((a[f]||{}).x-(b[f]||{}).x)).forEach(w=>{
    const L=w[f]; if(!L) return;
    if(L.w>bw) L.w=bw;
    if(L.x+L.w>bw) L.x=Math.max(0,bw-L.w);
    for(let guard=0; guard<200; guard++){
      const hit=placed.find(o=>overlap(L,o)); if(!hit) break;
      L.y=hit.y+hit.h+12;
    }
    placed.push(L);
  });
}

/* 위젯 겹침 순서를 1..N으로 다시 매김 (일반·최대화 배치 각각). 숫자가 끝없이 커지는 것도 방지 */
function normalizeZ(){
  ["layout","layoutMax"].forEach(f=>{
    state.widgets.filter(w=>w[f]).sort((a,b)=>(a[f].z||1)-(b[f].z||1)).forEach((w,i)=>{ w[f].z=i+1; });
  });
  maxZ=state.widgets.length+1;
}

function assignLayouts(){
  normalizeZ();
  state.widgets.forEach(w=>{
    if(!w.config){ const def=WIDGETS[w.type]; w.config=def&&def.defaultCfg?def.defaultCfg():{}; }
    if(w.type==="weather" && (!w.config||w.config.lat==null)){ w.config={name:w.name||"서울",lat:w.lat||37.5665,lon:w.lon||126.9780}; }
    if(!w.layout || typeof w.layout.x!=="number"){ const d=DEF_SIZE[w.type]||{w:320,h:240}; const spot=findFreeSpot(d.w,d.h); w.layout={x:spot.x,y:spot.y,w:d.w,h:d.h,z:++maxZ}; }
  });
}

/* 시작할 때 위젯을 한꺼번에 띄우면 느려져서, 순서대로 나눠 띄웁니다 */
let _bootPhase=false, _mountQ=[];
function runMountQueue(){
  if(!_mountQ.length){ _bootPhase=false; return; }
  const batch=_mountQ.splice(0,2);
  batch.forEach(fn=>fn());
  if(_mountQ.length) setTimeout(runMountQueue, 90);
  else _bootPhase=false;
}
function renderAll(){ board.innerHTML=""; state.widgets.forEach(w=>{ const c=mountCard(w); if(c) board.appendChild(c); }); growBoard(); }
function clampAll(){ state.widgets.forEach(w=>{ const c=cardOf(w.id); if(c) applyPos(c,w); }); growBoard(); }

function relTime(ms){
  if(!ms) return "아직 없음";
  const d=Math.max(0, Date.now()-ms), m=Math.floor(d/60000);
  if(m<1) return "방금"; if(m<60) return m+"분 전";
  const h=Math.floor(m/60); if(h<24) return h+"시간 전";
  return Math.floor(h/24)+"일 전";
}

function applyRemoteState(json){
  let rs; try{ rs=JSON.parse(json); }catch(e){ return false; }
  if(!rs||typeof rs!=="object"||!Array.isArray(rs.widgets)) return false;
  const known=new Set(Object.keys(WIDGETS));
  rs.widgets=rs.widgets.filter(w=>w&&typeof w==="object"&&known.has(w.type)
    &&typeof w.id==="string"&&w.id.length>0&&w.id.length<80);
  rs.widgets.forEach(w=>{
    if(!w.config||typeof w.config!=="object"||Array.isArray(w.config)) w.config={};
    if(typeof w.title!=="undefined"&&typeof w.title!=="string") delete w.title;
    if(Array.isArray(w.config.items)){
      w.config.items=w.config.items.filter(it=>!(it&&typeof it==="object"&&"url" in it)
        || /^https?:\/\//i.test(String(it.url)));
    }
    if(w.type==="files"){            /* 폴더·파일 경로는 컴퓨터마다 다르므로 이 컴퓨터 것 유지 */
      const mine=(state.widgets||[]).find(x=>x.id===w.id);
      w.config.items=(mine&&mine.config&&Array.isArray(mine.config.items))?mine.config.items:[];
    }
  });
  if(typeof rs.theme!=="string"||!/^[a-z0-9_-]{1,24}$/i.test(rs.theme)) rs.theme=state.theme;
  state=rs;
  adaptLayouts(); assignLayouts(); snapshotLays();
  saveLocalOnly();
  applyTheme(); updateTopbar(); renderAll();
  return true;
}

    let ok=false, why="";
    try{
      if(kind==="keep"){ const r=await this.push(true); ok=!!(r&&r.ok); if(!ok) why=(r&&(r.detail||r.reason))||"알 수 없음"; }

};

 ["gungsuh","궁서",'"Gungsuh","궁서","Batang",serif']
];
const FSIZES=[["xs","아주 작게",.75],["sm","작게",.88],["md","보통",1],["lg","크게",1.18],["xl","아주 크게",1.4],["xxl","매우 크게",1.7]];

function applyCardFont(card,w){
  const f=FONTS.find(x=>x[0]===(w.font||""));
  loadFont(w.font||"");
  FONTS.forEach(x=>{ if(x[0]) card.classList.remove("f-"+x[0]); });
  if(f&&f[2]){ card.style.setProperty("font-family", f[2], "important"); card.classList.add("hasfont","f-"+f[0]); }
  else { card.style.removeProperty("font-family"); card.classList.remove("hasfont"); }
  const z=FSIZES.find(x=>x[0]===(w.fsize||"md"));
  card.style.setProperty("--fz", z?z[2]:1);
  card.classList.toggle("fz", !!(z&&z[2]!==1));
}
function openFontMenu(anchor,w,card){
  const old=document.getElementById("fontPop"); if(old){ old.remove(); if(old.dataset.for===w.id) return; }
  const pop=el("div","fontpop"); pop.id="fontPop"; pop.dataset.for=w.id;
  pop.innerHTML=`<div class="fp-t">글꼴</div><div class="fp-g" data-f></div><div class="fp-t">글자 크기</div><div class="fp-g z" data-z></div>`;
  const fg=$("[data-f]",pop), zg=$("[data-z]",pop);
  FONTS.forEach(f=>{ const b=el("button","fp-b"+(((w.font||"")===f[0])?" on":""),f[1]);
    if(f[2]) b.style.fontFamily=f[2];
    b.onclick=()=>{ w.font=f[0]; applyCardFont(card,w); persist(); openFontMenu(anchor,w,card); };
    fg.appendChild(b); });
  FSIZES.forEach(z=>{ const b=el("button","fp-b"+(((w.fsize||"md")===z[0])?" on":""),z[1]);
    b.onclick=()=>{ w.fsize=z[0]; applyCardFont(card,w); persist(); openFontMenu(anchor,w,card); };
    zg.appendChild(b); });
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  let left=Math.max(8,Math.min(r.left-pop.offsetWidth+r.width, window.innerWidth-pop.offsetWidth-8));
  let top=r.bottom+6; if(top+pop.offsetHeight>window.innerHeight-8) top=Math.max(8,r.top-pop.offsetHeight-6);
  pop.style.left=left+"px"; pop.style.top=top+"px";
  const close=(e)=>{ if(!pop.contains(e.target)&&e.target!==anchor){ pop.remove(); document.removeEventListener("pointerdown",close,true);} };
  setTimeout(()=>document.addEventListener("pointerdown",close,true),0);
}

function memoDatesToday(text){
  const now=new Date(), M=now.getMonth()+1, D=now.getDate(), Y=now.getFullYear(); const out=[];
  (text||"").split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const pats=[ /(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/, /(?:^|[^\d])(\d{1,2})[-.\/](\d{1,2})(?![\d\-.\/])/, /(\d{1,2})\s*월\s*(\d{1,2})\s*일/ ];
    for(let i=0;i<pats.length;i++){ const m=t.match(pats[i]); if(!m) continue;
      let mo,da; if(i===0){ if(+m[1]!==Y) continue; mo=+m[2]; da=+m[3]; } else { mo=+m[1]; da=+m[2]; }
      if(mo===M&&da===D){ out.push(t); break; }
    }
  });
  return out;
}
